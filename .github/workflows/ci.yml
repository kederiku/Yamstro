          forbid  "critère 5  donnée de jeu dans l'état de glissement" -n '(spawn|insert)\(.*Relic(Instance|Id)\b|held: *Option<Entity>|held: *Option<u32>' "$DRAG"
          forbid  "critère 5  unwrap dans le glissement"   -n 'unwrap\(\)' "$DRAG"
          forbid_prod "critère 5  expect en production dans le glissement" '\.expect\(' "$DRAG"
          # L'action existe hors du système de souris : sans cela l'Étape 11,
