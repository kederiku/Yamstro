          forbid  "critère 7  ressource Inventory nue"    -n '\bInventory\b' crates/
          forbid  "critère 7  registre ou composant porteur de relique" -n '\bRelicRegistry\b|\bRelicComponent\b|\bRelicSlot\b' crates/
          # L'attribut, pas son nom : les notes de reversion l'écrivent en prose.
          forbid  "critère 1  lint éteint par complaisance" -n '#\[allow\(unused_variables\)\]|#\[allow\(dead_code\)\]' crates/
