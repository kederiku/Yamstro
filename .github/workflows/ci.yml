          forbid  "critère 5  sérialisation par objet-trait" -n '#\[typetag|typetag::|^\s*typetag\s*=' crates/ --glob '**/Cargo.toml' --glob '**/*.rs'
          forbid  "critère 5  état de relique en table de chaînes" -n 'state_data\s*[:=]' crates/
