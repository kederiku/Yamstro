          forbid  "critère 5  multiplication par une relique additive" -n 'ScoreAction::MultiplyMult\(' crates/core_engine/src/relics/definitions/triplet_master.rs crates/core_engine/src/relics/definitions/full_house_architect.rs crates/core_engine/src/relics/definitions/stellar_alignment.rs
          require "critère 5  note de vigilance sur l'alignement" -n 'MultiplyMult\(175\)' crates/core_engine/src/relics/definitions/stellar_alignment.rs
