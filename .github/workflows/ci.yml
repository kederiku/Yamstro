          require "critère 6  constantes de courbe, à un seul endroit" -n 'const BASE_ANTE_1_MILLI: u64 = 300_000;' "$SCALING"
          forbid  "critère 6  seconde courbe de difficulté" -n 'BASE_TARGET|ANTE_GROWTH_MILLI|fn base_target|fn scale_milli' crates/
