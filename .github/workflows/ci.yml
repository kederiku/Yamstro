name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `rustup show` n'installe plus la toolchain active depuis rustup 1.28.0.
      # L'auto-installation est revenue en 1.28.1 et le runner porte 1.29.0,
      # mais elle se coupe par RUSTUP_AUTO_INSTALL ou `rustup set auto-install
      # disable`. On installe donc explicitement, forme recommandée par le
      # changelog de rustup. Le canal et les composants viennent de
      # rust-toolchain.toml (TASK-01).
      - name: Toolchain (pilotée par rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain
          cargo --version

      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p core_engine --no-default-features
      - run: cargo build -p core_engine --features bevy

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2

      # Le volet 1 emploie les commandes du corpus **telles qu'elles sont
      # écrites**, en rg. ripgrep n'est préinstallé sur aucune image de runner
      # Ubuntu ; noble le fournit dans universe, activé par défaut ici. Une
      # installation ratée fait échouer cette étape, jamais la suivante en
      # silence.
      - name: ripgrep (le volet 1 emploie les commandes rg du corpus)
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version

      # Volet 1 de TASK-15.
      - name: Invariants normatifs (volet 1)
        run: |
          set -euo pipefail
          status=0

          # rg rend 0 s'il trouve, 1 s'il ne trouve rien, 2 s'il a échoué.
          # La forme « ! rg ... » confond 1 et 2 : un chemin devenu faux, ou un
          # binaire absent, passerait pour du code propre. Installer ripgrep n'y
          # change rien, c'est la négation qui avale l'erreur. On lit donc le
          # code de sortie au lieu de le nier.
          forbid() {
            label=$1; shift
            out=$(rg "$@" 2>&1) && rc=0 || rc=$?
            case $rc in
              1) printf '  ok    %s\n' "$label" ;;
              0) printf '  ECHEC %s\n%s\n' "$label" "$out"; status=1 ;;
              *) printf '  ECHEC %s : rg a échoué (code %s)\n%s\n' "$label" "$rc" "$out"; status=1 ;;
            esac
          }

          # Contre-épreuve : le motif DOIT être présent. Garde la saturation
          # contre une suppression silencieuse.
          require() {
            label=$1; shift
            out=$(rg "$@" 2>&1) && rc=0 || rc=$?
            case $rc in
              0) printf '  ok    %s\n' "$label" ;;
              *) printf '  ECHEC %s : motif attendu absent (code %s)\n%s\n' "$label" "$rc" "$out"; status=1 ;;
            esac
          }

          SRC=crates/core_engine/src

          forbid  "critère 6  aucun f64"                 -n '\bf64\b' "$SRC"
          forbid  "critère 7  littéraux de gameplay"     -n '\b(dice_count|base_rerolls|relic_capacity|consumable_capacity|max_interest|hands_per_blind)\s*[:=]\s*[0-9]' "$SRC" -g '!**/cups/definitions/**'
          forbid  "critère 7  fabriques de RunConfig"    -n 'RunConfig\s*\{' "$SRC" -g '!**/cups/definitions/**' -g '!**/config.rs'
          forbid  "critère 8  soustraction nue"          -n '\w*(reroll|hand|gold|slot|capacity|count|interest)\w*\s*(-=|- )' "$SRC"
          forbid  "critère 8  sub non saturants"         -n 'wrapping_sub|overflowing_sub|unchecked_sub' "$SRC"
          require "critère 8  saturation présente"       -n 'saturating_(add|sub)' "$SRC"
          forbid  "critère 9  aucun HashMap ni HashSet"  -n 'HashMap|HashSet' "$SRC"
          # Les huit noms sont ancrés aux limites de mot. Sans l'ancrage, la
          # variante normative « Hook::OnScoringDie » contient la sous-chaîne
          # « ScoringDie » et ferait échouer la garde ; c'est le TYPE de ce nom
          # qui est proscrit, pas le moment qu'il nomme (CONTEXT.md).
          forbid  "critère 10 noms proscrits"            -n '\b(evaluate_dice|evaluate_hand|HandEvaluation|RollSession|rerolls_remaining|rerolls_per_hand|ScoringDie|RoundContext|grid_levels|RelicTrigger|RelicHook)\b' crates/
          # Les quatre hooks sont déclarés dans trigger.rs, mais l'Étape 2 n'en
          # câble que deux. Un point d'appel de OnRoll ou OnRoundEnd ailleurs
          # dans le pipeline produirait des effets fantômes dans le journal.
          forbid  "critère 10 hooks non câblés"          -n 'OnRoll|OnRoundEnd' "$SRC/scoring" -g '!**/trigger.rs'
          forbid  "critère 10 le mot défausse"           -ni 'défausse|defausse' crates/
          # § 1.5 : RunSession.gold est la seule source de vérité de l'or.
          # `gold` est canonique ; ces deux noms-là ne le sont pas.
          forbid  "critère 10 noms proscrits pour l'or"  -n '\bmoney\b|\bRunEconomy\b' crates/
          forbid  "critère 5  ReflectResource"           -n 'ReflectResource|reflect\(Resource\)' crates/

          # ---- Étape 2 : invariants de clôture (TASK-27, volet 1) ----
          # Les motifs sont ancrés sur l'USAGE, jamais sur la mention. Dans leur
          # forme nue, trois d'entre eux échouaient sur des commentaires que
          # TASK-20, TASK-21 et TASK-26 exigeaient d'écrire : une garde qui
          # interdit un nom interdit aussi la phrase expliquant qu'on ne s'en
          # sert pas.
          forbid  "critère 5  objet-trait relique"       -n 'trait Relic\b|dyn Relic|Box<dyn' crates/core_engine
          forbid  "critère 5  actions hors des trois"    -n 'MultiplyScore|SetFormula' crates/
          forbid  "critère 5  resolve renommée"          -n 'ScoringPipeline::(execute|run)\b' crates/
          forbid  "critère 7  le pipeline ne commet rien" -n '\.current_score|\.hands_remaining|\.used_hands|advance_state\(' "$SRC/scoring"
          forbid  "critère 7  aucune source d'aléa"      -n '\brng\b|RunRng|rand::|thread_rng' "$SRC/scoring"
          forbid  "critère 6  feature test-fixtures"     -n 'test-fixtures"|^\s*test-fixtures\s*=' crates/
          # L'exclusion de animation.rs n'est pas une échappatoire : c'est la
          # distinction que le corpus pose lui-même à TASK-30 — « les flottants
          # sont légitimes ici : l'interdiction porte sur l'arithmétique de
          # score, tenue en point fixe, pas sur l'animation ». Un ressort a
          # besoin d'un seuil de repos, qui EST une comparaison approchée.
          forbid  "critère 2  comparaison approchée"     -n 'assert_relative_eq|EPSILON|\bapprox::|abs\(\)\s*<' crates/ -g '!**/animation.rs'
          require "critère 2  égalités exactes"          -n 'assert_eq!' "$SRC/scoring"

          # ---- Étape 3 : mise en place d'une manche (TASK-32) ----
          # Deux ancrages de plus, même défaut que ci-dessus. La garde du § 4
          # de TASK-32 interdit « - » entouré d'espaces dans tout le fichier :
          # elle vise une soustraction nue sur un compteur, pas un tiret de
          # prose. Et la garde des trois combinateurs supprimés en 0.19
          # attraperait le commentaire qui explique justement qu'on ne les
          # écrit pas ; elle est donc ancrée sur un appel.
          SETUP=crates/game_state/src/systems

          forbid  "critère 4  soustraction nue (manche)" -n '\w*(reroll|hand|gold|slot|capacity|count|interest|score|target|ante)\w*\s*(-=|- )' "$SETUP"
          forbid  "critère 4  aucun flottant (manche)"   -n '\bf32\b|\bf64\b' "$SETUP" -g '!**/animation.rs'
          forbid  "critère 4  combinateurs de 0.18"      -n '\b(run_in|run_after|run_before)\s*\(' crates/
          require "critère 4  stubs de malus marqués"    -n 'Étape 5|Étape 10' "$SETUP/setup.rs"

          # ---- Étape 3 : entrée dans une main (TASK-33) ----
          # Deux ancrages de plus, dix-septième et dix-huitième du corpus. La
          # garde « slot » du § 4 de TASK-33 vise un adressage par position
          # fixe ; nue, elle attrape « RelicInventory { slots: … } », nom d'un
          # champ public de core_engine. Et la garde « DicePool » vise une
          # instanciation ; nue, elle attrape les commentaires qui expliquent
          # justement qu'on n'en crée pas.
          forbid  "critère 4  positions fixes de dés"    -U '(?s)(0\.\.5|\[Entity; 5\]|\[Die; 5\]|\b(die_slots?|dice_slots?)\b|slots?\s*\[).*#\[cfg\(test\)\]' "$SETUP"
          forbid  "critère 4  littéraux de main"         -n 'rerolls_left\s*=\s*[0-9]|dice_count\s*=\s*[0-9]' "$SETUP"
          forbid  "critère 4  flux hors des dés"         -n 'rng\.(shop|boss|relic_effects)|thread_rng|from_entropy' "$SETUP"
          forbid  "critère 4  pool de dés en parallèle"  -n 'DicePool::new|DicePool\s*\{|:\s*DicePool\b|<DicePool>' crates/game_state/src
          # Aucun test ne peut voir cette relance : après le nettoyage des
          # verrous, force = true et force = false donnent le même résultat.
          # Le texte est donc la seule garde possible.
          forbid  "critère 5  relance forcée hors Étape 9" -n 'roll\([^)]*,\s*true\s*\)|force\s*:\s*true' "$SETUP"

          # ---- Étape 3 : entrées de la phase de lancer (TASK-34) ----
          # La garde « Digit[1-9] » du § 4 de TASK-34 n'est pas vérifiable par
          # une machine : elle demande que rg « ne remonte qu'une conversion
          # générique », ce qui est un jugement sur les lignes rendues et non
          # un code de sortie. Et KeyCode étant un enum sans arithmétique,
          # TOUTE conversion rang vers touche nomme les variantes quelque part.
          # On interdit donc ce qu'elle visait : brancher sur une touche.
          forbid  "critère 4  branches par touche"       -n '(if|match|==).*KeyCode::Digit' "$SETUP"
          # Le décrément à zéro est inatteignable, la relance étant refusée
          # avant : aucun test ne distingue saturating_sub d'un sub qui boucle.
          forbid  "critère 8  sub non saturants (états)" -n 'wrapping_sub|overflowing_sub|unchecked_sub' "$SETUP"
          # La garde posée ici par TASK-34 interdisait « selected_hand » dans
          # tout input.rs, ce qui était juste tant que select_hand n'y était
          # pas. TASK-36 l'y a écrite : l'invariant n'est plus « ce fichier
          # n'en parle pas » mais « deux fichiers seulement l'écrivent », et
          # c'est la garde du bloc TASK-36 qui le tient.
          forbid  "critère 10 noms de sélection proscrits" -n '\b(Selected|SelectedForScore)\b' crates/

          # ---- Étape 3 : évaluation des figures (TASK-35) ----
          # Trois ancrages. Les deux premiers remplacent des gardes du § 4 de
          # TASK-35 qui demandaient un jugement sur les lignes rendues et non un
          # code de sortie. Le troisième est le critère central du ticket : dans
          # sa forme nue, « selected_hand » interdit la ligne du test qui
          # prouve justement qu'aucune figure n'est choisie sans le joueur.
          # C'est l'ÉCRITURE du champ qui est proscrite, pas sa lecture.
          forbid  "critère 4  niveaux en ressource"      -n 'init_resource::<HandLevels>|insert_resource\(HandLevels' crates/game_state/src
          forbid  "critère 4  grille consommée écrite"   -n 'used_hands\s*\.\s*mark|used_hands\s*=' "$SETUP/evaluation.rs"
          forbid  "critère 4  figure choisie sans le joueur" -n 'selected_hand\s*=[^=]' "$SETUP/evaluation.rs"

          # ---- Étape 3 : sélection et soumission (TASK-36) ----
          # Trois ancrages de plus. La forme nue de la première attrape les
          # assertions du test qui prouve, précisément, que ces champs ne sont
          # pas écrits. La troisième exprime l'invariant réel — deux fichiers
          # autorisés à écrire la figure choisie, et deux seulement — au lieu
          # de compter des lignes, ce que le ticket faisait de travers : la
          # remise à zéro de setup.rs s'écrit avec deux-points et n'était pas
          # comptée, tandis qu'une ligne de test l'était.
          forbid  "critère 4  commit unique de l'Étape 4" -n 'used_hands\s*\.\s*mark|\.current_score\s*[-+]?=|\.hands_remaining\s*[-+]?=|advance_state\(' "$SETUP/submission.rs"
          forbid  "critère 4  aucun dé retiré à la soumission" -n '\.despawn\(|remove::<Die>|Without<Locked>' "$SETUP/submission.rs"
          forbid  "critère 4  écriture de la figure choisie" -n 'selected_hand\s*=[^=]' crates/game_state/src -g '!**/input.rs' -g '!**/setup.rs'

          # ---- Étape 3 : rapport de score (TASK-37) ----
          # Deux propriétés du § 2.2 de TASK-37 sont **inobservables** par un
          # test d'Étape 3, et le ticket se trompait en les croyant testables :
          # `pass_a_with` itère `hand.scoring_dice` et résout chaque
          # identifiant dans le slice, donc ni le filtrage du slice sur le
          # marqueur ni l'absence de tri ne changent le rapport. Elles
          # comptent pour `TriggerCtx.dice`, que les reliques liront aux
          # Étapes 5 et 9. Faute de test, on épingle la forme.
          require "critère 4  main complète passée au pipeline" -n 'dice: Query<\(&DieView, &Die\)>' "$SETUP/submission.rs"
          require "critère 4  slice de dés trié"          -n 'sort_unstable_by_key' "$SETUP/submission.rs"
          forbid  "critère 4  fin de manche hors Étape 4" -n 'RunPhase::RoundEnd' "$SETUP/submission.rs"

          # ---- Étape 3 : arbitrage de fin de manche (TASK-38) ----
          # Le § 4 de TASK-38 demandait que « chaque site utilise set_if_neq ou
          # justifie en commentaire » : un grep ne lit pas les justifications.
          # Le seul site justifié est la soumission, qui vise une phase ne
          # pouvant pas être la phase courante ; ailleurs, la forme qualifiée
          # est exigée. Et la garde sur le score attrapait les lignes de test
          # qui le POSENT — rien ne l'écrit encore, donc les scénarios doivent
          # bien l'établir. Ce qui l'interdit vraiment est le type.
          # **Corrigée à l'audit de TASK-52 : elle ne gardait rien.** Ancrée sur
          # le nom du receveur `next`, elle laissait passer `phase.set(..)` de
          # `round_end.rs`, dont le paramètre porte un autre nom — mesuré par
          # mutation. L'alternance couvre les noms employés en production et
          # doit s'étendre si un nouveau paraît ; la protection de fond, elle,
          # est le couple de TASK-29 sur `states.rs`, qui prouve qu'un `set` nu
          # vers l'état courant despawne, là où `set_if_neq` est inerte.
          forbid  "critère 4  set nu hors de la soumission" -n '\b(next|phase|app_state|etat)\.set\(' crates/game_state/src -g '!**/submission.rs'
          require "critère 4  arbitre en lecture seule"  -n 'blind: Option<Res<BlindContext>>' "$SETUP/round_end.rs"
          require "critère 4  transitions qualifiées"    -n 'NextState::set_if_neq' "$SETUP/round_end.rs"

          # ---- Étape 3 : overlay et animation (TASK-39) ----
          # Le § 4 de TASK-39 demandait « exactement une occurrence de
          # &mut Transform » : un compte de lignes, que le commentaire
          # expliquant le conflit d'accès fait déjà passer à deux. Le couple
          # interdire-dehors / exiger-dedans dit la même chose sans faux
          # positif. Et sa garde « ParamSet » refusait un ParamSet livré à
          # TASK-34 sur deux requêtes de dés, sans rapport avec les Transform :
          # elle est remplacée, pas contournée.
          # Élargie à TOUT le workspace à l'ouverture de l'Étape 4, et
          # l'exclusion porte le **chemin exact** du seul fichier autorisé —
          # non plus « n'importe quel animation.rs ». Sans cela, la migration
          # du juice vers `ui_and_juice` créerait un second écrivain dans un
          # second fichier du même nom, que la garde aurait laissé passer.
          # Quand le fichier déménagera, cette ligne devra bouger avec lui,
          # délibérément.
          # **Les deux lignes ont déménagé avec le fichier**, à TASK-43. C'était
          # prévu : TASK-42 avait posé l'exclusion sur un chemin exact
          # précisément pour que la migration ne puisse pas laisser deux
          # écrivains derrière elle, un par crate.
          # **Ré-ancrée sur l'acte à TASK-64** : un paramètre de système, donc
          # une requête. Le motif nu mordait la note qui explique pourquoi une
          # carte de relique, étant un nœud UI, ne porte pas de `Transform` et
          # échappe donc au ressort. Vingt-septième fois dans ce projet.
          forbid  "critère 4  unique écrivain de Transform" -n 'Query<[^>]*&mut Transform' crates/ -g '!crates/ui_and_juice/src/animation.rs'
          require "critère 4  l'animation écrit le Transform" -n 'Query<\(Entity, &mut Transform, &mut PunchScale\)>' crates/ui_and_juice/src/animation.rs
          # Une migration est un déplacement, pas une duplication : deux
          # `PunchScale` homonymes dans deux crates compilent parfaitement et
          # donnent deux systèmes écrivant des `Transform`.
          # **Ré-ancrée sur l'acte à TASK-64**, même raison : la note d'une
          # carte doit pouvoir nommer le ressort dont elle explique qu'il ne
          # l'atteint pas. Vingt-huitième fois.
          forbid  "critère 4  PunchScale resté dans game_state" -n 'PunchScale::|&mut PunchScale|<PunchScale>|use [^;]*PunchScale|struct PunchScale' crates/game_state
          forbid  "critère 4  overlay transformé en état" -n 'AppState::Settings|RunPhase::Settings|SettingsState' crates/game_state/src

          # ---- Étape 3 : budget WebAssembly (TASK-40) ----
          # Les profils vivent à la racine du workspace. Dans le manifeste d'une
          # crate membre ils sont ignorés, avec un simple avertissement, et la
          # mesure de taille serait faite avec le profil par défaut — c'est-à-
          # dire fausse de plusieurs mégaoctets, sans que rien ne le signale.
          forbid  "critère 4  profils hors de la racine" -n '^\[profile' crates/ --glob '**/Cargo.toml'
          forbid  "critère 4  lto partiel"               -n 'lto\s*=\s*"thin"' .
          forbid  "critère 4  nom wgpu de 0.18"          -n 'WgpuSettingsPriority::Compatibility' .
          require "critère 4  référence de taille wasm"  -n '^[0-9]+$' ci/wasm-size-baseline.txt

          # ---- Étape 4 : mise en scène (TASK-42) ----
          # Ancrées sur une **déclaration de dépendance**, jamais sur le nom.
          # Dans leur forme nue, les deux gardes du § 4 de TASK-42 n'attrapent
          # que le commentaire du manifeste qui dit qu'on n'en veut pas, et le
          # `//!` qui explique que ces combinateurs n'existent plus. Vingt-
          # deuxième et vingt-troisième fois dans ce projet.
          forbid  "critère 4  dépendance de tweening ou audio" -n '^\s*[a-z0-9_-]*(tween|kira|rodio|audio|vorbis|symphonia|seedling)[a-z0-9_-]*\s*=|"(bevy_audio|vorbis)"' --glob '**/Cargo.toml' crates/
          # Ancrée sur l'**acte** — la ligne de manifeste, l'import, le chemin —
          # et non sur le nom : la note qui explique pourquoi ce site d'appel
          # n'ordonne rien côté juice doit pouvoir le nommer. Vingt-quatrième
          # fois dans ce projet, et la première où c'est ma propre prose.
          forbid  "critère 4  dépendance inverse vers le juice" -n '^\s*ui_and_juice\s*=|use ui_and_juice|ui_and_juice::' crates/game_state crates/core_engine

          # ---- Étape 4 : compteurs interpolés (TASK-44) ----
          # La dérogation `f64` est **bornée à l'affichage** (ADR-003) : le
          # score commis reste le `u64` du pipeline. Ancrée sur une
          # déclaration ou une conversion, jamais sur le mot : le fichier
          # d'animation explique pourquoi il y a droit, et l'expliquer ne doit
          # pas déclencher la garde.
          forbid  "critère 4  f64 hors des compteurs"    -n ':\s*f64|->\s*f64|\bas f64\b|f64::from' crates/ui_and_juice/src -g '!crates/ui_and_juice/src/animation.rs'
          forbid  "critère 4  f64 dans le moteur ou les états" -n ':\s*f64|->\s*f64|\bas f64\b' crates/core_engine/src crates/game_state/src
          # Deux pièges 0.19 vérifiés à TASK-44 : `TextFont.font` est un
          # `FontSource` et `font_size` un `FontSize`, plus des types nus.
          forbid  "critère 9  font_size en flottant nu"  -n 'font_size:\s*[0-9]' crates/
          forbid  "critère 9  cosmic-text"               -n 'cosmic' crates/

          # ---- Étape 4 : secousse de caméra et réglages (TASK-45) ----
          # Le ticket demandait un « test » qui n'en est pas un : une commande
          # rg dans un tableau de tests unitaires. Sa place est ici, et le
          # motif est ancré sur des **identifiants**, jamais sur le mot : le
          # commentaire d'`apply_screen_shake` doit pouvoir expliquer qu'il ne
          # puise dans aucun flux de la partie sans déclencher la garde qu'il
          # documente. C'est le défaut que le corpus rejoue de ticket en
          # ticket.
          forbid  "critère 4  flux déterministe puisé par le juice" -n '\bRunRng\b|\brng\b|thread_rng|rand::|gen_range|random' crates/ui_and_juice/src
          # La caméra est le second écrivain de `Transform`, et le seul admis.
          # La garde du critère 4 plus haut l'autorise dans ce fichier ; celle-ci
          # exige qu'il y soit, et que la dérogation reste écrite.
          require "critère 4  la secousse écrit la caméra" -n 'Query<&mut Transform, With<Camera2d>>' crates/ui_and_juice/src/animation.rs
          require "critère 4  exception caméra documentée" -n 'la seule exception admise' crates/ui_and_juice/src/animation.rs
          # Écriture absolue : un cumul par frame et la caméra dérive hors cadre
          # sans que rien ne le signale.
          forbid  "critère 4  écriture caméra cumulative" -n 'translation(\.[xyz])?\s*\+=' crates/ui_and_juice/src
          # **Levée à TASK-51**, qui livre le flash et son intensité d'un seul
          # tenant. Elle nommait le ticket qui devait la lever : c'est ce qui
          # distingue une garde datée d'une garde oubliée.
          # `Resource` est un sous-trait de `Component` en 0.19 : poser une de
          # ces ressources sur une entité despawnerait silencieusement les
          # autres porteurs.
          forbid  "critère 4  réglages posés en composant" -n 'derive\(.*Component' crates/ui_and_juice/src/settings.rs

          # ---- Étape 4 : palier joué et fermeture du périmètre audio (TASK-46) ----
          # Les trois noms proscrits sont ancrés sur une **déclaration ou un
          # emploi**, jamais sur le nom nu : le module `events.rs` doit pouvoir
          # écrire pourquoi la v1 avait trois ressources pour un rôle sans
          # déclencher la garde qui l'interdit. Même ancrage que `f64` à
          # TASK-44. Une garde sur le mot « audio » serait déjà rouge
          # aujourd'hui : le titre de section de `lib.rs` et le commentaire de
          # `Cargo.toml` documentent tous deux cette absence.
          forbid  "critère 4  ressource de son déclarée ou employée" -n '(struct|enum|impl|::<|Res<|ResMut<|insert_resource\()\s*(AudioFeedbackConfig|ScoringAudioPool|SoundEffectBank)' crates/
          forbid  "critère 4  API audio de Bevy dans le juice" -n '\b(AudioPlayer|AudioSource|AudioSink|AudioBundle|PlaybackSettings)\b' crates/
          forbid  "critère 4  module audio dans le juice" --files crates/ui_and_juice/src -g 'audio.rs'
          # La hauteur est un livrable de l'Étape 8 (demi-ton tempéré, C41).
          # Ancré sur des identifiants : le `0\.05` que réclamait le ticket
          # proscrivait un littéral numérique, et mordait deux bornes de ressort
          # de TASK-43 sans aucun rapport avec le son.
          forbid  "critère 4  hauteur de son dans le juice" -n '(PitchScaleTracker|pitch_factor|pitch_scale|semitone)' crates/ui_and_juice/src
          # Le plafond de deux champs est tout l'objet du ticket, et la liste de
          # dérivés est épinglée : y ajouter Component ou Resource casse la
          # contre-épreuve.
          require "critère 4  message à deux champs"     -n 'pub source: StepSource,\n    pub action: ScoreAction,' -U crates/ui_and_juice/src/events.rs
          require "critère 4  dérivés du message"        -n '#\[derive\(Message, Debug, Clone, Copy, PartialEq, Eq\)\]' crates/ui_and_juice/src/events.rs
          require "critère 4  point de conversion unique" -n 'impl From<&ScoreStep> for ScoreStepPlayed \{' crates/ui_and_juice/src/events.rs
          require "critère 4  tampon enregistré par le plugin" -n 'add_message::<crate::events::ScoreStepPlayed>' crates/ui_and_juice/src/lib.rs

          # ---- Étape 4 : forme définitive de la file (TASK-47) ----
          # Le type est **rempli** par game_state et **vidé** par ui_and_juice :
          # le déplacer dans le juice, comme le suggère l'arborescence du
          # document source, créerait une dépendance circulaire. Une seule
          # déclaration, et elle est ici.
          forbid  "critère 4  file déclarée hors des états" -n 'struct ScoringStepQueue' crates/ -g '!crates/game_state/src/resources.rs'
          require "critère 4  file déclarée dans les états" -n 'pub struct ScoringStepQueue \{' crates/game_state/src/resources.rs
          # Huit champs, aucun de plus : pas de curseur d'index, le dépilement
          # se fait par pop_front.
          require "critère 4  les huit champs de la file" -nU 'pub steps: VecDeque<ScoreStep>,[^}]*pub hand: YahtzeeHand,[^}]*pub final_score: u64,[^}]*pub step_timer: Timer,[^}]*pub final_pause: Timer,[^}]*pub speed_multiplier: u32,[^}]*pub fast_forward: bool,[^}]*pub committed: bool,' crates/game_state/src/resources.rs
          # `Default` à la main : un dérivé donnerait deux minuteries de durée
          # nulle, et `Timer::tick` rend alors u32::MAX par `checked_div`.
          require "critère 4  Default de la file écrit à la main" -n 'impl Default for ScoringStepQueue' crates/game_state/src/resources.rs
          forbid  "critère 4  Default de la file dérivé" -nU 'derive\([^)]*Default[^)]*\)\]\n(///.*\n|//.*\n)*pub struct ScoringStepQueue' crates/game_state/src/resources.rs
          # Rejet, jamais correction silencieuse.
          forbid  "critère 4  vitesse corrigée au lieu d'être rejetée" -n '\.clamp\(' crates/game_state/src/resources.rs
          require "critère 4  plafond de vitesse"        -n '\.min\(8\.0\)' crates/game_state/src/resources.rs
          forbid  "critère 4  vitesse écrite hors du setter" -n '^\s*[A-Za-z_][A-Za-z0-9_.]*\.speed_multiplier\s*[-+*/]?=' crates/ -g '!crates/game_state/src/resources.rs'

          # ---- Étape 4 : cadence de dépilement (TASK-48) ----
          # Le compte exact des périodes franchies, jamais un booléen : un
          # `Repeating` réenroule son elapsed, et `finished()` jetterait tout ce
          # qui dépasse une période dans le même tic.
          require "critère 4  compte exact des périodes" -n 'times_finished_this_tick\(\)' crates/ui_and_juice/src/queue.rs
          forbid  "critère 4  cadence testée par un booléen" -n 'step_timer\.(finished|just_finished)\(\)' crates/
          # L'accélération multiplie le pas de temps ; `Timer` n'a pas de champ
          # vitesse, et régler l'horloge globale accélérerait aussi la pause
          # finale et les animations.
          require "critère 4  pas de temps multiplié" -n 'time\.delta\(\)\.mul_f32\(' crates/ui_and_juice/src/queue.rs
          forbid  "critère 4  horloge globale détournée" -n 'set_relative_speed|Virtual>|relative_speed\(' crates/
          # Ancrés sur un accès, pas sur le mot : le module doit pouvoir écrire
          # que la pause finale et le commit ne sont pas de son ressort.
          # Contre-épreuve sur l'instruction exacte plutôt qu'interdiction du
          # `mul_f32` : `[^)]*` ne franchit pas la parenthèse de `delta()`, et
          # `[^;]*` mordrait le commentaire qui explique la règle. Épingler
          # l'instruction casse à toute modification, accélération comprise.
          require "critère 4  pause finale au pas de temps nu" -n 'final_pause\.tick\(time\.delta\(\)\);' crates/ui_and_juice/src/queue.rs
          # **Retirée à TASK-50**, qui écrit ces trois champs : j'avais énoncé à
          # TASK-48 qu'une garde que le ticket suivant doit supprimer n'est pas
          # une garde, et je ne l'avais appliqué qu'à `NextState`. Le § du
          # commit ci-dessous la remplace par des contre-épreuves qui, elles,
          # survivent au ticket suivant.
          forbid  "critère 4  dépilement par la fin"      -n 'steps\.pop_back|steps\.remove\(' crates/
          forbid  "critère 4  panique par unwrap"         -n '\.unwrap\(\)' crates/
          # L'accès du dépileur est énuméré dans un seul type : y ajouter un
          # Transform se voit là, et la file n'y est pas.
          require "critère 4  accès du dépileur groupés" -nU 'derive\(SystemParam\)\]\npub struct DispatchParams' crates/ui_and_juice/src/queue.rs
          forbid  "critère 4  file empruntée par le dépileur" -n 'fn dispatch_step\([^)]*ScoringStepQueue' crates/ui_and_juice/src/queue.rs

          # ---- Étape 4 : mise en scène d'un palier (TASK-49) ----
          # C36 : le nom entrait en collision avec le marqueur `Scoring` de
          # game_state. **Bornée au juice** : `core_engine` porte légitimement un
          # `Hook::OnScoringDie`, qui est un déclencheur de relique et n'a rien à
          # voir avec un composant de présentation.
          forbid  "critère 4  nom proscrit du dé de score" -n 'ScoringDie' crates/ui_and_juice crates/game_state
          # La résolution passe par l'identité, jamais par le rang d'affichage,
          # qui est recalculé à chaque manche et dépend du gobelet.
          require "critère 4  résolution du dé par identité" -n 'die\.id == die_id' crates/ui_and_juice/src/queue.rs
          forbid  "critère 4  dé résolu par position"     -n '\b[a-z_][a-z0-9_]*\.order\b|\.nth\(' crates/ui_and_juice/src/queue.rs
          # Les cibles se lisent dans le palier. La conversion vit dans
          # animation.rs, où la dérogation f64 est bornée (TASK-44).
          require "critère 4  cibles lues dans le palier" -n 'kind\.target_for\(step\)' crates/ui_and_juice/src/queue.rs
          forbid  "critère 4  cible recalculée par le dépileur" -n 'chips_after\s*[-+*/]|score_after\s*[-+*/]|mult_after\s*[-+*/]' crates/ui_and_juice/src/queue.rs
          # L'événement part avant toute résolution d'entité : un palier dont la
          # cible manque en émet un quand même.
          require "critère 4  émission inconditionnelle"  -nU 'ctx\.events\.write\(ScoreStepPlayed::from\(step\)\);' crates/ui_and_juice/src/queue.rs
          # Le marqueur des compteurs vit avec AnimatedNumber, pas ici.
          require "critère 4  marqueur des trois compteurs" -n 'pub enum CounterKind \{' crates/ui_and_juice/src/animation.rs
          forbid  "critère 4  repli par filtre d'exclusion" -n 'ParamSet<|Without<DieView>|Without<RelicSlotUI>' crates/ui_and_juice/src

          # ---- Étape 4 : commit unique du score (TASK-50) ----
          # Trois écritures, dans cet ordre, et une signature à trois
          # paramètres : sans `NextState`, sans `RunSession`, sans `AppState`,
          # le commit **ne peut pas** arbitrer. C'est le typage qui tient la
          # règle, la contre-épreuve tient le typage.
          require "critère 4  signature du commit"       -nU 'fn commit_score_when_drained\(\n    time: Res<Time>,\n    mut queue: ResMut<ScoringStepQueue>,\n    mut blind: ResMut<BlindContext>,\n\) \{' crates/ui_and_juice/src/queue.rs
          require "critère 4  total ajouté au score"     -n 'current_score\.saturating_add\(queue\.final_score\)' crates/ui_and_juice/src/queue.rs
          require "critère 4  main décomptée sans débordement" -n 'hands_remaining\.saturating_sub\(1\)' crates/ui_and_juice/src/queue.rs
          require "critère 4  case consommée au commit"  -n 'used_hands\.mark\(queue\.hand\)' crates/ui_and_juice/src/queue.rs
          require "critère 4  garde-fou refermé"         -n 'queue\.committed = true;' crates/ui_and_juice/src/queue.rs
          # La soustraction nue est proscrite partout : à zéro, un u8 rend 255.
          forbid  "critère 4  main décomptée par soustraction nue" -n 'hands_remaining\s*-[^=]|hands_remaining\s*-=' crates/
          # Le commit vit dans le juice, et nulle part ailleurs. **Ancré sur sa
          # forme**, pas sur l'affectation : les fixtures de test posent
          # légitimement un score ou une grille, et aucune garde textuelle ne
          # sait distinguer un montage d'un commit. La forme, elle, est unique.
          forbid  "critère 4  commit dupliqué hors du juice" -n 'current_score\.saturating_add|hands_remaining\.saturating_sub|used_hands\.mark\(' crates/game_state/src crates/core_engine/src
          # La sortie de phase attend le drapeau : sans lui, RoundEnd arbitrerait
          # sur un contexte où rien n'a été ajouté.
          require "critère 4  sortie de phase liée au commit" -n 'steps\.is_empty\(\) && queue\.committed' crates/game_state/src/systems/round_end.rs

          # ---- Étape 4 : accessibilité, flashs plafonnés (TASK-51) ----
          # Un seul support de flash : deux nœuds, ce serait deux plafonds
          # indépendants, donc six changements de luminance par seconde là où la
          # conformité en admet trois.
          require "critère 4  support de flash unique"   -n 'commands\.spawn\(\(\n        FlashOverlay,' -U crates/ui_and_juice/src/animation.rs
          forbid  "critère 4  second support de flash"   -n 'FlashOverlay,' crates/ -g '!crates/ui_and_juice/src/animation.rs'
          # L'intensité n'est lue **que** par le système de flash : la pulsation
          # et le trauma sont inconditionnels, sans quoi la règle « aucune
          # information n'est portée par le flash seul » ne tient plus.
          #
          # Pas de garde textuelle côté dépileur : ses fixtures **écrivent**
          # légitimement le réglage pour piloter les tests, et aucun motif ne
          # sépare proprement cette écriture d'une lecture. C'est
          # `test_reduce_flashes_disables_full_screen_flash` qui porte la
          # propriété, et il mord — à intensité nulle il exige que la pulsation
          # et le trauma soient toujours là.
          require "critère 4  intensité lue par le flash" -n 'settings\.flash_intensity > 0\.0' crates/ui_and_juice/src/animation.rs
          # Le plafond est en secondes réelles : jamais un `Timer`, que le
          # fast-forward accélérerait, et jamais le fond de la caméra.
          forbid  "critère 4  plafond confié à un Timer" -n 'Timer.*flash|flash.*Timer|ClearColor\(|insert_resource::<ClearColor' crates/ui_and_juice/src
          # Les deux réglages restent deux, et restent indépendants.
          require "critère 4  réglages toujours à deux champs" -nU 'pub flash_intensity: f32,\n    /// Intensité de la secousse de caméra\.\n    pub shake_intensity: f32,\n\}' crates/ui_and_juice/src/settings.rs

          # ---- Étape 5 : catalogue des reliques (TASK-53) ----
          # **Les définitions sont exhaustives, par construction.** Un bras
          # attrape-tout ferait compiler une relique oubliée, et à soixante
          # reliques le compilateur est le seul contrôle qui tienne encore.
          # Ancré en début de ligne : `, _) =>` sur le déclencheur est légitime.
          forbid  "critère 5  bras attrape-tout dans les définitions" -n '^\s*_ =>' crates/core_engine/src/relics/definitions crates/core_engine/src/cups/definitions
          forbid  "critère 5  rareté rendue optionnelle"  -n 'Option<RelicRarity>|unwrap_or\w*\(RelicRarity' crates/
          require "critère 5  les douze raretés déclarées" -nU 'RelicId::CrackedDie\n        \| RelicId::PolishedStone\n        \| RelicId::TripletMaster\n        \| RelicId::ClayPiggyBank => RelicRarity::Common' crates/core_engine/src/relics/definitions/mod.rs
          require "critère 5  catalogue à douze entrées" -nU 'RelicId::CrackedDie,[^]]*RelicId::DoubleMirror,\n\];' crates/core_engine/src/relics/mod.rs
          # Les fixtures ne sont jamais tirables : elles n'entrent pas au
          # catalogue, et leurs variantes restent sous cfg(test).
          forbid  "critère 5  fixture entrée au catalogue" -nU 'pub const CATALOG[^]]*(SixFire|MagicPair|BrokenGlass)' crates/core_engine/src/relics/mod.rs
          # La composition du catalogue n'est pas la loi de tirage : aucune
          # pondération ici. **Ré-ancrée sur l'acte à TASK-63** — un champ, une
          # constante, une fonction — et non sur les mots : le tableau de budget
          # doit pouvoir écrire qu'une relique se déclenche avec telle
          # probabilité, c'est même ce qui justifie ses valeurs. Ancrée sur les
          # mots, elle interdisait la justification en même temps que la
          # pondération. Vingt-sixième fois dans ce projet.
          forbid  "critère 5  pondération de tirage dans le moteur" -n '\b(weight|weighted|chance|probabilit\w*|poids|drop_rate)\w*\s*[:=]|fn \w*(weight|weighted|drop_rate)|const \w*(WEIGHT|CHANCE|PROBA|DROP_RATE)' crates/core_engine/src/relics
          # Les douze reliques sont énumérées dans effects_for tant qu'elles
          # n'ont pas de comportement : TASK-56 remplacera ces noms un à un.
          # **Retirée à TASK-57**, et c'est ma faute de l'avoir posée ainsi :
          # ancrée sur la forme du bras groupé, elle cassait dès qu'une relique
          # quittait le groupe pour une délégation — donc à chacun des six
          # tickets d'implémentation. Une garde que le ticket suivant doit
          # éditer n'est pas une garde. La propriété qu'elle approchait —
          # l'exhaustivité sur les douze — est tenue par le **compilateur**, ce
          # que TASK-56 a mesuré : une treizième relique produit cinq E0004.

          # ---- Étape 5 : inventaire complet (TASK-54) ----
          # La capacité vient du gobelet, jamais d'un littéral : une seule
          # fabrique dimensionne les slots, et personne d'autre.
          forbid  "critère 5  capacité en dur"           -n 'max_capacity|MAX_RELICS' crates/
          forbid  "critère 5  slots dimensionnés hors de la fabrique" -n 'vec!\[None;' crates/ -g '!crates/core_engine/src/relics/**'
          require "critère 5  fabrique unique de l'inventaire" -n 'pub fn new\(capacity: u8\) -> Self' crates/core_engine/src/relics/inventory.rs
          forbid  "critère 5  inventaire par défaut"     -n 'impl Default for RelicInventory|derive\([^)]*Default[^)]*\)\]\npub struct RelicInventory' -U crates/core_engine/src/relics/inventory.rs
          # Le compteur est monotone : une seule écriture, et c'est l'incrément.
          # La contre-épreuve positive vaut mieux qu'une liste d'interdits, qui
          # ne couvrirait que les formes qu'on a imaginées.
          require "critère 5  compteur monotone"         -n 'self\.next_uid = self\.next_uid\.saturating_add\(1\);' crates/core_engine/src/relics/inventory.rs
          forbid  "critère 5  compteur remis à zéro"     -n 'next_uid\s*-=|next_uid\.saturating_sub|next_uid\s*=\s*0\s*;' crates/
          # L'ordre des slots est l'ordre d'application : jamais trié, jamais
          # échangé, et le réordonnancement a une seule sémantique.
          forbid  "critère 5  slots triés ou échangés"   -n 'slots\.swap\(|slots\.sort|fn swap_slots' crates/
          # L'objet-trait est déjà couvert par la garde de TASK-17 sur toute la
          # crate ; il ne reste que la table associative, qui ne survivrait pas
          # davantage à un aller-retour serde.
          forbid  "critère 5  table associative dans les reliques" -n 'HashMap|BTreeMap' crates/core_engine/src/relics

          # ---- Étape 5 : contexte de déclenchement (TASK-55) ----
          # La vue est en lecture seule, et c'est sa raison d'être : un emprunt
          # exclusif rouvrirait le mur de borrow-checker de *Miroir Double*.
          # L'en-tête du fichier énonce la règle **sans écrire le motif** : une
          # garde large se contourne par le sens, jamais par une exception.
          # Le motif couvre `&'a mut` : la commande du corpus, `rg '&mut'`, le
          # manquait — et c'est précisément la forme qu'un emprunt exclusif
          # prendrait dans une structure paramétrée par une durée de vie.
          forbid  "critère 5  emprunt exclusif dans le contexte" -n "&\\s*('[a-z_]+\\s+)?mut\\b|Cell|RefCell|UnsafeCell|Mutex|HashMap|HashSet|f64|f32" crates/core_engine/src/scoring/trigger.rs
          require "critère 5  les treize champs du contexte" -nU 'pub left_effects: &.a \[ScoreEffect\],[^}]*pub roll_index: u8,[^}]*pub rerolls_left: u8,\n\}' crates/core_engine/src/scoring/trigger.rs
          # Les deux types du retour de `OnRoll` sont normatifs : un delta non
          # signé supprimerait la capacité d'exprimer un retrait de relance, et
          # un index de position serait faux dès qu'un dé quitte la manche.
          require "critère 5  delta de relance signé" -n 'pub reroll_delta: i8,' crates/core_engine/src/scoring/trigger.rs
          require "critère 5  dés forcés adressés par identité" -n 'pub force_values: Vec<\(DieId, u8\)>,' crates/core_engine/src/scoring/trigger.rs
          forbid  "critère 5  dés forcés adressés par position" -n 'force_values: \[|force_values: Vec<\(usize|reroll_delta: u8' crates/
          # Ancré sur les deux types, pas sur le fichier : `Hook` porte
          # légitimement serde, et la commande du corpus l'ignorait.
          forbid  "critère 5  contexte ou modificateur sérialisés" -nU 'serde::(Serialize|Deserialize)[^\n]*\n(#\[[^\n]*\n)*pub struct (TriggerCtx|RollModifier)' crates/core_engine/src/scoring/trigger.rs
          # **Dette sans propriétaire, et c'est la bonne étiquette.** Elle a
          # porté TASK-61, TASK-66 puis TASK-67, sans être levée une seule fois :
          # chacun l'a trouvée hors de son périmètre. Elle n'a pas besoin d'un
          # quatrième numéro, elle a besoin de sa condition de levée — une
          # relique dont `effects_for`, et non `roll_modifier_for`, lirait le
          # rang du lancer. Voir la note de `pipeline.rs`.
          require "critère 5  valeurs d'attente du lancer, sans propriétaire" -n 'const ROLL_INDEX_NON_CABLE: u8 = u8::MAX;' crates/core_engine/src/scoring/pipeline.rs

          # ---- Étape 5 : squelette des comportements (TASK-56) ----
          # **Aucun bras attrape-tout au niveau de la relique.** Ancré sur
          # l'indentation de huit espaces que rustfmt garantit pour un bras de
          # `match def` : le `_ =>` d'un `match hook` interne, plus indenté,
          # reste légitime et ne doit pas être interdit.
          forbid  "critère 5  bras attrape-tout sur la relique" -n '^\s{8}_ =>' crates/core_engine/src/relics/effects.rs
          # Les quatre signatures sont normatives, noms de paramètres compris.
          require "critère 5  signature d'effects_for"   -n 'pub fn effects_for\(def: RelicId, hook: Hook, ctx: &TriggerCtx\) -> SmallVec<\[ScoreEffect; 2\]>' crates/core_engine/src/relics/effects.rs
          # **Signature resserrée à TASK-67.** L'ancienne exigeait un
          # `&TriggerCtx`, donc un `&HandMatch`, qui n'existe pas au montage de
          # manche : le contexte de main y est réinitialisé, et à la première
          # manche d'une run aucune figure n'a jamais été évaluée. Elle avait
          # été épinglée quand la fonction n'avait aucun appelant ; le premier
          # appelant réel l'a contredite.
          require "critère 5  signature de roll_modifier_for" -n 'pub fn roll_modifier_for\(def: RelicId, dice: &\[Die\], roll_index: u8\) -> RollModifier' crates/core_engine/src/relics/effects.rs
          require "critère 5  signature de gold_for"     -n 'pub fn gold_for\(def: RelicId, ctx: &TriggerCtx\) -> u32' crates/core_engine/src/relics/effects.rs
          require "critère 5  signature d'advance_state" -n 'pub fn advance_state\(def: RelicId, hook: Hook, ctx: &TriggerCtx, state: RelicState\) -> RelicState' crates/core_engine/src/relics/effects.rs
          # L'idiome du dépôt pour un paramètre délibérément inutilisé est la
          # liaison `let _`, pas un attribut de fonction : plus étroite, et elle
          # cesse de compiler dès que le paramètre sert.
          forbid  "critère 5  variables inutilisées silencées par attribut" -n 'allow\(unused' crates/
          require "critère 5  les douze modules de définitions" -nU 'pub mod clay_piggy_bank;[^;]*;[^;]*;[^;]*;[^;]*;[^;]*;[^;]*;[^;]*;[^;]*;[^;]*;[^;]*;\npub mod unstable_obsidian;' crates/core_engine/src/relics/definitions/mod.rs

          # ---- Étape 5 : les trois reliques par dé (TASK-57) ----
          # `MultiplyMult` est réservé aux raretés Rare et Légendaire : deux de
          # ces trois reliques sont Communes, la troisième Peu commune.
          forbid  "critère 5  multiplication hors des raretés hautes" -n 'MultiplyMult' crates/core_engine/src/relics/definitions/cracked_die.rs crates/core_engine/src/relics/definitions/polished_stone.rs crates/core_engine/src/relics/definitions/pyramid_of_sixes.rs
          # Une relique ne lit que le dé courant : le parcours appartient au
          # pipeline, et itérer le plateau produirait un effet par dé écarté.
          # **Ramenée aux trois modules où elle s'applique**, à TASK-59. Je
          # l'avais étendue aux douze en écrivant « la règle vaudra pour les
          # douze » : elle ne vaut pas. *Le Balancier* doit lire les dés
          # comptabilisés, c'est la définition même de sa condition. Une règle
          # généralisée d'avance est une garde qui mordra le premier cas
          # légitime — celui-ci est arrivé un ticket plus tard.
          forbid  "critère 5  relique par dé qui parcourt le plateau" -n 'ctx\.dice|discarded_dice|scoring_dice' crates/core_engine/src/relics/definitions/cracked_die.rs crates/core_engine/src/relics/definitions/polished_stone.rs crates/core_engine/src/relics/definitions/pyramid_of_sixes.rs
          # Aucun déballage paniquant ni aucun aléa dans les définitions. La
          # règle vaut pour les douze modules, pas seulement pour ces trois : la
          # prose des modules l'énonce **sans écrire ces mots**, comme
          # l'en-tête de `trigger.rs` depuis TASK-20.
          forbid  "critère 5  déballage paniquant dans une définition" -n 'unwrap|expect|panic!|unreachable!|todo!' crates/core_engine/src/relics/definitions
          forbid  "critère 5  aléa dans une définition"  -n '\brng\b|\bRng\b|random|thread_rng' crates/core_engine/src/relics/definitions
          # Chaque valeur normative est épinglée **dans son module** : la
          # déplacer d'un fichier à l'autre casse, ce qui attrape la confusion
          # entre la relique des six et la fixture homonyme.
          require "critère 5  un Mult par dé impair"     -n 'ScoreAction::AddMult\(100\)' crates/core_engine/src/relics/definitions/cracked_die.rs
