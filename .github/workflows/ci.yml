          require "critère 5  prédicat unique de neutralisation" -n 'pub fn participe\(&self, slot: u8, blind: &crate::blinds::BlindDefinition\) -> bool' crates/core_engine/src/relics/mod.rs
          # Exclut le prédicat lui-même : c'est le site de décision, pas un
