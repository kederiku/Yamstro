          # score est une fixture de test parfaitement légitime.
          forbid  "critère 5  échange au lieu d'un décalage" -n 'swap_slots|slots\.swap\(|\.slots\.swap' crates/
          # Le fichier appelle `reorder` et ne refait pas le décalage.
          forbid  "critère 5  ordonnancement réimplémenté" -n 'slots\[|\.slots\.remove|\.slots\.insert|\.slots\.sort' "$DRAG"
