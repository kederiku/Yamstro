name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `rustup show` n'installe plus la toolchain active depuis rustup 1.28.0.
      # L'auto-installation est revenue en 1.28.1 et le runner porte 1.29.0,
      # mais elle se coupe par RUSTUP_AUTO_INSTALL ou `rustup set auto-install
      # disable`. On installe donc explicitement, forme recommandée par le
      # changelog de rustup. Le canal et les composants viennent de
      # rust-toolchain.toml (TASK-01).
      - name: Toolchain (pilotée par rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain
          cargo --version

      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p core_engine --no-default-features
      - run: cargo build -p core_engine --features bevy

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2

      # Le volet 1 emploie les commandes du corpus **telles qu'elles sont
      # écrites**, en rg. ripgrep n'est préinstallé sur aucune image de runner
      # Ubuntu ; noble le fournit dans universe, activé par défaut ici. Une
      # installation ratée fait échouer cette étape, jamais la suivante en
      # silence.
      - name: ripgrep (le volet 1 emploie les commandes rg du corpus)
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version

      # Volet 1 de TASK-15.
      - name: Invariants normatifs (volet 1)
        run: |
          set -euo pipefail
          status=0

          # rg rend 0 s'il trouve, 1 s'il ne trouve rien, 2 s'il a échoué.
          # La forme « ! rg ... » confond 1 et 2 : un chemin devenu faux, ou un
          # binaire absent, passerait pour du code propre. Installer ripgrep n'y
          # change rien, c'est la négation qui avale l'erreur. On lit donc le
          # code de sortie au lieu de le nier.
          forbid() {
            label=$1; shift
            out=$(rg "$@" 2>&1) && rc=0 || rc=$?
            case $rc in
              1) printf '  ok    %s\n' "$label" ;;
              0) printf '  ECHEC %s\n%s\n' "$label" "$out"; status=1 ;;
              *) printf '  ECHEC %s : rg a échoué (code %s)\n%s\n' "$label" "$rc" "$out"; status=1 ;;
            esac
          }

          # Contre-épreuve : le motif DOIT être présent. Garde la saturation
          # contre une suppression silencieuse.
          require() {
            label=$1; shift
            out=$(rg "$@" 2>&1) && rc=0 || rc=$?
            case $rc in
              0) printf '  ok    %s\n' "$label" ;;
              *) printf '  ECHEC %s : motif attendu absent (code %s)\n%s\n' "$label" "$rc" "$out"; status=1 ;;
            esac
          }

          SRC=crates/core_engine/src

          forbid  "critère 6  aucun f64"                 -n '\bf64\b' "$SRC"
          forbid  "critère 7  littéraux de gameplay"     -n '\b(dice_count|base_rerolls|relic_capacity|consumable_capacity|max_interest|hands_per_blind)\s*[:=]\s*[0-9]' "$SRC" -g '!**/cups/definitions/**'
          forbid  "critère 7  fabriques de RunConfig"    -n 'RunConfig\s*\{' "$SRC" -g '!**/cups/definitions/**' -g '!**/config.rs'
          forbid  "critère 8  soustraction nue"          -n '\w*(reroll|hand|gold|slot|capacity|count|interest)\w*\s*(-=|- )' "$SRC"
          forbid  "critère 8  sub non saturants"         -n 'wrapping_sub|overflowing_sub|unchecked_sub' "$SRC"
          require "critère 8  saturation présente"       -n 'saturating_(add|sub)' "$SRC"
          forbid  "critère 9  aucun HashMap ni HashSet"  -n 'HashMap|HashSet' "$SRC"
          # Les huit noms sont ancrés aux limites de mot. Sans l'ancrage, la
          # variante normative « Hook::OnScoringDie » contient la sous-chaîne
          # « ScoringDie » et ferait échouer la garde ; c'est le TYPE de ce nom
          # qui est proscrit, pas le moment qu'il nomme (CONTEXT.md).
          forbid  "critère 10 noms proscrits"            -n '\b(evaluate_dice|evaluate_hand|HandEvaluation|RollSession|rerolls_remaining|rerolls_per_hand|ScoringDie|RoundContext|grid_levels|RelicTrigger|RelicHook)\b' crates/
          # Les quatre hooks sont déclarés dans trigger.rs, mais l'Étape 2 n'en
          # câble que deux. Un point d'appel de OnRoll ou OnRoundEnd ailleurs
          # dans le pipeline produirait des effets fantômes dans le journal.
          forbid  "critère 10 hooks non câblés"          -n 'OnRoll|OnRoundEnd' "$SRC/scoring" -g '!**/trigger.rs'
          forbid  "critère 10 le mot défausse"           -ni 'défausse|defausse' crates/
          forbid  "critère 5  ReflectResource"           -n 'ReflectResource|reflect\(Resource\)' crates/

          # ---- Étape 2 : invariants de clôture (TASK-27, volet 1) ----
          # Les motifs sont ancrés sur l'USAGE, jamais sur la mention. Dans leur
          # forme nue, trois d'entre eux échouaient sur des commentaires que
          # TASK-20, TASK-21 et TASK-26 exigeaient d'écrire : une garde qui
          # interdit un nom interdit aussi la phrase expliquant qu'on ne s'en
          # sert pas.
          forbid  "critère 5  objet-trait relique"       -n 'trait Relic\b|dyn Relic|Box<dyn' crates/core_engine
          forbid  "critère 5  actions hors des trois"    -n 'MultiplyScore|SetFormula' crates/
          forbid  "critère 5  resolve renommée"          -n 'ScoringPipeline::(execute|run)\b' crates/
          forbid  "critère 7  le pipeline ne commet rien" -n '\.current_score|\.hands_remaining|\.used_hands|advance_state\(' "$SRC/scoring"
          forbid  "critère 7  aucune source d'aléa"      -n '\brng\b|RunRng|rand::|thread_rng' "$SRC/scoring"
          forbid  "critère 6  feature test-fixtures"     -n 'test-fixtures"|^\s*test-fixtures\s*=' crates/
          forbid  "critère 2  comparaison approchée"     -n 'assert_relative_eq|EPSILON|\bapprox::|abs\(\)\s*<' crates/
          require "critère 2  égalités exactes"          -n 'assert_eq!' "$SRC/scoring"

          # ---- Étape 3 : mise en place d'une manche (TASK-32) ----
          # Deux ancrages de plus, même défaut que ci-dessus. La garde du § 4
          # de TASK-32 interdit « - » entouré d'espaces dans tout le fichier :
          # elle vise une soustraction nue sur un compteur, pas un tiret de
          # prose. Et la garde des trois combinateurs supprimés en 0.19
          # attraperait le commentaire qui explique justement qu'on ne les
          # écrit pas ; elle est donc ancrée sur un appel.
          SETUP=crates/game_state/src/systems

          forbid  "critère 4  soustraction nue (manche)" -n '\w*(reroll|hand|gold|slot|capacity|count|interest|score|target|ante)\w*\s*(-=|- )' "$SETUP"
          forbid  "critère 4  aucun flottant (manche)"   -n '\bf32\b|\bf64\b' "$SETUP"
          forbid  "critère 4  combinateurs de 0.18"      -n '\b(run_in|run_after|run_before)\s*\(' crates/
          require "critère 4  stubs de malus marqués"    -n 'Étape 5|Étape 10' "$SETUP/setup.rs"

          # ---- Étape 3 : entrée dans une main (TASK-33) ----
          # Deux ancrages de plus, dix-septième et dix-huitième du corpus. La
          # garde « slot » du § 4 de TASK-33 vise un adressage par position
          # fixe ; nue, elle attrape « RelicInventory { slots: … } », nom d'un
          # champ public de core_engine. Et la garde « DicePool » vise une
          # instanciation ; nue, elle attrape les commentaires qui expliquent
          # justement qu'on n'en crée pas.
          forbid  "critère 4  positions fixes de dés"    -n '0\.\.5|\[Entity; 5\]|\[Die; 5\]|\b(die_slots?|dice_slots?)\b|slots?\s*\[' "$SETUP"
          forbid  "critère 4  littéraux de main"         -n 'rerolls_left\s*=\s*[0-9]|dice_count\s*=\s*[0-9]' "$SETUP"
          forbid  "critère 4  flux hors des dés"         -n 'rng\.(shop|boss|relic_effects)|thread_rng|from_entropy' "$SETUP"
          forbid  "critère 4  pool de dés en parallèle"  -n 'DicePool::new|DicePool\s*\{|:\s*DicePool\b|<DicePool>' crates/game_state/src
          # Aucun test ne peut voir cette relance : après le nettoyage des
          # verrous, force = true et force = false donnent le même résultat.
          # Le texte est donc la seule garde possible.
          forbid  "critère 5  relance forcée hors Étape 9" -n 'roll\([^)]*,\s*true\s*\)|force\s*:\s*true' "$SETUP"

          # ---- Étape 3 : entrées de la phase de lancer (TASK-34) ----
          # La garde « Digit[1-9] » du § 4 de TASK-34 n'est pas vérifiable par
          # une machine : elle demande que rg « ne remonte qu'une conversion
          # générique », ce qui est un jugement sur les lignes rendues et non
          # un code de sortie. Et KeyCode étant un enum sans arithmétique,
          # TOUTE conversion rang vers touche nomme les variantes quelque part.
          # On interdit donc ce qu'elle visait : brancher sur une touche.
          forbid  "critère 4  branches par touche"       -n '(if|match|==).*KeyCode::Digit' "$SETUP"
          # Le décrément à zéro est inatteignable, la relance étant refusée
          # avant : aucun test ne distingue saturating_sub d'un sub qui boucle.
          forbid  "critère 8  sub non saturants (états)" -n 'wrapping_sub|overflowing_sub|unchecked_sub' "$SETUP"
          forbid  "critère 4  figure choisie hors de select_hand" -n 'selected_hand' "$SETUP/input.rs"
          forbid  "critère 10 noms de sélection proscrits" -n '\b(Selected|SelectedForScore)\b' crates/

          exit $status
