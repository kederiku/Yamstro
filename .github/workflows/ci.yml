          forbid  "critère 6  facteur de courbe hors du moteur" -n 'fn (blind_mult|cup_mult|stake_mult|boss_mult)[a-z_]*\(' crates/ -g '*.rs' -g '!**/blinds/scaling.rs'
          # Aucun plafond sur la cible : l'empilement maximal est le signal de
