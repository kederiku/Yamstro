          require "critère 6  facteur de stake, à un seul endroit" -n 'fn stake_mult_permille' "$SCALING"
          # Restreinte aux sources : une **signature souhaitée** consignée dans
          # `MISSING_API.md` n'est pas une implémentation, et le ticket qui
          # relève le manque doit pouvoir la nommer. Mesuré à TASK-143.
          forbid  "critère 6  seconde implémentation du facteur de stake" -n 'fn stake_mult_permille' crates/ -g '*.rs' -g '!**/blinds/scaling.rs'


          # ---- Étape 6 : gain de fin de manche (TASK-70) ----
          PAYOUT=$SRC/economy/payout.rs
