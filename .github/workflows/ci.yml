          # Site de décision unique de la neutralisation. Un prédicat, jamais un
          # parcours filtré : `scan_relics` doit visiter les slots stériles pour
          # remettre `left_effects` à zéro, et un itérateur qui les sauterait
          # restaurerait la règle écartée à TASK-60.
          require "critère 5  prédicat unique de neutralisation" -n 'pub fn participe\(&self\) -> bool' crates/core_engine/src/relics/mod.rs
          # Exclut le prédicat lui-même : c'est le site de décision, pas un
          # doublon. Tout autre fichier qui compare l'état à `Disabled` en
          # ouvre un second.
          forbid  "critère 5  neutralisation décidée ailleurs" -n 'state (!=|==) RelicState::Disabled' crates/core_engine/src crates/game_state/src -g '!**/relics/mod.rs'
          # Les valeurs forcées : par identité, après le lancer, sans aléa.
          require "critère 5  valeurs forcées adressées par identité" -n 'find\(\|die\| die.id == \*cible\)' "$SETUP"
          forbid  "critère 5  valeurs forcées adressées par position" -n 'forcees\[|dice\[' "$SETUP"
          forbid  "critère 5  aléa tiré à l'application des valeurs forcées" -nU 'fn apply_forced_values[^}]*rng' "$SETUP"


          # ---- Étape 6 : contraintes de manche (TASK-68) ----
          BLINDS=$SRC/blinds/mod.rs
          # Une seule énumération, à un seul endroit : un second `BlindModifier`
          # « complet » à côté de l'ancien laisserait le pipeline sur l'un et la
          # boutique sur l'autre, sans erreur de compilation.
          require "critère 6  l'énumération des contraintes, à un seul endroit" -n 'pub enum BlindModifier \{' "$BLINDS"
          # **L'arité inline n'est pas observable** : une `SmallVec` déborde sur
          # le tas, donc `[T; 1]` porte deux figures aussi bien que `[T; 2]` et
          # aucun test ne les distingue. Le glossaire impose la forme ; seule
          # une garde sur la déclaration la tient.
          require "critère 6  capacité inline des figures affaiblies" -n 'DebuffHands\(SmallVec<\[YahtzeeHand; 2\]>\)' "$BLINDS"
          require "critère 6  capacité inline des figures imposées" -n 'OnlyHands\(SmallVec<\[YahtzeeHand; 2\]>\)' "$BLINDS"
          forbid  "critère 6  seconde énumération de contraintes" -n 'enum BlindModifier' crates/ -g '!**/blinds/mod.rs'
          # L'absence de contrainte est le `None` de l'Option, jamais une
          # variante ; et le singulier ne pouvait pas exprimer *L'Oubli*.
          # Ancrée sur l'**acte** : la variante employée en code, jamais son
          # nom en prose. La note du module doit pouvoir écrire le singulier
          # écarté pour dire pourquoi il l'est.
          forbid  "critère 6  variante None ou figure au singulier" -n 'BlindModifier::None\b|BlindModifier::DebuffHand\(' crates/
          # **Garde retirée à TASK-69, un ticket après l'avoir écrite.** Elle
          # interdisait tout joker dans un `match` sur une contrainte, et
          # `boss_mult_permille` en est le premier cas légitime : il pose une
          # seule question — « est-ce le multiplicateur de cible ? » — et non
          # « quelle variante est-ce ? ». Une règle généralisée d'avance est une
          # garde qui mord son premier cas légitime ; celle-ci a mis un ticket.
          # Le renommage est complet : deux chemins pour un même type feraient
          # diverger les importateurs.
          forbid  "critère 6  ancien chemin du module de manche" -n 'core_engine::blind\b|crate::blind\b|mod blind;' crates/
          # Reflect seul sur les trois types de données ; seul le contexte est
          # une ressource.
          forbid  "critère 6  contrainte rendue composant ou ressource" -nU 'reflect\(Resource\)[^\n]*\n(#[^\n]*\n)*pub (enum BlindModifier|enum BlindType|struct BlindDefinition)' "$BLINDS"
          # Le pipeline n'accède au modificateur de **manche** que par
          # `has_modifier`. Ancré sur ce champ-là : `die.modifiers` désigne les
          # modificateurs de dé, sans rapport, et un motif nu les attrape.
          forbid  "critère 6  le pipeline rouvre le modificateur de manche" -n 'blind\.modifier\b|blind\.blind\.modifier' "$SRC/scoring"


          # ---- Étape 6 : courbe de difficulté (TASK-69) ----
          SCALING=$SRC/blinds/scaling.rs
          # Une seule courbe dans le dépôt. L'Étape 3 en portait une copie dans
          # `game_state`, avec un arrondi par étage : elle rendait 5034 et 8054
          # là où la normative rend 5033 et 8053, et c'était elle que le jeu
          # employait.
          require "critère 6  constantes de courbe, à un seul endroit" -n 'const BASE_ANTE_1_MILLI: u64 = 300_000;' "$SCALING"
          forbid  "critère 6  seconde courbe de difficulté" -n 'BASE_TARGET|ANTE_GROWTH_MILLI|fn base_target|fn scale_milli' crates/
          forbid  "critère 6  facteur de courbe hors du moteur" -nU 'fn (blind_mult|cup_mult|stake_mult|boss_mult)\b' crates/game_state/src crates/ui_and_juice/src
          # Aucun plafond sur la cible : l'empilement maximal est le signal de
          # calibrage remis à l'Étape 6 bis, pas un défaut à corriger.
          forbid  "critère 6  plafond sur la cible"        -n '\.min\(|\.clamp\(|MAX_TARGET' "$SCALING"
          # Aucun flottant, et un seul site de multiplication.
          forbid  "critère 6  flottant dans la courbe"     -n '\bf64\b|\bf32\b' "$SRC/blinds"
          require "critère 6  site unique de multiplication" -n 'pub\(crate\) fn apply_permille\(value_milli: u64, factor_permille: u32\) -> u64' "$SCALING"
          # **Quatre applications distinctes, et aucun test ne peut le tenir.**
          # Les valeurs de rang et de gobelet produisent toutes un multiple
          # exact de mille : les regrouper ne change rien aujourd'hui, et le
          # mutant survit. La règle vaut pour les facteurs à venir — un
          # multiplicateur de boss arbitraire casserait l'exactitude —, donc
          # c'est une garde qui la tient.
          require "critère 6  les quatre facteurs, appliqués un à un" -nU 'v = apply_permille\(v, blind_mult_permille\(kind\)\);\n    v = apply_permille\(v, cup_mult_permille\(cup, kind\)\);\n    v = apply_permille\(v, stake_mult_permille\(stake_level, ante\)\);\n    v = apply_permille\(v, boss_mult_permille\(modifier\)\);' "$SCALING"
          # Le critère « aucune autre expression `/ 1_000` dans le fichier »
          # est **faux** : trois sites en portent une, tous normatifs — le
          # facteur lui-même, l'accumulation du stake que le § 2.2 exige
          # tronquée à chaque pas, et l'arrondi final. Ce qui se garde, c'est
          # que la cible ne soit multipliée que par `apply_permille`.
          forbid  "critère 6  cible multipliée hors apply_permille" -nU 'fn target_score\([^)]*\)[^}]*\bv\b\s*\*' "$SCALING"
          # Le facteur de stake déménagera à l'Étape 10 : un déplacement, jamais
          # une seconde implémentation.
          require "critère 6  facteur de stake, à un seul endroit" -n 'fn stake_mult_permille' "$SCALING"
          forbid  "critère 6  seconde implémentation du facteur de stake" -n 'fn stake_mult_permille' crates/ -g '!**/blinds/scaling.rs'


          # ---- Étape 6 : gain de fin de manche (TASK-70) ----
          PAYOUT=$SRC/economy/payout.rs
          # Une seule source de vérité pour l'or, et aucune structure qui la
          # concurrence.
          forbid  "critère 6  seconde source de vérité de l'or" -n 'RunEconomy|\bmoney\b|RunSaveState\.gold' crates/
          # **Fonction libre** : un `impl` l'indenterait. Ancré sur la colonne.
          require "critère 6  le gain est une fonction libre" -n '^pub fn calculate_payout\(' "$PAYOUT"
          # Deux cinq de nature opposée. La tranche est une constante de règle,
          # le plafond un paramètre de run : les intervertir ne se voit dans
          # aucune partie, les cinq gobelets valant tous cinq.
          require "critère 6  la tranche divise, la configuration plafonne" -n 'let interest = \(gold / INTEREST_TRANCHE\).min\(config.max_interest\);' "$PAYOUT"
          forbid  "critère 6  plafond d'intérêts en littéral" -n 'min\(5\)|min\(5u32\)|min\(INTEREST_TRANCHE\)|/ config.max_interest' "$SRC/economy"
          # Ancrée sur l'**usage**, pas sur le nom : la note du module doit
          # pouvoir écrire que l'or a sa source de vérité dans la session.
          forbid  "critère 6  le gain connaît la session ou la manche" -n 'use [^;]*(RunSession|BlindContext)|: *&?(RunSession|BlindContext)' "$PAYOUT"
          forbid  "critère 6  élargissement tronquant dans le gain" -n ' as u32| as u8| as u64' "$PAYOUT"
          forbid  "critère 6  flottant dans l'économie"     -n '\bf64\b|\bf32\b' "$SRC/economy"
          # Aucun champ de plus : un drapeau d'application inviterait au double
          # comptage que l'ADR-010 supprime.
          forbid  "critère 6  champ de trop dans le gain"   -n '^\s*pub (applied|blind_id|ante)\s*:' "$PAYOUT"


          # ---- Étape 6 : catalogue des boss (TASK-71) ----
          BOSSES=$SRC/blinds/definitions/bosses.rs
          # **Le catalogue est clos par la CI, l'exhaustivité par le
          # compilateur.** Aucune enumération de variantes n'existe à
          # l'exécution sans dérivé : un septième boss ajouté à l'enum mais
          # oublié de `ALL` ne casserait aucun test. Le bloc est donc exigé au
          # caractère près, ce qui attrape aussi un renommage et une
          # permutation ; l'oubli dans `boss_definition`, lui, sort en E0004.
          require "critère 6  six boss, et pas un de plus" -U -n \
                  'pub enum BossId \{\n    OneEyed,\n    Cage,\n    Vise,\n    Flint,\n    Oblivion,\n    Rift,\n\}' "$BOSSES"
          require "critère 6  et la table ALL les porte tous les six" -n 'pub const ALL: \[BossId; 6\]' "$BOSSES"
          forbid  "critère 6  second catalogue de boss" -n 'enum BossId' crates/ -g '!**/blinds/definitions/bosses.rs'
          # Ancrée sur l'**acte**, et sur la production seule : le test qui
          # prouve que les trois autres flux n'ont pas bougé doit pouvoir les
          # nommer. Le motif exige que l'occurrence précède `#[cfg(test)]`.
          forbid  "critère 6  le boss tire sur un autre flux" -U -n \
                  '(?s)(rng\.dice|rng\.shop|rng\.relic_effects).*#\[cfg\(test\)\]' "$SRC/blinds"
          forbid  "critère 6  aléa hors flux de session" -n 'thread_rng|rand::rng\(\)|from_entropy' "$SRC/blinds"
          # Ancrée sur l'acte — une borne littérale — et non sur le chiffre
          # cinq, que la fixture des tests et la note du module doivent pouvoir
          # écrire. Le Gobelet de Fortune donne six slots (C18, ADR-007).
          forbid  "critère 6  capacité en littéral dans le tirage" -n 'random_range\(0\.\.[0-9]' "$BOSSES"
          require "critère 6  la borne vient de la capacité" -n 'random_range\(0\.\.relic_capacity' "$BOSSES"
          forbid  "critère 6  slot de relique en usize" -n 'DisableRelicSlot\(.*usize' crates/
          # Fonction totale : ni bras fourre-tout, ni sortie facultative, ni
          # valeur par défaut. Un boss sans contrainte est une erreur de
          # compilation, et c'est ce qui rendra l'Étape 9 sûre à étendre.
          forbid  "critère 6  la traduction du boss cesse d'être totale" -n 'Option<BossDefinition>|_ *=>|unwrap_or' "$BOSSES"
          forbid  "critère 6  contrainte fabriquée hors de l'entrée de manche" -n 'impl Default for Boss|lazy_static|OnceLock|static [A-Z_]*: *Boss' "$BOSSES"
          # Les noms français sont de l'i18n d'Étape 9 (ADR-008), et aucun
          # effet ne s'implémente ici : ce fichier traduit, il n'exécute pas.
          forbid  "critère 6  texte joueur dans le catalogue" -n 'String|&str' "$BOSSES"
          forbid  "critère 6  effet de boss implémenté trop tôt" -n 'evaluate|rerolls_left|active_evaluations|effects_for|Hidden' "$BOSSES"
          # La manche complète (récompense, score cible) s'assemble à TASK-80.
          forbid  "critère 6  manche assemblée dans le catalogue" -n 'BlindDefinition|target_score' "$BOSSES"


          # ---- Étape 6 : Le Borgne, par filtrage amont (TASK-72) ----
          EVAL=crates/game_state/src/systems/evaluation.rs
          # La signature de l'évaluateur est normative au caractère près depuis
          # TASK-10, et c'est tout l'argument du filtrage amont : la règle
          # « ni Chips, ni figure » s'obtient en ne transmettant pas le dé,
          # jamais par une branche ajoutée dans l'évaluateur ou le pipeline.
          require "critère 6  la signature de l'évaluateur, intacte" -n \
                  '^    pub fn evaluate\(dice: &\[Die\]\) -> Vec<HandMatch> \{$' crates/core_engine/src/evaluator.rs
          forbid  "critère 6  évaluateur rouvert pour le boss" -n \
                  'evaluate_with_blind|fn evaluate\([^)]*blind|fn evaluate\([^)]*Option<u8>' crates/
          forbid  "critère 6  branche de boss dans le pipeline de score" -n \
                  'DisableFace' crates/core_engine/src/scoring crates/core_engine/src/relics
          # Lecteur unique. Le catalogue des boss et la déclaration de la
          # variante vivent dans blinds/ ; le seul lecteur est le helper.
          forbid  "critère 6  second lecteur de la face éteinte" -n \
                  'DisableFace' crates/ -g '!**/blinds/**' -g '!**/systems/evaluation.rs'
          require "critère 6  le helper de face existe et est unique" -n '^pub fn disabled_face\(' "$EVAL"
          require "critère 6  la tranche évaluable existe" -n '^pub fn evaluable_dice\(' "$EVAL"
          # Prédicat unique : un second filtre divergeant d'une face rendrait
          # deux mains pour le même lancer, et l'écart ne se verrait qu'au score.
          forbid  "critère 6  second filtre de dés hors du helper" -n \
                  'filter\([^)]*current_value !=' crates/ -g '!**/systems/evaluation.rs'
          # Le slice de `resolve` devient `TriggerCtx.dice`, que les reliques
          # lisent : il reste la main **physique**, entière.
          forbid  "critère 6  la main du pipeline est filtrée" -n \
                  'evaluable_dice' crates/game_state/src/systems/submission.rs
          # Rendu, jamais rangé : un champ portant la main filtrée serait le
          # second état parallèle que TASK-35 proscrit.
          forbid  "critère 6  la main filtrée est stockée" -n \
                  'evaluable|filtered_dice|disabled_face' crates/game_state/src/resources.rs
          # Les dés éteints restent dans le pool : affichés, verrouillables,
          # relançables. Les despawner changerait le nombre d'entités-dés.
          forbid  "critère 6  le boss retire des dés du pool" -n \
                  'despawn[^(]*\(\)[^;]*Die|remove_die|pool\.remove' "$EVAL"

          exit $status

  # Job **séparé**, et c'est délibéré. La compilation de Bevy pour le web en
  # `lto = "fat"` avec `codegen-units = 1` se compte en minutes ; l'agréger au
  # job de validation ferait passer chaque PR d'une minute quarante à vingt
  # minutes, y compris pour un changement d'une ligne de documentation.
  taille-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain (pilotée par rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          rustup show active-toolchain

      # Les deux versions sont **épinglées**. `wasm-bindgen` doit correspondre
      # exactement à la version de la crate que Bevy 0.19.1 tire, faute de quoi
      # l'outil refuse le module. Et une montée de binaryen fait bouger la
      # mesure sans qu'une seule ligne du projet ait changé : une référence
      # n'est comparable que si la chaîne est figée.
      #
      # Le binaire pré-compilé, jamais `cargo install` : compiler
      # `wasm-bindgen-cli` à froid dépasse à lui seul le budget de temps du job
      # de validation.
      - name: wasm-bindgen 0.2.128 et binaryen 132, épinglés
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.128/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz --strip-components=1 -C /usr/local/bin --wildcards '*/wasm-bindgen'
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz \
            | tar -xz --strip-components=2 -C /usr/local/bin binaryen-version_132/bin/wasm-opt
          wasm-bindgen --version
          wasm-opt --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Mesure et comparaison à la référence
        run: ci/check-wasm-size.sh
