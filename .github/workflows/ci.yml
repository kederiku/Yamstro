          # que la cible ne soit multipliée que par `apply_permille`.
          forbid  "critère 6  cible multipliée hors apply_permille" -nU 'fn target_score\([^)]*\)[^}]*\bv\b\s*\*' "$SCALING"
          # Le facteur de stake déménagera à l'Étape 10 : un déplacement, jamais
