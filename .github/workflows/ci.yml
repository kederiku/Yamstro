          require "critère 5  prise exposée comme action"  -n 'pub fn begin_hold\(state: &mut DragState, slot: u8\)' "$DRAG"
          require "critère 5  dépose exposée comme action" -n 'pub fn drop_on\(state: &mut DragState, inventory: &mut RelicInventory, slot: u8\)' "$DRAG"
          require "critère 5  glissement conditionné"      -n 'in_state\(AppState::InRun\).and_then\(resource_exists::<RelicInventory>\)' "$DRAG"


          # ---- Étape 5 : les six invariants que l'audit a trouvés non gardés (TASK-66) ----
          # Ancrés sur l'**acte** quand le nom doit rester prononçable : huit des
