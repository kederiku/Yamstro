          forbid  "critère 3  scène Bevy ou texte cosmic" -n 'cosmic-text|cosmic_text|bevy_scene|WgpuSettingsPriority::Compatibility' crates/ --glob '!Cargo.lock'


          # ---- Étape 5 : recâblage du malus de relance (TASK-67) ----
          SETUP=crates/game_state/src/systems/setup.rs
          # Le bouchon a disparu, et le delta est signé de bout en bout.
          forbid  "critère 5  bouchon de relance resté en place" -nU 'fn relic_reroll_malus[^\n]*\n\s*let _ = inventory;' "$SETUP"
