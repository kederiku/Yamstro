          LEVELS=$SRC/scoring/levels.rs
          CONFIG=$SRC/config.rs
          # **Le plafond vit dans config.rs, pas dans setup.rs.** `resolve_rerolls`
          # délègue à `effective_rerolls` ; la garde est donc ancrée là où l'acte
          # a lieu. Un `min`, jamais une affectation, jamais une soustraction —
          # `MaxRerolls(3)` sur un gobelet à deux relances en laisse deux.
          require "critère 6  le plafond de manche est un minimum" -n \
                  'let after_blind = blind_cap\.map_or\(after_stake, \|cap\| after_stake\.min\(cap\)\);' "$CONFIG"
          forbid  "critère 6  le plafond devient soustraction ou affectation" -n \
                  'after_stake\.saturating_sub\(cap\)|blind_cap\.unwrap_or\(|= *cap;' "$CONFIG"
          # Un seul consommateur du plafond hors de l'extracteur de setup.rs.
          forbid  "critère 6  troisième consommateur du plafond" -n \
                  '\bblind_cap\b' crates/ -g '!**/config.rs' -g '!**/systems/setup.rs'
          # C10 : le nom v1 du champ. Le canonique est `rerolls_left`.
          forbid  "critère 6  nom v1 du compteur de relances" -n 'rolls_remaining' crates/
          # **Un seul site de division de la base.** Un second diviserait deux
          # fois, et le test qui l'attrape épingle la valeur du palier plutôt que
          # de la dire « différente » : deux fois divisé diffère tout autant.
          require "critère 6  la base se divise à l'étape 1" -n \
                  'if blind.has_modifier\(BlindModifier::HalveBaseScores\)' "$LEVELS"
          # Ancrée sur l'**affectation**, et non sur la forme de l'arrondi : le
          # commentaire de `pipeline.rs` qui explique le plancher écrit
          # `(100 + 1) / 2 = 50` en toutes lettres, et doit pouvoir le faire.
          # Dix-neuvième ancrage du corpus, et le premier que je m'inflige.
          forbid  "critère 6  seconde division de la base" -n \
                  '(chips|mult)[a-z_]* *=[^;=]*(div_ceil\(2\)|\+ 1\) */ *2)' crates/ -g '!**/scoring/levels.rs'
          # L'arrondi est entier et au plus proche. La troncature nue ferait
          # tomber les As à 2 au lieu de 3.
          forbid  "critère 6  troncature à la place de l'arrondi" -n \
                  'chips / 2|chips /= 2|as f64 / 2' "$LEVELS"
          forbid  "critère 6  flottant dans la base de figure" -n '\bf32\b|\bf64\b' "$LEVELS"
          # Le plancher du glossaire § 4, à un seul endroit : `AllMultToOne` doit
          # pouvoir poser exactement 100 (TASK-22 § 5).
          require "critère 6  plancher de mult dans la base" -n 'mult = mult.max\(100\);' "$LEVELS"
          forbid  "critère 6  plancher de mult ailleurs" -n \
                  '(mult|base_mult)[a-z_]* *=[^;=]*\.max\(100\)' crates/ -g '!**/scoring/levels.rs'


          # ---- Étape 6 : L'Oubli et La Cage (TASK-74) ----
          RELIQUES=$SRC/relics/mod.rs
          # **Site de décision unique de la neutralisation.** Cinq parcours le
          # consultent : le score, l'or, l'avancement d'état, les valeurs
          # forcées et la chaîne de relances. Écrire la condition ailleurs la
          # ferait diverger, et une relique neutralisée garderait sa
          # contrepartie sans son bonus.
          require "critère 6  le prédicat de neutralisation prend la manche" -n \
                  'pub fn participe\(&self, slot: u8, blind: &crate::blinds::BlindDefinition\)' "$RELIQUES"
          forbid_prod "critère 6  seconde décision sur l'état désactivé" \
                  '(!=|==)\s*RelicState::Disabled|RelicState::Disabled\s*(!=|==)' \
                  --exclure '/relics/mod.rs' crates/
          forbid_prod "critère 6  seconde lecture du slot en cage" \
                  'disabled_relic_slot\(\)' --exclure '/blinds/mod.rs|/relics/mod.rs' crates/
          # La cage se lit, elle ne s'écrit pas : poser `Disabled` sur le slot
          # détruirait un `Counter(3)` que rien ne restaurerait.
          forbid_prod "critère 6  la cage écrite dans l'état" \
                  'state = RelicState::Disabled|state: RelicState::Disabled' crates/
          # L'accesseur vit sur la définition, où le modificateur réside, et
          # `resolve_rerolls` ne tient qu'une définition.
          require "critère 6  l'accesseur de cage est unique" -n \
                  '^    pub fn disabled_relic_slot\(&self\) -> Option<u8> \{$' "$BLINDS"
          # La garde précède la construction du contexte, et remet `left` à
          # zéro : sans cela le voisin de droite hérite d'une tranche non vide
          # et *Miroir Double* traverse la cage.
          require "critère 6  le slot neutralisé casse la chaîne" -U -n \
                  'if !inst\.participe\(slot, &proto\.blind\.blind\) \{\n            left = 0\.\.0;\n            continue;' "$SRC/scoring/pipeline.rs"
          # Un seul prédicat de figure : le refus de la soumission et le
          # grisage doivent rester le même énoncé.
          require "critère 6  prédicat de figure unique" -n \
                  '^pub fn is_hand_available\(blind: &BlindContext, hand: YahtzeeHand\)' "$EVAL"
          forbid  "critère 6  seconde définition du prédicat de figure" -n \
                  'fn is_hand_available' crates/ -g '!**/systems/evaluation.rs'
          forbid_prod "critère 6  seconde liste de figures interdites" \
                  'Vec<YahtzeeHand>|HashSet<YahtzeeHand>|debuffed|forbidden_hands' --exclure '/systems/evaluation.rs' crates/
          # Le type est au pluriel : le singulier ne pouvait pas exprimer ce
          # boss, qui interdit deux figures (C22).
          # Ancrée sur une **déclaration ou une construction**, non sur le nom :
          # deux commentaires doivent pouvoir écrire que le singulier est
          # proscrit, ce qui est précisément la raison de la règle.
          forbid  "critère 6  modificateur de figure au singulier" -n \
                  'BlindModifier::DebuffHand\(|^\s{4}DebuffHand\(' crates/
          # Le pipeline n'atteint jamais le champ : il passe par les accesseurs.
          forbid_prod "critère 6  le pipeline lit le modificateur à nu" \
                  'blind\.modifier|\.blind\.modifier' "$SRC/scoring"


          # ---- Étape 6 : La Fissure (TASK-75) ----
          # **Ancré sur l'acte, non sur le nom.** `Hidden` apparaît vingt-deux
          # fois dans la crate d'états : sa déclaration, sa ré-exportation, les
          # en-têtes qui expliquent la règle, et les tests. Ce qui doit rester
          # unique, c'est l'endroit où il est **posé** et celui où il est
          # **retiré**.
          require "critère 7  le masque se pose à la mise en place" -n \
                  'commands\.entity\(\*entity\)\.insert\(Hidden\)' \
                  crates/game_state/src/systems/setup.rs
          forbid_prod "critère 7  masque posé ailleurs qu'à la mise en place" \
                  'insert\(Hidden\)|insert\(\(Hidden|, Hidden\)' --exclure '/systems/setup.rs' crates/
          require "critère 7  le masque se retire à la soumission" -n \
                  'remove::<Hidden>\(\)' crates/game_state/src/systems/submission.rs
          forbid_prod "critère 7  masque retiré ailleurs qu'à la soumission" \
                  'remove::<Hidden>' --exclure '/systems/submission.rs|/systems/setup.rs' crates/
          # Chemin de calcul unique : l'évaluation temps réel et la révélation
          # passent par la même fonction, sans quoi elles divergeraient.
          forbid_prod "critère 7  second chemin d'évaluation" \
                  'HandEvaluator::evaluate' --exclure '/systems/evaluation.rs' crates/game_state/src
          require "critère 7  le remplissage est partagé" -n '^pub fn remplir\(' "$EVAL"
          # La garde d'occultation ne descend pas dans le remplissage : le
          # retrait par `Commands` est différé, et elle y verrait encore les
          # marqueurs. Elle reste dans le système.
          forbid_prod "critère 7  garde d'occultation descendue dans le remplissage" \
                  'fn remplir\([^)]*Hidden' crates/
          # Aucune évaluation partielle : elle divulguerait par différence (C23).
          forbid_prod "critère 7  évaluation partielle des dés visibles" \
                  'Without<Hidden>|hidden_ui|visible_dice|partial_eval' crates/


          # ---- Étape 6 : étalage et rareté (TASK-76) ----
          SHOP=$SRC/shop
          GEN=$SHOP/generator.rs
          # **Table unique du projet.** Une table à soixante-dix pour cent de
          # Communes a circulé dans un document plus ancien ; elle est fausse.
          # La garde porte sur une **déclaration** de poids, non sur le chiffre :
          # la prose doit pouvoir nommer la table écartée, ce qui est même
          # demandé par le ticket.
          require "critère 6  la table de rareté, au pour-mille" -n \
                  'pub const RARITY_WEIGHTS_PERMILLE: \[u32; 4\] = \[650, 250, 90, 10\];' "$GEN"
          forbid  "critère 6  seconde table de rareté" -n 'RARITY_WEIGHTS_PERMILLE *(:|=)' crates/ -g '!**/shop/generator.rs'
          forbid  "critère 6  table de rareté fausse" -n \
                  'WEIGHTS[A-Z_]* *(:[^=]*)?= *\[ *(700|70|650 *, *250 *, *45)' crates/
          # **Le harnais lit la table, il ne la recopie jamais** — pas même
          # dans un test « pour vérifier ». La garde ne **compte** pas les
          # occurrences sur `crates/` entier : le dépôt en porte deux, la
          # déclaration et le test de l'Étape 6 qui la garde, et exiger un
          # total de un demanderait de toucher le moteur. Elle porte sur le
          # seul chemin où une copie serait un défaut.
          forbid  "critère 6  table de rareté recopiée dans le harnais" -n \
                  '\[ *650 *, *250 *, *90 *, *10 *\]' crates/sim_harness/
          # **La sonde à plan classe le catalogue, elle ne le récite pas.**
          # Deux identifiants écrits à la main passeraient tous les tests
          # d'aujourd'hui ; à l'Étape 9 la sonde ne saurait classer aucune des
          # reliques ajoutées, achèterait au hasard sous un nom qui promet un
          # plan, et le tableau resterait crédible. La garde porte sur la
          # **variante nommée** et non sur le type, dont la table a besoin ; sur
          # la production seule, les tests devant nommer ce qu'ils vérifient ; et
          # sur le seul répertoire où une liste en dur serait un défaut. Portée
          # à `src` entier, elle attrape le doc-test d'en-tête de `view.rs`, qui
          # doit nommer une relique pour montrer qu'une vue ne mute rien — et
          # que `forbid_prod` ne coupe pas, un `//!` précédant le premier
          # `#[cfg(test)]`.
          forbid_prod "critère 6  liste de reliques écrite à la main dans le harnais" \
                  'RelicId::' crates/sim_harness/src/policy
          # **La ligne du tableau ne se mute pas après construction.** La garde
          # porte sur **l'acte** — prendre une référence mutable sur la ligne —
          # et non sur la syntaxe `&mut self`, qui bannirait du même coup les
          # deux constructeurs des agrégats, lesquels se remplissent *pendant*
          # le run et doivent donc l'être. Un agrégat qui repasserait sur les
          # lignes pour « normaliser » une colonne réécrirait après coup ce que
          # le run a dit.
          forbid  "critère 6  la ligne de sortie mutée après coup" -n \
                  '&mut RunOutcome' crates/sim_harness/src
          # Le vocabulaire v1 sur le seul fichier où il serait naturel : un champ
          # « argent gagné », un « relances restantes ». Les noms canoniques sont
          # `gold`, `rerolls_left` et `hands_remaining`.
          forbid  "critère 6  vocabulaire v1 dans la ligne de sortie" -n \
                  'rerolls_remaining|hands_left|rolls_remaining|rerolls_per_hand|RollSession|RoundContext|HandEvaluation|evaluate_hand|ScoringDie|défausse|\bf64\b|\bf32\b|HashMap|HashSet' \
                  crates/sim_harness/src/outcome.rs
          # **Rien ne s'écrit depuis la section parallèle.** Avec un écrivain
          # partagé, chaque run resterait juste et le tableau changerait d'ordre
          # à chaque exécution : l'identité octet pour octet deviendrait
          # invérifiable *sans qu'aucun run ne soit faux*, et la comparaison
          # nocturne signalerait une dérive chaque nuit.
          forbid  "critère 6  écriture depuis la section parallèle" -n \
                  'Mutex|RwLock|Atomic|par_bridge|par_iter\(\)\.for_each' \
                  crates/sim_harness/src/campaign.rs
          # Un flottant ou une table non ordonnée sur le chemin de campagne, et
          # l'écart ne se voit qu'à la comparaison d'empreintes, une nuit plus
          # tard, sur une autre machine.
          forbid  "critère 6  flottant ou table non ordonnée en campagne" -n \
                  '\bf64\b|\bf32\b|HashMap|HashSet' crates/sim_harness/src/campaign.rs
          # **Un bras attrape-tout dans l'aiguillage compile et ne prévient de
          # rien** : il fait tourner une option sur une autre sonde, et l'écart
          # entre les deux sondes de main devient nul pour une raison de
          # câblage. Une sixième politique doit être une erreur de compilation.
          forbid_prod "critère 6  bras attrape-tout dans l'aiguillage" \
                  '^\s*_ =>' crates/sim_harness/src/campaign.rs
          # L'ordre indexé **est** la garantie : le commentaire qui le dit est
          # normatif, et sa disparition annoncerait un remplacement du collect.
          require "critère 6  le collect de campagne est indexé" -n \
                  'collect\(\); // collect indexé : l.ordre est celui des indices' \
                  crates/sim_harness/src/campaign.rs
          # **Le rapport ne compte rien en flottant, pas même à l'affichage.**
          # L'addition flottante n'est pas associative et l'ordre de réduction
          # d'un agrégat parallèle n'est pas garanti : seule la ligne de résumé
          # changerait entre deux plateformes, et la comparaison d'empreintes
          # nocturne signalerait une dérive que personne ne saurait attribuer.
          # Un invariant à zéro strict se défend mieux qu'un invariant à
          # exceptions.
          forbid  "critère 6  flottant ou table non ordonnée dans le rapport" -n \
                  '\bf64\b|\bf32\b|HashMap|HashSet' crates/sim_harness/src/report.rs
          # Une seule convention de médiane pour tout le harnais : trois
          # implémentations en donneraient trois au premier remaniement.
          require "critère 6  une seule médiane dans le harnais" -n \
                  '^pub fn median\(values: &mut \[u64\]\) -> u64 \{' \
                  crates/sim_harness/src/report.rs
          forbid  "critère 6  seconde médiane" -n 'fn median' crates/sim_harness/src \
                  -g '!**/report.rs'
          # Le rapport n'horodate rien : une date lue à l'horloge ferait changer
          # son empreinte à chaque exécution, et c'est cette empreinte que la
          # passe nocturne compare.
          forbid  "critère 6  horodatage dans le rapport" -n \
                  'SystemTime|Instant::now|chrono|Local::now' crates/sim_harness/src/report.rs
          # La table des reliques itère le catalogue : douze aujourd'hui,
          # soixante à l'Étape 9, sans qu'une ligne change.
          forbid_prod "critère 6  liste de reliques écrite à la main dans le rapport" \
                  'RelicId::' crates/sim_harness/src/report.rs
          # **Le journal ne porte rien de volatil.** Un horodatage, une durée,
          # une adresse ou un numéro de fil fait diverger deux journaux
          # identiques et rend la comparaison inutilisable dès la première
          # ligne — c'est-à-dire supprime la seule chose que ce mode apporte.
          forbid  "critère 6  valeur volatile dans le journal" -n \
                  'Instant::now|SystemTime|thread::current|\{:p\}|elapsed\(' \
                  crates/sim_harness/src/trace.rs
          # Un journal dont deux plateformes n'arrondiraient pas la dernière
          # décimale de la même façon échouerait au critère de reproductibilité
          # **en imprimant des chiffres justes** — le cas le plus difficile à
          # diagnostiquer de l'étape. Quotient et reste, en entiers.
          forbid  "critère 6  flottant ou table non ordonnée dans le journal" -n \
                  '\bf64\b|\bf32\b|HashMap|HashSet' crates/sim_harness/src/trace.rs
          # **La forme tronquée du score est le piège central du journal.**
          # Mesurée, elle ne diffère de l'arrondi que sur 2,3 % des pas quand
          # trois reliques multiplient, et sur aucun quand aucune ne multiplie :
          # elle passerait donc presque toujours, et le défaut dormirait jusqu'à
          # la première relique multiplicative.
          forbid  "critère 6  score reconstitué sans son arrondi" -n \
                  'chips[a-z_]* *\* *mult[a-z_]* */ *100' crates/sim_harness/src
          require "critère 6  le score reconstitué porte l'arrondi et le plancher" -n \
                  'mult.max\(0\).unsigned_abs\(\)' crates/sim_harness/src/trace.rs
          # Déterminisme de l'offre : ordre d'itération garanti, entiers seuls.
          forbid  "critère 6  table associative dans l'offre" -n 'HashMap|HashSet' "$SHOP"
          forbid  "critère 6  flottant dans l'offre" -n '\bf64\b|\bf32\b' "$SHOP"
          forbid  "critère 6  aléa hors du flux de boutique" -n \
                  'thread_rng|rand::random|OsRng|from_entropy|rng\.dice|rng\.boss|rng\.relic_effects' "$SHOP"
          # Aucune panique dans la génération : le vivier vide s'écrit en
          # `let Some(..) else`, et rend un étalage amputé.
          forbid  "critère 6  panique dans la génération" -n 'unwrap\(\)|expect\(|panic!|\[0\]' "$GEN"
          # Le nom v1 de la variante. Ancrée sur une **déclaration ou une
          # construction**, non sur le nom : le commentaire qui explique que ce
          # nom est proscrit doit pouvoir l'écrire, et le ticket l'exige même.
          forbid  "critère 6  nom v1 du modificateur de dé" -n \
                  'DiceMod\(|::DiceMod\b|^\s{4}DiceMod' crates/
          # L'étalage est une ressource, jamais un composant.
          forbid  "critère 6  l'étalage dérive Component" -n 'derive\([^)]*\bComponent\b|component::Component' "$SHOP"
          # Le coût de relance initial, déclaré une fois et posé par le
          # générateur : c'est ce qui rend la remise à zéro vraie par visite.
          require "critère 6  le coût de relance initial est unique" -n \
                  '^pub const INITIAL_REROLL_COST: u32 = 5;' "$SHOP/mod.rs"
          forbid  "critère 6  seconde déclaration du coût de relance" -n \
                  'const INITIAL_REROLL_COST' crates/ -g '!**/shop/mod.rs'
          # La correspondance seuil vers rareté est séparée du tirage : c'est
          # elle qui rend les frontières éprouvables valeur par valeur.
          require "critère 6  la correspondance est séparée du tirage" -n \
                  '^pub fn rarity_for_permille\(seuil: u32\) -> RelicRarity \{' "$GEN"
          # Aucun retirage : il décalerait le flux dès qu'une Légendaire sort.
          forbid  "critère 6  boucle de retirage dans le repli" -n \
                  'while[^{]*is_empty|loop *\{' "$GEN"


          # ---- Étape 6 : prix, revente et relance (TASK-77) ----
          PRIX=$SHOP/pricing.rs
          # **Le prix de la Rune du Destin tombe du palier Rare.** Codé en dur,
          # il rendrait la même valeur aujourd'hui — aucun test ne peut le
          # distinguer — et survivrait à un recalibrage de la table en donnant
          # deux prix pour une même rareté. C'est donc ici que ça se garde.
          forbid  "critère 6  prix littéral sur un article" -n \
                  'ShopItem::[A-Za-z]+\([^)]*\) *=> *[0-9]' "$PRIX"
          forbid  "critère 6  la rareté du consommable décidée au barème" -n \
                  'ConsumableId::[A-Za-z]+' "$PRIX"
          require "critère 6  la rareté du consommable vit avec son identité" -n \
                  '^pub fn rarity_of\(id: ConsumableId\) -> RelicRarity \{' $SRC/consumables.rs
          # Fonction totale : une variante ajoutée doit produire un E0004.
          forbid  "critère 6  bras attrape-tout dans le barème" -n '_ *=>|unwrap_or' "$PRIX"
          # Les trois règles sont des fonctions libres, hors de tout `impl`.
          require "critère 6  le prix est une fonction libre" -n '^pub fn price_of\(item: &ShopItem\) -> u32 \{' "$PRIX"
          require "critère 6  la revente est une fonction libre" -n '^pub fn sell_value\(price: u32\) -> u32 \{' "$PRIX"
          require "critère 6  l.incrément est une fonction libre" -n '^pub fn bump_reroll_cost\(cost: u32\) -> u32 \{' "$PRIX"
          forbid  "critère 6  seconde règle de prix" -n \
                  'fn price_of|fn sell_value|fn bump_reroll_cost|fn price_of_rarity' crates/ -g '!**/shop/pricing.rs'
          forbid  "critère 6  second pas de relance" -n 'const REROLL_COST_STEP' crates/ -g '!**/shop/pricing.rs'
          # La tarification ne connaît que ses arguments.
          forbid  "critère 6  le barème connaît la session" -n \
                  'RunSession|RelicInventory|RunConfig|\bgold\b' "$PRIX"
          # Ancrée sur l'**acte** : une soustraction portant sur un prix ou un
          # coût. Le motif nu ' - ' attrape une puce de commentaire — la
          # séquence espace-tiret-espace y figure — et un `len() - 1` légitime.
          forbid  "critère 6  soustraction nue sur un prix" -n \
                  '(price|cost|prix|cout)[a-z_]* *-[^>=]|- *(price|cost)\b' "$PRIX"
          # Le plancher de revente, et le zéro qui ne fabrique pas d'or.
          require "critère 6  plancher de revente à un" -n '\(price / 2\).max\(1\)' "$PRIX"
          require "critère 6  un article gratuit se revend zéro" -U -n \
                  'if price == 0 \{\n        return 0;\n    \}' "$PRIX"


          # ---- Étape 6 : crate de boutique (TASK-78) ----
          BOUTIQUE=crates/shop_system
          # **Le sens des dépendances, et il ne se négocie pas.** Une seule
          # ligne inverse ferme un cycle et le workspace cesse de compiler ;
          # la garde le dit avant le compilateur.
          forbid  "critère 6  dépendance inverse vers la boutique" -n \
                  'shop_system' crates/game_state crates/core_engine crates/ui_and_juice
          # Aucun son ici : l'audio est l'affaire de l'Étape 8, par une autre
          # bibliothèque. Une feature absente l'est sans erreur de compilation.
          # Ancrée sur une **entrée de liste**, entre guillemets, et non sur le
          # nom : le commentaire qui dit que ces features sont exclues est le
          # contrat, et il doit pouvoir les nommer.
          forbid  "critère 6  audio ou tweening dans la boutique" -n \
                  '"(bevy_audio|vorbis|kira|rodio|symphonia)"|^ *(kira|rodio|symphonia|bevy_tweening) *=' \
                  "$BOUTIQUE/Cargo.toml"
          # `cargo deny` compte une crate publiable comme non licenciée, et une
          # dépendance de chemin nue comme un joker.
          require "critère 6  la crate de boutique n'est pas publiable" -n \
                  '^publish = false$' "$BOUTIQUE/Cargo.toml"
          forbid  "critère 6  dépendance de chemin sans version" -n \
                  '\{ path = "\.\./[a-z_]+" \}' "$BOUTIQUE/Cargo.toml"
          # Combinateurs supprimés en 0.19.
          forbid  "critère 6  combinateur d'ordonnancement supprimé" -n \
                  '\brun_in\b|\brun_after\b|\brun_before\b' "$BOUTIQUE"
          # Aucun type de cette crate n'est une ressource : une dérivation posée
          # par erreur sur la carte compilerait et n'en laisserait qu'une.
          forbid  "critère 6  ressource dans la crate de boutique" -n \
                  'derive\([^)]*\bResource\b|resource::Resource' "$BOUTIQUE/src"
          # Aucune donnée de jeu sur une carte : l'étalage est la source unique.
          forbid  "critère 6  donnée de jeu portée par une carte" -n \
                  'struct Shop[A-Za-z]*\([^)]*(ShopItem|RelicId|RelicInstance|RelicRarity)' "$BOUTIQUE/src"
          # Le skip de blind est retiré de la v1.0. **Ancrée sur l'acte** : le
          # motif nu `skip` attrape `.skip(`, méthode d'itérateur sans rapport.
          forbid  "critère 6  bouton de skip ou tag bonus" -n \
                  'SkipButton|skip_blind|BonusTag|SkipBlind|bouton .?Passer' "$BOUTIQUE/src"
          # Le placement passe par `Node` : la passe d'interface calcule sa
          # propre transformation, et y écrire n'aurait aucun effet.
          forbid  "critère 6  Transform dans la boutique" -n \
                  'Query<[^>]*&mut Transform' "$BOUTIQUE/src"
          # Un seul compteur animé dans le projet, et il vit ailleurs.
          forbid  "critère 6  second compteur animé" -n \
                  'struct [A-Za-z]*Number|struct [A-Za-z]*Counter|lerp' "$BOUTIQUE/src"
          require "critère 6  le solde emploie le compteur de la mise en scène" -n \
                  'ui_and_juice::animation::AnimatedNumber' "$BOUTIQUE/src/ui.rs"
          # Le fichier de systèmes appartient au ticket aval : un `pub mod` sans
          # fichier ne compile pas et bloquerait celui-ci.
          # `systems` est livré par TASK-79 ; `audio` reste l'affaire de
          # l'Étape 8, et un `pub mod` sans fichier ne compile pas.
          forbid  "critère 6  module audio en avance" -n 'pub mod audio' "$BOUTIQUE/src/lib.rs"


          # ---- Étape 6 : transactions de boutique (TASK-79) ----
          TRANS=$BOUTIQUE/src/systems.rs
          # Une seule règle de capacité, et elle vient de la configuration du
          # gobelet : le Gobelet de Fortune donne six slots là où le standard en
          # donne cinq.
          require "critère 6  la règle de capacité est écrite une fois" -n \
                  '^pub fn has_free_slot\(occupied: usize, capacity: u8\) -> bool \{' "$TRANS"
          forbid  "critère 6  seconde règle de capacité" -n 'fn has_free_slot' crates/ -g '!**/shop_system/src/systems.rs'
          forbid  "critère 6  plafond de capacité en littéral" -n \
                  '(relics|slots|items|inventory)[a-z_]*\.len\(\) *< *[0-9]|max_capacity|MAX_RELICS' crates/
          # Aucune dette : l'or est non signé, et sature des deux côtés.
          forbid  "critère 6  or muté sans saturation" -n \
                  'gold *[-+]=|gold *= *[a-z_.]*gold *[-+][^=]' crates/
          forbid  "critère 6  seconde source de vérité de l'or" -n 'RunEconomy|\bmoney\b' crates/
          forbid  "critère 6  or signé dans les transactions" -n '\bi64\b|\bi32\b|\bf64\b|\bf32\b' "$TRANS"
          # Le seul flux de la boutique.
          forbid  "critère 6  aléa hors du flux de boutique" -n \
                  'thread_rng|rand::random|rng\.dice|rng\.boss|rng\.relic_effects' "$BOUTIQUE/src"
          # **L'ordre de la relance est normatif, et il porte un piège.** Le
          # générateur rend un étalage entier, coût compris et remis à sa valeur
          # initiale : lui affecter la ressource replacerait ce coût, et les
          # relances successives coûteraient toutes le même prix.
          require "critère 6  la relance ne remplace que les articles" -U -n \
                  'session\.gold = session\.gold\.saturating_sub\(shop\.reroll_cost\);\n        shop\.items = generate_shop\(&mut session\.rng\.shop\)\.items;\n        shop\.reroll_cost = bump_reroll_cost\(shop\.reroll_cost\);' "$TRANS"
          forbid  "critère 6  la relance remplace l'étalage entier" -n \
                  '\*shop = generate_shop|\*inventory = generate_shop' "$TRANS"
          # Le pas d'incrément et le prix de reprise ont un seul site.
          forbid  "critère 6  incrément de relance recopié" -n \
                  'reroll_cost *= *[a-z_.]*saturating_add|reroll_cost *\+' "$TRANS"
          # **Ancrée positivement**, et c'est plus sûr qu'une interdiction : le
          # motif nu de la division attrape la numérotation d'un commentaire,
          # « 2. Le prix se lit », et manque la forme réelle du recalcul, où la
          # division suit une parenthèse fermante. Exiger l'appel à la
          # tarification tombe dès que quelqu'un le remplace.
          require "critère 6  la reprise passe par la tarification" -n \
                  'let reprise = sell_value\(price_of\(' "$TRANS"
          # L'or se vérifie avant de partir, et la comparaison est stricte.
          require "critère 6  l'or est vérifié avant le débit d'achat" -n \
                  '^        if session\.gold < prix \{$' "$TRANS"
          require "critère 6  l'or est vérifié avant le débit de relance" -n \
                  '^        if session\.gold < shop\.reroll_cost \{$' "$TRANS"
          # Les trois systèmes sont des clics : ils habitent l'ensemble
          # d'interaction, que le plugin garde par la phase de boutique.
          require "critère 6  les transactions habitent l'ensemble d'interaction" -U -n \
                  'handle_purchases,\n            handle_sales,\n            handle_rerolls,\n            shop_continue,\n        \)\n            \.chain\(\)\n            \.in_set\(ShopSet::Interact\)' "$TRANS"
          # Aucune transition d'état ici : la sortie de boutique est TASK-80.
          # **La transition de sortie a migré ici à TASK-80**, et elle y est
          # légitime. Ce qui reste interdit est toute **autre** écriture d'état,
          # et les gardes de la sortie de boutique s'en chargent : pas de
          # raccourci vers le lancer, pas de `set` nu, pas d'état d'application.
          forbid_prod "critère 6  seconde transition dans les transactions" \
                  'RunPhase::(Roll|Scoring|RoundEnd)\b' "$TRANS"


          # ---- Étape 6 : sortie de boutique et progression (TASK-80) ----
          # **Il n'existe pas de transition vers le lancer.** Ancrée sur l'acte
          # et sur la production : un test qui sort de la boutique pour vérifier
          # qu'on n'y transige plus doit pouvoir nommer la phase de lancer.
          forbid_prod "critère 6  raccourci de la boutique vers le lancer" \
                  'set_if_neq\([^)]*RunPhase::Roll|set\(RunPhase::Roll\)' "$BOUTIQUE/src"
          # `set_if_neq` sans exception : un `set` redondant rejouerait l'entrée
          # en boutique, où l'or des reliques est encaissé.
          forbid_prod "critère 6  transition posée sans set_if_neq" \
                  '(phase|next|suivante)[a-z_]*\.set\(' "$BOUTIQUE/src"
          require "critère 6  la transition de sortie est celle de l'Étape 3" -n \
                  'NextState::set_if_neq\(&mut phase, RunPhase::BlindSelect\);' "$TRANS"
          # La boutique n'arbitre ni victoire ni défaite. Production seule : le
          # montage des tests doit pouvoir entrer dans la run.
          forbid_prod "critère 6  la boutique arbitre l'issue" \
                  'AppState|current_score *>=|VictoryScreen' "$BOUTIQUE/src"
          forbid  "critère 6  écran de victoire inventé" -n '\bVictoryScreen\b' crates/
          # Le skip de manche est retiré de la v1.0. **Ancrée sur l'acte** : le
          # motif nu, insensible à la casse, attrape le verbe français *passer*
          # conjugué — « un doublon non écarté passerait le test ».
          forbid  "critère 6  bouton de skip ou tag bonus" -n \
                  'SkipButton|SkipBlind|skip_blind|BonusTag|BlindTag|bouton .?Passer' crates/
          # Le déclencheur a migré : il n'existe qu'une fois.
          forbid  "critère 6  déclencheur de sortie dupliqué" -n 'fn shop_continue' crates/ -g '!**/shop_system/src/systems.rs'
          forbid  "critère 6  test de sortie dupliqué" -n 'fn test_shop_continue' crates/game_state
          # La progression de manche vit à un seul endroit, et après l'arbitre.
          require "critère 6  la progression avance après l'arbitre" -U -n \
                  'check_run_completion,\n            advance_blind_progression' "$SETUP"
          forbid  "critère 6  seconde progression de manche" -n 'fn advance_blind_progression' crates/ -g '!**/systems/setup.rs'
          # La récompense s'écrit avec la manche et se lit au gain.
          require "critère 6  la récompense suit le rang" -n '^fn reward_for\(kind: BlindType\) -> u32 \{' "$SETUP"
          forbid  "critère 6  récompense recalculée au gain" -n \
                  'reward_for|match [a-z_.]*kind' "$SRC/economy"

          # ---- Étape 6 : audit de clôture (TASK-81) ----
          # Trois gardes, et trois seulement : les treize autres du § 4.3 sont
          # déjà posées ci-dessus, ticket par ticket, et dans une forme ancrée
          # sur l'acte. Les redoubler donnerait deux gardes pour un invariant,
          # dont l'une casse au premier commentaire qui nomme la règle.
          #
          # La table de la v1. **Ancrée sur le littéral de tableau**, jamais sur
          # la forme « 70/25/5 » : c'est celle qu'emploie la prose pour nommer
          # la table écartée — le commentaire du bloc TASK-76 a dû l'écrire en
          # toutes lettres pour y échapper.
          forbid  "critère 6  table de rareté 70/25/5 de la v1" -n \
                  '\[\s*700\s*,|\[\s*70\s*,\s*25\s*,\s*5\s*\]' crates/
          # Le nom rand 0.9 du trait de base : en 0.10 il s'appelle `Rng`, et
          # l'ancien `Rng` s'appelle `RngExt`.
          forbid  "critère 6  nom rand 0.9 du trait de base" -n '\bRngCore\b' crates/
          # L'audio du § 4.3 n'est **pas** ajouté : l'invariant est déjà gardé
          # deux fois, ligne 335 pour tout le workspace et plus haut dans ce
          # bloc pour la seule boutique, toutes deux ancrées sur une
          # déclaration. Mesuré : une dépendance `kira` posée dans le manifeste
          # de la boutique fait tomber ces deux gardes-là.

          # ---- Étape 6 : la cible de mesure suit le sommet du graphe (TASK-81 bis) ----
          # La mesure WASM ne vaut que si son binaire monte le jeu entier, et le
          # jeu entier n'est visible que depuis la crate dont toutes les autres
          # sont des dépendances. Mesuré à TASK-81 : posée dans la crate de mise
          # en scène, la cible ignorait toute la boutique, et l'écart jouait à la
          # baisse, donc sans déclencher la porte de taille. La cible vit dans la
          # crate du sommet, monte chacun des plugins, et il n'en existe qu'une :
          # deux cibles feraient deux chiffres et deux références, donc aucune
          # garde. Le jour où une crate s'ajoute au-dessus de la boutique, la
          # cible y remonte et ces lignes suivent.
          CIBLE_WASM=$BOUTIQUE/src/bin/wasm_size.rs
          require "critère 8  cible de mesure au sommet du graphe" -n '^fn main\(\)' "$CIBLE_WASM"
          require "critère 8  la cible monte les états"      -n '^\s+GameStatePlugin,$' "$CIBLE_WASM"
          require "critère 8  la cible monte la mise en scène" -n '^\s+JuicePlugin,$' "$CIBLE_WASM"
          require "critère 8  la cible monte la boutique"    -n '^\s+ShopPlugin,$' "$CIBLE_WASM"
          require "critère 8  le script mesure la crate du sommet" -n '^\s+-p shop_system --features measure --bin' ci/measure-wasm.sh
          forbid  "critère 8  seconde cible de mesure"       --files crates -g '**/src/bin/*.rs' -g '!**/shop_system/src/bin/wasm_size.rs'
          forbid  "critère 8  cible restée en dessous du sommet" -n 'name = "wasm_size"' crates/ -g '!crates/shop_system/Cargo.toml'

          exit $status

      # ---- Étape 6 bis : le harnais de simulation (TASK-154) ----
      #
      # **Une exigence qu'aucune commande ne vérifie n'est pas une exigence,
      # c'est un vœu.** Les motifs des audits amont sont portés sur les
      # répertoires des quatre crates de jeu ; aucun ne balaye celui du harnais.
      #
      # Ce bloc **ajoute**, il ne réécrit rien. Et il ne recopie pas non plus ce
      # qui est déjà gardé : le littéral de la table de rareté est interdit dans
      # le harnais depuis TASK-148, la courbe est gardée structurellement sur
      # l'ensemble des crates, et le flottant comme la table de hachage le sont
      # déjà fichier par fichier sur trois fichiers. Un second endroit à
      # corriger le jour où un chemin change, c'est un endroit qui restera faux.
      - name: Invariants normatifs Étape 6 bis
        run: |
          set -euo pipefail
          status=0
          # Même lecture du code de sortie qu'au volet 1 : `! rg` confond
          # « rien trouvé » et « rg a échoué ».
          forbid() {
            label=$1; shift
            out=$(rg "$@" 2>&1) && rc=0 || rc=$?
            case $rc in
              1) printf '  ok    %s\n' "$label" ;;
              0) printf '  ECHEC %s\n%s\n' "$label" "$out"; status=1 ;;
              *) printf '  ECHEC %s : rg a échoué (code %s)\n%s\n' "$label" "$rc" "$out"; status=1 ;;
            esac
          }
          require() {
            label=$1; shift
            out=$(rg "$@" 2>&1) && rc=0 || rc=$?
            case $rc in
              0) printf '  ok    %s\n' "$label" ;;
              *) printf '  ECHEC %s : motif attendu absent (code %s)\n%s\n' "$label" "$rc" "$out"; status=1 ;;
            esac
          }

          HARNAIS=crates/sim_harness

          # **Le motif flottant est borné, jamais un fichier exclu.** Exclure le
          # rapport ou le journal supprimerait l'invariant sur les deux fichiers
          # qui en ont le plus besoin, et « aucun flottant sauf là où on en
          # écrit » n'est pas un invariant. La forme extrait toutes les
          # occurrences, puis compte celles qui ne sont **pas** sur une ligne de
          # formatage.
          #
          # Mesuré, le fichier intermédiaire est **vide** : le harnais n'emploie
          # aucun flottant, pas même à l'affichage, et la seconde ligne est donc
          # satisfaite a fortiori. La borne existe parce que la règle du corpus,
          # elle, tolère un flottant au formatage — un invariant à zéro qui ne
          # tiendrait que par chance n'est pas un invariant.
          rg -n '\bf64\b|\bf32\b' "$HARNAIS/src" > flottants.txt || true
          hors=$(rg -cv 'format!\(|write!\(|writeln!\(|print!\(|println!\(' flottants.txt || echo 0)
          if [ "$hors" = "0" ]; then
            printf '  ok    critère 6  aucun flottant hors du formatage (%s ligne(s) extraite(s))\n' \
                   "$(wc -l < flottants.txt | tr -d ' ')"
          else
            printf '  ECHEC critère 6  %s flottant(s) hors du formatage\n' "$hors"; status=1
          fi
          rm -f flottants.txt

          # Une seule itération non ordonnée suffit à rendre le tableau de
          # sortie non reproductible, donc la campagne nocturne incomparable.
          forbid  "critère 6  table de hachage dans le harnais" -n 'HashMap|HashSet' "$HARNAIS/src"

          # Insensible à la casse et **sans frontière de mot** : le manifeste ne
          # doit porter ni une dépendance au moteur graphique, ni une de ses
          # briques glissée en dépendance de test, ni sa feature activée.
          forbid  "critère 6  moteur graphique dans le manifeste du harnais" -in 'bevy' "$HARNAIS/Cargo.toml"
          cargo tree -p sim_harness --edges normal > arbre.txt
          # Non vacuous : un arbre vide passerait le filtre sans rien garder.
          require "critère 6  l'arbre du harnais est bien lu" -n 'core_engine' arbre.txt
          forbid  "critère 6  paquet graphique dans l'arbre normal du harnais" -n 'bevy' arbre.txt
          rm -f arbre.txt

          # **La règle n°1, sous la forme qui garde sans bloquer.** Jusqu'à la
          # clôture de l'Étape 6 bis elle se lisait « le moteur n'a pas bougé
          # depuis qu'on a branché », et c'était juste : aucun ticket de
          # l'étape n'avait le droit d'y toucher. Gardée telle quelle après la
          # clôture, elle interdisait tout changement du moteur sur n'importe
          # quelle PR, Étape 9 comprise, et la passe `rand` 0.10 du
          # 15 septembre 2026 s'y est heurtée la première. Or la règle dit
          # autre chose : **le harnais ne modifie jamais le moteur.** Elle
          # s'écrit donc au commit : depuis le point de branchement, aucun
          # commit dont le sujet porte le périmètre `(sim_harness)` ne touche
          # `crates/core_engine/`. Le moteur reste modifiable, sous son propre
          # périmètre, dans son propre commit, revu comme tel.
          #
          # Le point de branchement plutôt que la base de la PR : ce workflow
          # se déclenche aussi sur un push, où elle est vide — mesuré,
          # `git diff origin/` rend « bad revision », code 128, à chaque
          # exécution. Sur `main`, la liste des commits est vide et la règle
          # passe à vide : c'est le cas nominal, il n'y a rien à garder.
          git fetch --no-tags --depth=0 origin main 2>/dev/null || git fetch --no-tags origin main
          base=$(git merge-base origin/main HEAD)
          fautifs=''
          for sha in $(git rev-list "$base..HEAD"); do
            sujet=$(git log -1 --format=%s "$sha")
            case "$sujet" in
              *'(sim_harness)'*)
                if git diff-tree --no-commit-id --name-only -r "$sha" | grep -q '^crates/core_engine/'; then
                  fautifs="$fautifs$sha $sujet"$'\n'
                fi ;;
            esac
          done
          if [ -z "$fautifs" ]; then
            printf '  ok    critère 6  aucun commit du harnais ne touche le moteur depuis %s\n' "$base"
          else
            printf '  ECHEC critère 6  un commit du harnais touche le moteur\n%s' "$fautifs"; status=1
          fi

          # **Contre-épreuve de présence.** Les paniques se mécanisent par un
          # lint et non par une recherche textuelle : les tests unitaires du
          # harnais vivent sous `#[cfg(test)]` dans les mêmes fichiers que la
          # production, où le dépaquetage forcé est légitime. Une recherche
          # serait rouge dès le premier test, et la seule correction disponible
          # serait d'exclure un fichier entier — c'est-à-dire de perdre
          # l'invariant sur la production de ce fichier. Le lint, lui, connaît
          # la compilation de test.
          #
          # L'attribut vit dans la **bibliothèque**, et c'est là tout l'enjeu :
          # le binaire fait six lignes, et tout le harnais est dans la
          # bibliothèque. Posé sur le binaire, il garderait `fn main`.
          require "critère 6  les paniques sont mécanisées par le lint" -n \
                  'deny\(clippy::unwrap_used, clippy::expect_used, clippy::panic\)' "$HARNAIS/src/lib.rs"

          exit $status

      # ---- Étape 6 bis : clôture (TASK-157) ----
      #
      # **Contre-épreuves de présence.** Ces lignes doivent remonter quelque
      # chose : un invariant dont la cible a disparu est vide de sens, et rien
      # ne le dit. Elles complètent le bloc de TASK-154, qui interdit ; ici on
      # exige.
      - name: Clôture Étape 6 bis
        run: |
          set -euo pipefail
          status=0
          exiger() {
            label=$1; shift
            if rg -q "$@" 2>/dev/null; then
              printf '  ok    %s\n' "$label"
            else
              printf '  ECHEC %s : attendu présent\n' "$label"; status=1
            fi
          }
          interdire() {
            label=$1; shift
            out=$(rg "$@" 2>&1) && rc=0 || rc=$?
            case $rc in
              1) printf '  ok    %s\n' "$label" ;;
              0) printf '  ECHEC %s\n%s\n' "$label" "$out"; status=1 ;;
              *) printf '  ECHEC %s : rg a échoué (code %s)\n%s\n' "$label" "$rc" "$out"; status=1 ;;
            esac
          }

          # Le fichier des API absentes existe **et n'est pas vide**. Un fichier
          # vide obtenu en élargissant une visibilité serait un échec de
          # l'étape : le manque disparaîtrait du seul document qui le porte.
          test -s crates/sim_harness/MISSING_API.md
          printf '  ok    critère 6  le fichier des API absentes est non vide\n'
          exiger "critère 6  la décomposition de la courbe reste hors d'atteinte" \
                 -n 'pub\(crate\) fn apply_permille' crates/core_engine/src/blinds/scaling.rs

          # **La cible web du harnais, et elle seule — sur sa production.**
          # Deux bornes, et chacune a sa raison. La cible historique apparaît
          # trois fois sous le répertoire des workflows : c'est le job qui
          # mesure le binaire du **jeu**, et l'exiger absente de là demanderait
          # de le supprimer. Et l'audit de clôture doit pouvoir **nommer** la
          # cible qu'il interdit : portée sur le répertoire entier, la garde se
          # déclenche sur le test qui la vérifie — mesuré.
          interdire "critère 4  cible web historique dans le harnais" -n \
                    'wasm32-unknown-unknown' \
                    crates/sim_harness/src crates/sim_harness/Cargo.toml

          # Le harnais ne remonte dans aucune crate de jeu, à une exception près
          # — la dépendance de développement du test d'accord, qui vit dans la
          # crate d'interface et n'entre pas dans l'arbre normal.
          interdire "critère 6  le harnais remonte dans une crate de jeu" -n \
                    'sim_harness' crates/game_state/ crates/core_engine/ crates/shop_system/

          # **Six types, une déclaration chacun.** Une migration mal faite laisse
          # deux déclarations homonymes que le compilateur distingue et que le
          # lecteur confond ; c'est le seul contrôle qui l'attrape.
          compte=$(rg -c --no-filename 'struct RunOutcome|enum HandDecision|trait Policy\b|trait ShopPolicy|struct LockMask|struct SimRng' \
                   crates/ -g '!**/tests/**' | paste -sd+ - | bc)
          if [ "$compte" = "6" ]; then
            printf '  ok    critère 6  les six types migrés sont déclarés une fois\n'
          else
            printf '  ECHEC critère 6  %s déclarations au lieu de six\n' "$compte"; status=1
          fi

          # Le bloc de glossaire est livré et nomme les vingt types. Le
          # glossaire lui-même vit sur le corpus : aucun contrôle d'ici ne peut
          # le lire, et ce qui se vérifie est la correspondance entre le code et
          # le bloc.
          exiger "critère 6  le bloc de glossaire est livré" -n \
                 'Types du harnais de simulation' reports/glossaire-sim-harness.md

          exit $status

      # ---- Étape 7 : direction artistique et shaders (TASK-82 et suivants) ----
      #
      # **L'étape est ouverte le 15 septembre 2026, avant les Étapes 10 et 9**,
      # par dérogation à l'ADR-009 ; la dérogation est consignée dans la v2 du
      # ticket et du backlog. TASK-82 n'a posé que l'infrastructure : un
      # module, un plugin sans matériau, trois shaders qui rendent une couleur
      # opaque.
      #
      # **Ancrer sur l'acte, jamais sur un nom nu.** La doc de module de
      # `lib.rs` nomme les combinateurs disparus pour dire qu'ils n'existent
      # plus : la garde nue du ticket ne peut pas être vide, et le volet 1
      # interdit déjà `run_in(` sur l'appel et `RenderGraph|ViewNode` sur
      # `crates/`. Ici ne restent que les noms sans aucun emploi légitime, y
      # compris en commentaire, et `assets/` que le volet 1 ne couvre pas. La
      # portée est `crates/` et `assets/`, **jamais `.`** : les tickets citent
      # les orthographes proscrites pour les proscrire.
      - name: Invariants normatifs Étape 7
        run: |
          set -euo pipefail
          status=0
          forbid() {
            label=$1; shift
            out=$(rg "$@" 2>&1) && rc=0 || rc=$?
            case $rc in
              1) printf '  ok    %s\n' "$label" ;;
              0) printf '  ECHEC %s\n%s\n' "$label" "$out"; status=1 ;;
              *) printf '  ECHEC %s : rg a échoué (code %s)\n%s\n' "$label" "$rc" "$out"; status=1 ;;
            esac
          }
          require() {
            label=$1; shift
            out=$(rg "$@" 2>&1) && rc=0 || rc=$?
            case $rc in
              0) printf '  ok    %s\n' "$label" ;;
              *) printf '  ECHEC %s : motif attendu absent (code %s)\n%s\n' "$label" "$rc" "$out"; status=1 ;;
            esac
          }

          JUICE=crates/ui_and_juice
          SHADERS=assets/shaders

          # TASK-82 : le module et le plugin, déclarés là où le ticket les met.
          # Un module de `ui_and_juice`, pas une crate de plus : le sens des
          # dépendances est gardé par le volet 1, « dépendance inverse vers le
          # juice ».
          require "TASK-82  module graphics déclaré"      -n '^pub mod graphics;$' "$JUICE/src/lib.rs"
          require "TASK-82  plugin ré-exporté"            -n '^pub use plugin::VisualEffectsPlugin;$' "$JUICE/src/graphics/mod.rs"
          require "TASK-82  le plugin existe"             -n '^pub struct VisualEffectsPlugin;$' "$JUICE/src/graphics/plugin.rs"

          # Les trois chemins sont publiés par le plugin, en une seule source,
          # et les trois fichiers existent sous `assets/`. Un fichier vide
          # serait « présent » et ferait quand même basculer le repli de
          # TASK-92 : chaque shader porte son point d'entrée.
          require "TASK-82  chemin du vortex publié"      -n '^pub const PSYCHE_BACKGROUND_SHADER: &str = "shaders/psyche_background\.wgsl";$' "$JUICE/src/graphics/plugin.rs"
          require "TASK-82  chemin du filtre publié"      -n '^pub const CRT_POSTPROCESS_SHADER: &str = "shaders/crt_postprocess\.wgsl";$' "$JUICE/src/graphics/plugin.rs"
          require "TASK-82  chemin du contour publié"     -n '^pub const HOLO_CARD_SHADER: &str = "shaders/holo_card\.wgsl";$' "$JUICE/src/graphics/plugin.rs"
          require "critère 6  point d'entrée du vortex"   -n '^fn fragment\(' "$SHADERS/psyche_background.wgsl"
          require "critère 6  point d'entrée du filtre"   -n '^fn fragment\(' "$SHADERS/crt_postprocess.wgsl"
          require "critère 6  point d'entrée du contour"  -n '^fn fragment\(' "$SHADERS/holo_card.wgsl"

          # Critère 1 : API de rendu 0.19. Ces noms n'ont plus aucun emploi,
          # pas même pour expliquer la règle : c'est ce commentaire-ci qui
          # l'explique, et il ne les nomme pas.
          forbid  "critère 1  nœud cathodique de la v1"   -n 'CrtPostProcessNode' crates/ assets/
          forbid  "critère 1  priorité wgpu renommée"     -n 'WgpuSettingsPriority::Compatibility' crates/ assets/
          forbid  "critère 1  dépendances proscrites"     -n 'cosmic-text|bevy_scene' "$JUICE" assets/
          forbid  "critère 1  graphe de rendu dans un shader" -n 'RenderGraph|ViewNode|\brun_(in|after|before)\b' assets/

          # Critère 8 : la cible de mesure monte le plugin. Une cible qui
          # l'omettrait mesurerait un binaire amputé, et l'écart jouerait à la
          # baisse, sans déclencher la porte de taille.
          require "critère 8  plugin monté dans la cible" -n '^\s+VisualEffectsPlugin,$' crates/shop_system/src/bin/wasm_size.rs

          # TASK-83 : les réglages du filtre et le mode dégradé, déclarés dans
          # `settings.rs` à côté de `JuiceSettings` (raccord B), posés par le
          # plugin. Le `Default` du filtre est écrit à la main : un dérivé
          # donnerait un filtre éteint sans la moindre erreur. `Resource` est
          # un sous-trait de `Component` en 0.19, et un composant dans le
          # module des réglages despawnerait les autres porteurs : ancré sur le
          # dérivé et sur l'impl, jamais sur le nom, que la doc du module a le
          # droit d'expliquer. Enfin « aucun booléen ne transite par
          # l'uniforme » s'ancre sur le champ et sur la lecture, pas sur le
          # mot : `graphics/` ne déclare, n'initialise ni ne lit jamais le
          # drapeau, il passe par le prédicat `is_active`.
          SETTINGS=$JUICE/src/settings.rs
          require "TASK-83  réglages du filtre déclarés"    -n '^pub struct CrtSettings \{$' "$SETTINGS"
          require "TASK-83  mode dégradé déclaré"           -n '^pub struct SafeMode \{$' "$SETTINGS"
          require "TASK-83  Default du filtre écrit à la main" -n '^impl Default for CrtSettings \{$' "$SETTINGS"
          require "TASK-83  prédicat de garde déclaré"      -n '^\s+pub fn is_active\(&self, safe_mode: &SafeMode\) -> bool \{$' "$SETTINGS"
          require "TASK-83  le plugin pose les réglages"    -n '^\s+app\.init_resource::<CrtSettings>\(\);$' "$JUICE/src/graphics/plugin.rs"
          require "TASK-83  le plugin pose le mode dégradé" -n '^\s+app\.init_resource::<SafeMode>\(\);$' "$JUICE/src/graphics/plugin.rs"
          forbid  "TASK-83  Default dérivé sur le filtre"   -nU 'derive\([^)]*Default[^)]*\)\]\s*\npub struct CrtSettings\b' "$SETTINGS"
          forbid  "TASK-83  composant dérivé dans les réglages" -n 'derive\([^)]*Component' "$SETTINGS"
          forbid  "TASK-83  composant implémenté dans les réglages" -n '^impl Component for' "$SETTINGS"
          forbid  "TASK-83  drapeau déclaré dans graphics"  -n '\benabled\s*:' "$JUICE/src/graphics"
          forbid  "TASK-83  drapeau lu dans graphics"       -n '\.enabled\b' "$JUICE/src/graphics"

          # TASK-84 : le premier matériau, forme A, et son bloc de 64 octets.
          # Un seul `#[uniform(0)]` par matériau, ancré sur l'attribut en tête
          # de ligne, la doc ayant le droit de le nommer ; jamais la forme B ;
          # aucun champ `time`, le mot restant libre puisque le bloc verbatim
          # l'emploie pour dire qu'il n'y en a pas ; ni `Component` ni
          # `Resource` sur un matériau ; aucune couleur ni défaut ici, les
          # palettes sont TASK-86, et le spawn en part depuis TASK-86 ; ni `Component`
          # ni `Resource` sur le matériau ou son bloc, ancré sur le dérivé posé
          # sur ces deux types, le marqueur du quad de TASK-85 étant un
          # composant légitime du même fichier ; le remplissage explicite à
          # l'offset 56 et
          # les six offsets en commentaire, seule façon de relire les deux
          # blocs côte à côte. Le chemin du shader est celui que le plugin
          # publie, en une seule orthographe.
          count() {
            label=$1; expected=$2; shift 2
            n=$( (rg "$@" || true) | wc -l | tr -d ' ')
            if [ "$n" = "$expected" ]; then printf '  ok    %s\n' "$label"; else printf '  ECHEC %s : %s occurrence(s), %s attendue(s)\n' "$label" "$n" "$expected"; status=1; fi
          }
          BG=$JUICE/src/graphics/background.rs
          require "TASK-84  module background déclaré"       -n '^pub mod background;$' "$JUICE/src/graphics/mod.rs"
          require "TASK-84  le matériau est un Material2d"   -n '^impl Material2d for BackgroundMaterial \{$' "$BG"
          require "TASK-84  shader désigné par la source unique" -n '^\s+PSYCHE_BACKGROUND_SHADER\.into\(\)$' "$BG"
          require "TASK-84  le plugin enregistre le matériau" -n '^\s+app\.add_plugins\(Material2dPlugin::<BackgroundMaterial>::default\(\)\);$' "$JUICE/src/graphics/plugin.rs"
          require "critère 2  remplissage explicite à l'offset 56" -n '^\s+pub _pad: Vec2,\s*// offset 56' "$BG"
          count   "critère 2  six offsets en commentaire" 6 -o '// offset +(0|16|32|48|52|56),' "$BG"
          count   "critère 2  un seul uniform(0) dans le matériau" 1 -n '^\s*#\[uniform\(0' "$BG"
          forbid  "critère 2  forme B mélangée"              -n '^\s*#\[uniform\(0,' "$BG"
          forbid  "TASK-84  champ time dans l'uniforme"      -n '^\s*(pub\s+)?time\s*:' "$BG"
          forbid  "TASK-84  matériau composant ou ressource" -nU 'derive\([^)]*(Component|Resource)[^)]*\)\]\s*\npub struct Background(Material|Uniform)\b' "$BG"
          forbid  "TASK-84  défaut ou couleur dans le matériau" -n '^impl Default for|Srgba::hex\(|LinearRgba::(new|rgb|rgba)\(|Color::' "$BG"

          # TASK-85 : le shader du vortex, le quad et le redimensionnement.
          # Les chemins d'import, le def de bind group et le champ de viewport
          # sont ceux des sources 0.19.1, cités dans l'en-tête du shader. Le
          # miroir des deux structs est une seule garde multiligne, appliquée
          # au WGSL et au Rust : six champs, même ordre, mêmes offsets, ce
          # qu'aucun test de taille ne voit. Le temps vient du GPU : aucun
          # champ de temps dans le WGSL. Le quad est spawné au démarrage,
          # derrière tout le reste ; le redimensionnement écoute la fenêtre et
          # réécrit le maillage en place ; aucune écriture de Transform dans
          # `graphics/`, ni de son échelle (raccord A).
          WGSL=$SHADERS/psyche_background.wgsl
          require "TASK-85  import de la sortie du vertex 2D" -n '^#import bevy_sprite::mesh2d_vertex_output::VertexOutput$' "$WGSL"
          require "TASK-85  import des bindings de vue 2D"    -n '^#import bevy_sprite::mesh2d_view_bindings::\{globals, view\}$' "$WGSL"
          require "TASK-85  bind group du matériau par le def" -n '^@group\(#\{MATERIAL_BIND_GROUP\}\) @binding\(0\) var<uniform> material: BackgroundUniform;$' "$WGSL"
          require "TASK-85  le temps vient du GPU"            -n 'globals\.time \* material\.speed' "$WGSL"
          require "critère 8  correction d'aspect"            -n 'let aspect = view\.viewport\.z / view\.viewport\.w;' "$WGSL"
          forbid  "TASK-85  champ de temps dans le WGSL"      -n '^\s*time\s*:' "$WGSL"
          MIROIR='(?s)primary_color.*?// offset +0\b.*?secondary_color.*?// offset 16.*?accent_color.*?// offset 32.*?\bspeed\b.*?// offset 48.*?swirl_factor.*?// offset 52.*?_pad.*?// offset 56'
          require "critère 2  miroir WGSL, six champs dans l'ordre" -U "$MIROIR" "$WGSL"
          require "critère 2  miroir Rust, six champs dans l'ordre" -U "$MIROIR" "$BG"
          require "TASK-85  le quad derrière tout le reste"   -n 'Transform::from_xyz\(0\.0, 0\.0, -100\.0\)' "$BG"
          require "TASK-85  le spawn tourne au démarrage"     -n '^\s+app\.add_systems\(Startup, \(spawn_background_quad, init_visual_theme\)\.chain\(\)\);$' "$JUICE/src/graphics/plugin.rs"
          require "TASK-85  le redimensionnement est ordonnancé" -n '^\s+app\.add_systems\(Update, resize_background_quad\);$' "$JUICE/src/graphics/plugin.rs"
          require "TASK-85  le redimensionnement écoute la fenêtre" -n 'MessageReader<WindowResized>' "$BG"
          require "TASK-85  le maillage est réécrit en place" -n 'meshes\.get_mut\(' "$BG"
          forbid  "critère 4  écriture de Transform dans graphics" -n '&mut Transform' "$JUICE/src/graphics"
          forbid  "critère 4  échelle de Transform écrite"    -n '\.scale\s*=|Transform::from_scale|with_scale\(' "$JUICE/src/graphics"

          # TASK-86 : les quatre palettes, sRGB converti une seule fois. Douze
          # appels `Srgba::hex("#…")`, un par couleur, et aucune composante
          # linéaire écrite à la main. Des `static LazyLock`, jamais un `const`
          # inliné à chaque usage. La moitié système du même fichier est TASK-87,
          # gardée plus bas. La boutique prime sur le type de blind, par la
          # place du bras, ancrée
          # sur le premier `match` du corps de la fonction : mesuré, un `match`
          # inversé garde un `match phase` interne que la garde non ancrée
          # acceptait ; le
          # spawn du fond part de la Petite Mise, et le remplissage neutre de
          # TASK-85 a disparu.
          THEME=$JUICE/src/graphics/theme.rs
          require "TASK-86  module theme déclaré"            -n '^pub mod theme;$' "$JUICE/src/graphics/mod.rs"
          count   "TASK-86  quatre palettes statiques" 4     -n '^pub static (SMALL|BIG|BOSS|SHOP): LazyLock<ThemePalette> = LazyLock::new\(' "$THEME"
          count   "TASK-86  douze conversions sRGB" 12       -n 'Srgba::hex\("#[0-9A-F]{6}"\)' "$THEME"
          forbid  "TASK-86  composante linéaire à la main"   -n 'LinearRgba::(new|rgb|rgba)\(' "$THEME"
          forbid  "TASK-86  palette en const LazyLock"       -n 'const [A-Z_]+: *LazyLock' "$JUICE/src"
          forbid  "TASK-86  palette composant ou ressource"  -nU 'derive\([^)]*(Component|Resource)[^)]*\)\]\s*\npub struct ThemePalette\b' "$THEME"
          require "TASK-86  la boutique prime"               -U 'fn target_palette\([^{]*\{\n\s*match phase \{\n\s*RunPhase::Shop => \*SHOP,' "$THEME"
          require "TASK-86  sans blind, la Petite Mise"      -n '^\s+_ => \*SMALL,$' "$THEME"
          forbid  "TASK-86  remplissage neutre resté dans le spawn" -n 'const [A-Z_]+: BackgroundUniform' "$BG"
          require "TASK-86  le spawn part de la Petite Mise" -n 'BackgroundUniform::from\(\*SMALL\)' "$BG"

          # TASK-87 : le contrôleur de thème, raccord D. Un seul `get_mut` dans
          # le thème, et le `return` sur le minuteur terminé le précède ; les
          # ressources de manche et de phase toujours sous `Option`, un `Res`
          # nu faisant écarter le système en silence au menu ; le contrôleur
          # est une ressource, jamais un composant ; le minuteur fait 1,5 s et
          # naît terminé ; le matériau du fond n'a qu'un écrivain, ce
          # contrôleur, le spawn ne faisant que le créer ; aucun champ de temps
          # dans un uniforme, ancré sur `time: f32`, le paramètre `time:
          # Res<Time>` du contrôleur étant légitime ; le contrôleur naît après
          # le quad et tourne en Update.
          count   "TASK-87  un seul get_mut dans le thème" 1 -n 'get_mut\(' "$THEME"
          require "TASK-87  le retour précède l'écriture"     -U 'timer\.is_finished\(\) \{\n\s*return;\n\s*\}[\s\S]*?materials\.get_mut\(' "$THEME"
          forbid  "TASK-87  ressource de manche ou de phase nue" -n '[^<]Res<BlindContext>|[^<]Res<State<RunPhase>>' "$JUICE/src"
          require "TASK-87  contrôleur ressource"             -U '#\[derive\(Resource[^)]*\)\]\s*\npub struct VisualThemeController \{' "$THEME"
          forbid  "TASK-87  contrôleur composant"             -nU 'derive\([^)]*Component[^)]*\)\]\s*\npub struct VisualThemeController\b' "$THEME"
          require "TASK-87  minuteur de 1,5 s"                -n 'Timer::from_seconds\(1\.5, TimerMode::Once\)' "$THEME"
          require "TASK-87  minuteur terminé à l'insertion"   -n 'timer\.set_elapsed\(timer\.duration\(\)\)' "$THEME"
          forbid  "TASK-87  second écrivain du matériau"      -n 'ResMut<Assets<BackgroundMaterial>>' "$JUICE/src" -g '!**/graphics/theme.rs' -g '!**/graphics/background.rs'
          forbid  "TASK-87  le spawn écrit le matériau"       -n 'materials\.get_mut\(' "$BG"
          forbid  "TASK-87  champ de temps dans un uniforme"  -n '^\s*(pub\s+)?time\s*:\s*f32\b' "$JUICE/src/graphics"
          require "TASK-87  le contrôleur est animé"          -n '^\s+app\.add_systems\(Update, animate_visual_theme\);$' "$JUICE/src/graphics/plugin.rs"

          # TASK-88 : le filtre cathodique, un `FullscreenMaterial` en 2D, set
          # `PostProcess` après le tonemapping, jamais le set précoce ni la
          # prépasse. Le trait impose un composant porteur de l'uniforme : ni
          # `Asset`, ni `AsBindGroup`, ni `Resource` dérivés dans le fichier,
          # aucun remplissage, aucun champ booléen. La passe n'existe que pour
          # les caméras qui portent le composant, décidé par la condition pure
          # de TASK-83 ; l'écriture est gardée par `is_changed`, et `intensity`
          # multiplie les quatre champs. Le miroir des quatre champs, offsets
          # compris, attend son pendant WGSL à TASK-89. « Après le tonemapping »
          # s'ancre sur l'appel chaîné complet : mesuré, la doc du fichier cite
          # `.after(tonemapping)` et satisfaisait la garde nue.
          CRT=$JUICE/src/graphics/crt.rs
          require "TASK-88  module crt déclaré"               -n '^pub mod crt;$' "$JUICE/src/graphics/mod.rs"
          require "TASK-88  le plugin enregistre le filtre"   -n '^\s+app\.add_plugins\(FullscreenMaterialPlugin::<CrtMaterial>::default\(\)\);$' "$JUICE/src/graphics/plugin.rs"
          require "TASK-88  la synchronisation est ordonnancée" -n '^\s+app\.add_systems\(Update, sync_crt_material\);$' "$JUICE/src/graphics/plugin.rs"
          require "TASK-88  le filtre est un FullscreenMaterial" -n '^impl FullscreenMaterial for CrtMaterial \{$' "$CRT"
          require "TASK-88  la passe vit dans Core2d"         -U 'fn schedule\(\) -> impl ScheduleLabel \+ Clone \{\n\s*Core2d\n' "$CRT"
          require "critère 1  set PostProcess de la 2D"       -n '\.in_set\(Core2dSystems::PostProcess\)' "$CRT"
          require "critère 1  après le tonemapping"           -U 'system\s*\.in_set\(Core2dSystems::PostProcess\)\s*\.after\(tonemapping\)' "$CRT"
          forbid  "critère 1  set précoce ou prépasse"        -n 'EarlyPostProcess|Prepass' "$JUICE/src"
          forbid  "TASK-88  passe 3D"                         -n '\bCore3d' "$CRT"
          forbid  "TASK-88  matériau asset, bind group ou ressource" -n 'derive\([^)]*(Asset|AsBindGroup|Resource)' "$CRT"
          forbid  "TASK-88  remplissage dans l'uniforme"      -n '_pad' "$CRT"
          forbid  "TASK-88  booléen dans le filtre"           -n '^\s*(pub\s+)?\w+\s*:\s*bool\b' "$CRT"
          require "critère 2  miroir Rust du CRT, quatre champs" -U '(?s)curvature.*?// offset +0\b.*?scanline_intensity.*?// offset +4\b.*?vignette_roundness.*?// offset +8\b.*?chromatic_aberration.*?// offset 12' "$CRT"
          require "TASK-88  shader désigné par la source unique" -n '^\s+CRT_POSTPROCESS_SHADER\.into\(\)$' "$CRT"
          require "TASK-88  la condition pure de TASK-83"     -n 'settings\.is_active\(&safe_mode\)' "$CRT"
          require "TASK-88  écriture gardée par is_changed"   -n 'settings\.is_changed\(\)' "$CRT"
          count   "critère 5  intensity multiplie les quatre champs" 4 -n '\* settings\.intensity' "$CRT"

          # TASK-89 : le WGSL du filtre. Les trois déclarations de bindings et
          # l'import, à la lettre des sources ; le miroir WGSL des quatre
          # champs, pendant de la garde Rust de TASK-88 ; aucune horloge du GPU
          # dans ce shader, seul de l'étape ; rien qui ne passe pas sous
          # webgl2 dans aucun shader ; le noir hors du tube avant le premier
          # échantillonnage, et rien avant lui ; la densité des scanlines lue
          # sur la cible ; trois échantillonnages, pas un de plus.
          CRTW=$SHADERS/crt_postprocess.wgsl
          require "TASK-89  import du triangle plein écran"   -n '^#import bevy_core_pipeline::fullscreen_vertex_shader::FullscreenVertexOutput$' "$CRTW"
          require "TASK-89  texture d'écran en 0"             -n '^@group\(0\) @binding\(0\) var screen_texture: texture_2d<f32>;$' "$CRTW"
          require "TASK-89  sampler en 1"                     -n '^@group\(0\) @binding\(1\) var screen_sampler: sampler;$' "$CRTW"
          require "TASK-89  uniforme en 2"                    -n '^@group\(0\) @binding\(2\) var<uniform> settings: CrtUniform;$' "$CRTW"
          require "critère 2  miroir WGSL du CRT, quatre champs" -U '(?s)curvature.*?// offset +0\b.*?scanline_intensity.*?// offset +4\b.*?vignette_roundness.*?// offset +8\b.*?chromatic_aberration.*?// offset 12' "$CRTW"
          forbid  "critère 5  horloge du GPU dans le filtre"  -n '\bglobals\b' "$CRTW"
          forbid  "critère 8  hors webgl2"                    -n 'textureStore|var<storage|@compute|@workgroup_size' "$SHADERS"
          require "TASK-89  noir hors du tube avant l'échantillonnage" -U 'if \(uv\.x < 0\.0 \|\| uv\.x > 1\.0 \|\| uv\.y < 0\.0 \|\| uv\.y > 1\.0\) \{\s*return vec4<f32>\(0\.0, 0\.0, 0\.0, 1\.0\);\s*\}[\s\S]*?textureSample' "$CRTW"
          forbid  "TASK-89  échantillonnage avant le garde"   -U '(?s)textureSample.*?if \(uv\.x < 0\.0' "$CRTW"
          require "TASK-89  densité des scanlines lue sur la cible" -n 'textureDimensions\(screen_texture\)' "$CRTW"
          count   "TASK-89  trois échantillonnages"   3        -n 'textureSample' "$CRTW"

          # TASK-90 : le contour holographique et sa banque. Forme A, un seul
          # `#[uniform(0)]` en tête de ligne, texture en 1 et sampler en 2
          # comme le `ColorMaterial` de Bevy ; trente-deux octets, cinq champs
          # dans l'ordre, offsets en commentaire, remplissage à 28, masque de
          # face en `f32` ; aucun champ de temps ; aucun composant dérivé, une
          # seule ressource, la banque ; les quatre index d'état à leurs
          # valeurs ; aucune écriture de matériau après construction ; quatre
          # couleurs de départ converties une fois depuis le sRGB.
          HOLO=$JUICE/src/graphics/holo.rs
          require "TASK-90  module holo déclaré"              -n '^pub mod holo;$' "$JUICE/src/graphics/mod.rs"
          require "TASK-90  le plugin enregistre le contour"  -n '^\s+app\.add_plugins\(Material2dPlugin::<HoloOutlineMaterial>::default\(\)\);$' "$JUICE/src/graphics/plugin.rs"
          require "TASK-90  la banque se construit au démarrage" -n '^\s+app\.add_systems\(Startup, build_holo_bank\);$' "$JUICE/src/graphics/plugin.rs"
          require "TASK-90  le contour est un Material2d"     -n '^impl Material2d for HoloOutlineMaterial \{$' "$HOLO"
          require "TASK-90  shader désigné par la source unique" -n '^\s+HOLO_CARD_SHADER\.into\(\)$' "$HOLO"
          count   "critère 2  un seul uniform(0) dans le contour" 1 -n '^\s*#\[uniform\(0' "$HOLO"
          require "TASK-90  texture en 1"                     -n '^\s*#\[texture\(1\)\]$' "$HOLO"
          require "TASK-90  sampler en 2"                     -n '^\s*#\[sampler\(2\)\]$' "$HOLO"
          forbid  "TASK-90  champ de temps dans l'uniforme"   -n '^\s*(pub\s+)?time\s*:' "$HOLO"
          forbid  "TASK-90  composant dérivé dans le contour" -n 'derive\([^)]*Component' "$HOLO"
          count   "TASK-90  une seule ressource, la banque" 1 -n 'derive\([^)]*Resource' "$HOLO"
          require "TASK-90  la banque est la ressource"       -U 'derive\(Resource[^)]*\)\]\s*\npub struct HoloMaterials \{' "$HOLO"
          require "critère 2  miroir Rust du contour, cinq champs" -U '(?s)outline_color.*?// offset +0\b.*?outline_width.*?// offset 16.*?rainbow_shift.*?// offset 20.*?mask_face.*?// offset 24.*?_pad.*?// offset 28' "$HOLO"
          require "TASK-90  remplissage explicite à l'offset 28" -n '^\s+pub _pad: f32,\s*// offset 28' "$HOLO"
          require "TASK-90  masque de face en f32"            -n '^\s+pub mask_face: f32,' "$HOLO"
          require "TASK-90  index des états"                  -U 'pub const IDLE: usize = 0;[\s\S]*?pub const HOVER: usize = 1;[\s\S]*?pub const SCORING: usize = 2;[\s\S]*?pub const HIDDEN: usize = 3;' "$HOLO"
          forbid  "TASK-90  matériau écrit après sa construction" -n 'get_mut\(' "$HOLO"
          count   "TASK-90  quatre couleurs de départ" 4      -n 'Srgba::hex\("#[0-9A-F]{6}"\)' "$HOLO"

          # TASK-91 : le shader du contour et l'échange de handle. Imports et
          # bindings à la lettre ; le miroir WGSL des cinq champs ; l'horloge
          # du GPU pour la pulsation et le balayage, aucun champ de temps ; la
          # face jamais échantillonnée sous le masque ; la valeur d'un dé jamais
          # lue par le rendu ; les noms proscrits absents de tout ; le masquage
          # premier dans l'état de contour ; le survol par `Interaction` ; les
          # dés habillés puis suivis ; le handle réécrit seulement s'il diffère.
          HW=$SHADERS/holo_card.wgsl
          require "TASK-91  import de la sortie du vertex 2D"  -n '^#import bevy_sprite::mesh2d_vertex_output::VertexOutput$' "$HW"
          require "TASK-91  import de l'horloge du GPU"        -n '^#import bevy_sprite::mesh2d_view_bindings::globals$' "$HW"
          require "TASK-91  pulsation et balayage sur l'horloge" -n 'globals\.time' "$HW"
          require "TASK-91  uniforme en 0"                     -n '^@group\(#\{MATERIAL_BIND_GROUP\}\) @binding\(0\) var<uniform> material: HoloUniform;$' "$HW"
          require "TASK-91  texture de face en 1"              -n '^@group\(#\{MATERIAL_BIND_GROUP\}\) @binding\(1\) var face_texture: texture_2d<f32>;$' "$HW"
          require "TASK-91  sampler en 2"                      -n '^@group\(#\{MATERIAL_BIND_GROUP\}\) @binding\(2\) var face_sampler: sampler;$' "$HW"
          require "critère 2  miroir WGSL du contour, cinq champs" -U '(?s)outline_color.*?// offset +0\b.*?outline_width.*?// offset 16.*?rainbow_shift.*?// offset 20.*?mask_face.*?// offset 24.*?_pad.*?// offset 28' "$HW"
          forbid  "TASK-91  champ de temps dans le WGSL"       -n '^\s*time\s*:' "$HW"
          require "critère 7  la face n'est pas échantillonnée sous le masque" -U 'if \(material\.mask_face > 0\.5\) \{[^}]*\} else \{[^}]*textureSample\(face_texture' "$HW"
          forbid  "critère 7  la valeur du dé lue par le rendu" -n 'current_value' "$JUICE/src/graphics"
          forbid  "critère 7  noms proscrits"                  -n '\b(DieComponent|DieEntity|SelectedForScore|HiddenDie|ScoringDie)\b' crates/ assets/
          require "TASK-91  le masquage prime"                 -U 'fn outline_state\(hidden: bool, scoring: bool, hovered: bool\) -> usize \{\n\s*if hidden \{\n\s*return HoloMaterials::HIDDEN;' "$HOLO"
          require "TASK-91  survol par Interaction"            -n 'Option<&.a Interaction>' "$HOLO"
          require "TASK-91  les dés sont habillés puis suivis" -n '^\s+app\.add_systems\(Update, \(dress_dice, sync_die_outline\)\.chain\(\)\);$' "$JUICE/src/graphics/plugin.rs"
          require "TASK-91  handle réécrit seulement s'il diffère" -n 'material\.0\.id\(\) != target\.id\(\)' "$HOLO"

          # TASK-92 : le mode dégradé. Un seul `SafeMode`, dans les réglages,
          # jamais un module ; `graphics/` ne passe que par ses méthodes (les
          # gardes TASK-83 sur le drapeau restent) ; l'argument de ligne de
          # commande lu dans build ; l'échec d'un shader écouté, journalisé,
          # engagé, jamais une panique ; la réconciliation sur changement
          # seulement ; fond et dés plats par un Sprite uni ; la banque et le
          # quad ne se construisent pas en mode dégradé ; le masque de face
          # n'est lu que par le contour.
          PLG=$JUICE/src/graphics/plugin.rs
          forbid  "TASK-92  panique dans le plugin"            -n 'panic!|\.unwrap\(\)|\.expect\(' "$PLG"
          count   "TASK-92  un seul SafeMode" 1                -n '^pub struct SafeMode \{$' "$JUICE/src"
          forbid  "TASK-92  module du mode dégradé"            -n '^\s*(pub(\(crate\))? )?mod safe_mode' "$JUICE/src"
          require "TASK-92  l'argument de ligne de commande"   -n '^\s+if SafeMode::requested_by\(std::env::args\(\)\) \{$' "$PLG"
          require "TASK-92  l'échec d'un shader est écouté"    -n 'MessageReader<AssetLoadFailedEvent<Shader>>' "$PLG"
          require "TASK-92  l'échec est journalisé puis engagé" -U 'fn engage_safe_mode_on_shader_failure\([^{]*\{\n\s*for failure in failures\.read\(\) \{\n\s*warn!\(' "$PLG"
          require "TASK-92  la bascule est gardée par le changement" -n '^\s+\.run_if\(resource_changed::<SafeMode>\),$' "$PLG"
          require "TASK-92  le mode se lit par sa méthode"     -n 'is_engaged\(\)' "$JUICE/src/graphics"
          require "TASK-92  fond plat"                          -n 'Sprite::from_color\(SMALL\.primary, size\)' "$BG"
          require "TASK-92  le fond ne se dresse pas en mode dégradé" -U 'fn spawn_background_quad\([^{]*\{\n[^}]*?if safe_mode\.is_engaged\(\) \{' "$BG"
          require "TASK-92  dés plats"                          -n 'Sprite::from_color\(outline_color\(state\), Vec2::splat\(DIE_QUAD_SIZE\)\)' "$HOLO"
          require "TASK-92  la banque absente est le mode dégradé des dés" -n 'bank: Option<Res<HoloMaterials>>' "$HOLO"
          require "TASK-92  la banque ne se construit pas en mode dégradé" -U 'fn build_holo_bank\([^{]*\{\n\s*if safe_mode\.is_engaged\(\) \{\n\s*return;' "$HOLO"
          forbid  "TASK-92  masque de face lu hors du contour" -n 'mask_face' "$JUICE/src" -g '!**/graphics/holo.rs'
          forbid  "TASK-92  le contrôleur exigé sans fond"     -n 'mut controller: ResMut<VisualThemeController>' "$THEME"

          # TASK-93 : le Web. La configuration de rendu demande les limites
          # réelles de l'adaptateur (`Functionality`) ; `WebGL2`, l'héritière
          # de `Compatibility` déjà proscrite, fige des minima qu'un écran à
          # facteur 2 dépasse, mesuré : proscrite aussi. La cible de mesure
          # monte la configuration, le script de contrôle pèse les assets et
          # compare le total à la cible, la page de chargement charge le module.
          require "TASK-93  les limites de l'adaptateur"       -n '^\s+priority: WgpuSettingsPriority::Functionality,$' "$PLG"
          forbid  "TASK-93  limites minimales WebGL2 figées"   -n 'WgpuSettingsPriority::(WebGL2|WebGPU)\b' crates/ -g '!**/graphics/plugin.rs'
          forbid  "TASK-93  limites figées dans la configuration" -n 'priority: WgpuSettingsPriority::(WebGL2|WebGPU)' "$PLG"
          require "TASK-93  la cible monte la configuration de rendu" -n '^\s+DefaultPlugins\.set\(render_plugin\(\)\),$' crates/shop_system/src/bin/wasm_size.rs
          require "TASK-93  les assets pesés"                 -n '^assets=\$\(find assets -type f -exec cat \{\} \+ \| wc -c' ci/check-wasm-size.sh
          require "TASK-93  le total comparé à la cible"      -n '^if \[ "\$\{total\}" -gt "\$\{CIBLE_ABSOLUE\}" \]; then$' ci/check-wasm-size.sh
          require "TASK-93  la page charge le module"         -n '^\s+import init from "\./wasm_size\.js";$' ci/web/index.html

          # TASK-94 : l'audit de clôture existe, et le bloc de glossaire qu'il
          # relit est livré avec le code.
          require "TASK-94  l'audit de l'étape existe"        --files crates/ui_and_juice/tests -g 'step7_audit.rs'
          require "TASK-94  le bloc de glossaire livré"       -n '^## § 3 — Types canoniques, couche Bevy : lignes de l.Étape 7$' reports/glossaire-etape-7.md

          exit $status

      # ---- Étape 8 : audio dynamique et musique adaptative (TASK-95 et suivants) ----
      #
      # **L'étape est ouverte le 17 septembre 2026, avant les Étapes 10 et 9**,
      # par l'ADR-012 : l'audio est un pur lecteur d'état, il ne doit rien au
      # recalibrage. TASK-95 n'écrit aucune ligne dans `crates/` : un banc
      # d'essai **détaché du workspace** mesure les trois critères de la tâche 0
      # et l'addendum à l'ADR-006 consigne la branche retenue.
      #
      # **Ancrer sur l'acte.** Les manifestes des crates de jeu nomment
      # `bevy_seedling` en commentaire pour dire qu'il arrive à cette étape :
      # la garde porte sur une ligne de dépendance, jamais sur le nom nu.
      - name: Invariants normatifs Étape 8
        run: |
          set -euo pipefail
          status=0
          forbid() {
            label=$1; shift
            out=$(rg "$@" 2>&1) && rc=0 || rc=$?
            case $rc in
              1) printf '  ok    %s\n' "$label" ;;
              0) printf '  ECHEC %s\n%s\n' "$label" "$out"; status=1 ;;
              *) printf '  ECHEC %s : rg a échoué (code %s)\n%s\n' "$label" "$rc" "$out"; status=1 ;;
            esac
          }
          require() {
            label=$1; shift
            out=$(rg "$@" 2>&1) && rc=0 || rc=$?
            case $rc in
              0) printf '  ok    %s\n' "$label" ;;
              *) printf '  ECHEC %s : motif attendu absent (code %s)\n%s\n' "$label" "$rc" "$out"; status=1 ;;
            esac
          }
          count() {
            label=$1; expected=$2; shift 2
            n=$( (rg "$@" || true) | wc -l | tr -d ' ')
            if [ "$n" = "$expected" ]; then printf '  ok    %s\n' "$label"; else printf '  ECHEC %s : %s occurrence(s), %s attendue(s)\n' "$label" "$n" "$expected"; status=1; fi
          }

          PROBE=tools/audio_probe
          ADDENDUM=docs/adr/ADR-006-addendum.md

          # TASK-95 : le banc est une racine de workspace à lui seul. La table
          # vide suffit ; le manifeste racine ne le nomme pas, et la résolution
          # du workspace ne le voit pas. `cargo metadata` est interrogé, pas un
          # fichier : c'est la sortie de l'outil qui fait foi.
          require "TASK-95  le banc porte sa table workspace vide" -n '^\[workspace\]( #.*)?$' "$PROBE/Cargo.toml"
          forbid  "TASK-95  le manifeste racine nomme le banc"     -n 'audio_probe' Cargo.toml
          meta=$(cargo metadata --format-version 1 --locked) || { printf '  ECHEC TASK-95  cargo metadata a échoué\n'; status=1; meta=audio_probe; }
          if printf '%s' "$meta" | rg -q 'audio_probe'; then
            printf '  ECHEC TASK-95  le banc est visible de cargo metadata à la racine\n'; status=1
          else
            printf '  ok    TASK-95  le banc est invisible de cargo metadata à la racine\n'
          fi

          # Les deux épingles, au signe égal. 0.8.0 est la seule version de
          # `bevy_seedling` qui cible Bevy 0.19.
          require "TASK-95  bevy épinglée dans le banc"            -n '^bevy = \{ version = "=0\.19\.1", default-features = false' "$PROBE/Cargo.toml"
          require "TASK-95  bevy_seedling épinglée au signe égal"  -n '^bevy_seedling = \{ version = "=0\.8\.0"' "$PROBE/Cargo.toml"
          forbid  "TASK-95  bevy_audio activée dans le banc"       -n '^\s*"[^#]*"bevy_audio"|^\s*"bevy_audio"' "$PROBE/Cargo.toml"

          # Licences : la liste globale reste permissive, MPL-2.0 n'y entre
          # pas, neuf exceptions nommées et rien d'autre, aucun copyleft fort.
          count   "TASK-95  neuf exceptions MPL-2.0 nommées" 9     -n '^\s+\{ allow = \["MPL-2\.0"\], crate = "(symphonia(-[a-z-]+)?|triple_buffer)" \},$' "$PROBE/deny.toml"
          count   "TASK-95  aucune autre exception" 9              -n '^\s+\{ allow = ' "$PROBE/deny.toml"
          forbid  "TASK-95  MPL dans la liste globale du banc"     -U -n '^allow = \[[^\]]*MPL' "$PROBE/deny.toml"
          forbid  "TASK-95  copyleft fort dans une politique"      -n 'GPL' "$PROBE/deny.toml" deny.toml
          require "TASK-95  cargo deny tourne dans le banc"        -n '^\s+manifest-path: tools/audio_probe/Cargo\.toml$' .github/workflows/ci.yml

          # Aucun DSP maison : le banc n'implémente aucun nœud Firewheel, il
          # monte ceux de la crate. Et aucun backend audio n'entre dans une
          # crate amont, ni maintenant ni après TASK-96.
          forbid  "TASK-95  nœud audio écrit à la main dans le banc" -n 'impl\s+(AudioNode|AudioNodeProcessor)\b' "$PROBE/src"
          forbid  "TASK-95  backend audio dans une crate amont"    -n '^\s*(bevy_seedling|firewheel|kira|rodio)\s*=' Cargo.toml crates/core_engine/Cargo.toml crates/game_state/Cargo.toml crates/ui_and_juice/Cargo.toml crates/shop_system/Cargo.toml crates/sim_harness/Cargo.toml

          # L'addendum : la branche, la version, les trois rectifications, et
          # des chiffres. « Environ » n'est pas une mesure.
          require "TASK-95  l'addendum nomme la branche et la version" -n '^\*\*Branche retenue : A, `bevy_seedling` `=0\.8\.0`' "$ADDENDUM"
          count   "TASK-95  trois critères, trois verdicts" 3       -n '^\| [123] \| .* \| \*\*passe\*\* \|$' "$ADDENDUM"
          count   "TASK-95  trois rectifications de l'ADR-006" 3    -n '^- \*\*Rectification [123]\.\*\*' "$ADDENDUM"
          forbid  "TASK-95  valeur estimée dans l'addendum"        -n -i '\benviron\b|a priori|à peu près|~ ?[0-9]' "$ADDENDUM"

          # TASK-96 : la crate audio entre dans le workspace, sixième membre, à
          # sa place dans le graphe : après sa sœur la boutique, avant le harnais.
          # Son manifeste applique la branche A de l'addendum, **sans les défauts
          # du backend**, pesés à ce ticket : le décodeur OGG, la sortie audio, et
          # le seul nœud de réverbération pris dans le moteur.
          AUDIO=crates/audio_system
          require "TASK-96  six membres, dans l'ordre du graphe"   -U -n 'members = \[\n  "crates/core_engine",\n  "crates/game_state",\n  "crates/ui_and_juice",\n  "crates/shop_system",\n  "crates/audio_system",\n  "crates/sim_harness",\n\]' Cargo.toml
          require "TASK-96  backend épinglé, sans ses défauts"     -n '^bevy_seedling = \{ version = "=0\.8\.0", default-features = false, features = \["ogg", "cpal"\] \}$' "$AUDIO/Cargo.toml"
          require "TASK-96  le seul nœud de réverbération"         -n '^firewheel = \{ version = "0\.12", default-features = false, features = \["freeverb_node"\] \}$' "$AUDIO/Cargo.toml"
          forbid  "TASK-96  feature son de Bevy dans la crate audio" -n '"(audio|bevy_audio|vorbis|symphonia-[a-z]+|flac|mp3|wav)"' "$AUDIO/Cargo.toml"
          forbid  "TASK-96  dépendance inverse vers la crate audio" -n '^\s*audio_system\s*=' crates/core_engine/Cargo.toml crates/game_state/Cargo.toml crates/ui_and_juice/Cargo.toml crates/shop_system/Cargo.toml crates/sim_harness/Cargo.toml
          # La forme du plugin a changé à TASK-97 : il porte un discriminant.
          require "TASK-96  le plugin vit dans lib.rs"             -n '^pub struct GameAudioPlugin \{$' "$AUDIO/src/lib.rs"
          count   "TASK-96  cinq modules posés une fois pour toutes" 5 -n '^pub mod (backend|bus|music|pitch|sfx);$' "$AUDIO/src/lib.rs"
          require "TASK-96  le contrat de la crate existe"         --files "$AUDIO/tests" -g 'audio_contract.rs'

          # Les licences constatées à TASK-95 entrent dans la politique du dépôt
          # sous la même forme que dans le banc : neuf exceptions nommées.
          count   "TASK-96  neuf exceptions MPL-2.0 à la racine" 9 -n '^\s+\{ allow = \["MPL-2\.0"\], crate = "(symphonia(-[a-z-]+)?|triple_buffer)" \},$' deny.toml
          count   "TASK-96  aucune autre exception à la racine" 9  -n '^\s+\{ allow = ' deny.toml
          forbid  "TASK-96  MPL dans la liste globale du dépôt"    -U -n '^allow = \[[^\]]*MPL' deny.toml

          # Le runner doit porter les en-têtes ALSA tant que le backend lie cpal,
          # et les porter avant le premier cargo du job.
          require "TASK-96  ALSA installé sur le runner"           -n '^\s+sudo apt-get install -y libasound2-dev$' .github/workflows/ci.yml
          require "TASK-96  ALSA avant le premier cargo"           -U -n 'libasound2-dev\n\n      - run: cargo fmt --check' .github/workflows/ci.yml

          # TASK-97 : la façade est la seule frontière avec le backend. Les cinq
          # autres fichiers de sources ne le nomment pas, pas même en prose, et
          # aucun handle du backend n'en sort : ils ne connaissent que des index.
          BACKEND=$AUDIO/src/backend.rs
          forbid  "TASK-97  la façade fuit hors de backend.rs"     -n 'bevy_seedling|firewheel|kira|bevy_audio|rodio|cpal|Handle<' "$AUDIO/src/lib.rs" "$AUDIO/src/bus.rs" "$AUDIO/src/music.rs" "$AUDIO/src/pitch.rs" "$AUDIO/src/sfx.rs"
          require "TASK-97  le trait, objet-sûr et lisible par Any" -n '^pub trait AudioBackend: Any \+ Send \+ Sync \{$' "$BACKEND"
          count   "TASK-97  cinq méthodes, celles du ticket" 5     -n '^\s+fn (load_clip|play|load_layer|set_layer_gain|set_bus_gain)\(&mut self.*;$' "$BACKEND"
          forbid  "TASK-97  une voie nommée sans être chargée"     -n 'fn layer\(' "$BACKEND"
          forbid  "TASK-97  implémentation sous attribut de test ou feature" -n 'cfg\(test\)|cfg\(feature|feature = "' "$BACKEND"
          forbid  "TASK-97  feature de fixtures déclarée"          -n '^test-fixtures\s*=' --glob '**/Cargo.toml' Cargo.toml crates/
          require "TASK-97  ressource porteuse, Resource seule"    -U -n '#\[derive\(Resource\)\]\npub struct AudioBackendHandle\(pub Box<dyn AudioBackend>\);' "$BACKEND"
          require "TASK-97  le plugin porte un discriminant"       -n '^\s+kind: BackendKind,$' "$AUDIO/src/lib.rs"
          forbid  "TASK-97  le plugin porte le backend"            -n 'Box<dyn' "$AUDIO/src/lib.rs"
          require "TASK-97  build monte le backend"                -n '^\s+backend::install\(app, self\.kind\);$' "$AUDIO/src/lib.rs"

          # Ce que TASK-95 a mesuré et que ce fichier applique. L'unité de la
          # façade est l'amplitude linéaire : un volume « linéaire » du moteur
          # vaut son carré, il ne s'écrit donc jamais tel quel. La réverbération
          # ne rend que l'humide : en parallèle, jamais chaînée. Les couches
          # partent sous un même horodatage, jamais créées en pause. Le graphe
          # part du gabarit vide : celui par défaut impose un limiteur.
          require "TASK-97  amplitude convertie en décibels"       -n '^\s+Volume::Decibels\(20\.0 \* gain\.log10\(\)\)$' "$BACKEND"
          forbid  "TASK-97  volume linéaire du moteur écrit tel quel" -n 'Volume::Linear\(' "$BACKEND"
          require "TASK-97  réverbération en parallèle du bus"     -U -n '\.connect\(SfxBus\)\n\s+\.connect\(reverb\);' "$BACKEND"
          forbid  "TASK-97  réverbération chaînée en série"        -n 'chain_node\(FreeverbNode' "$BACKEND"
          require "TASK-97  couches sous un même horodatage"       -n '^\s+DiffTimestamp::new\(&time\),$' "$BACKEND"
          forbid  "TASK-97  lecteur créé en pause"                 -n 'with_playback\(false\)' "$BACKEND"
          require "TASK-97  graphe posé sur le gabarit vide"       -n '^\s+\.insert_resource\(AudioGraphTemplate::Empty\)$' "$BACKEND"
          forbid  "TASK-97  limiteur dans le graphe"               -n 'LimiterNode' "$BACKEND"
          require "TASK-97  la tuyauterie tourne en PostUpdate"    -n '^\s+\.add_systems\(PostUpdate, apply_seedling_backend\);$' "$BACKEND"
          require "TASK-97  le backend réel est écouté"            --files "$AUDIO/tests" -g 'real_backend.rs'
          require "TASK-97  le pilote hors ligne des tests"        --files "$AUDIO/tests/support" -g 'offline.rs'

          # TASK-98 : trois volumes utilisateur, une seule source de vérité. Les
          # trois champs n'existent qu'ici, `Default` s'écrit à la main (dérivé, il
          # rendrait trois zéros et un jeu muet sans erreur), `Resource` seule.
          BUSRS=$AUDIO/src/bus.rs
          count   "TASK-98  une seule ressource de volumes" 1      -n '^pub struct AudioBusVolumes \{$' crates/
          count   "TASK-98  trois champs, dans la ressource" 3     -n '^\s+pub (master|music|sfx): f32,$' "$BUSRS"
          # Ancrée sur la **forme d'un champ**, dans les sources : un test doit
          # pouvoir nommer ses paramètres `master`, `music` et `sfx`.
          forbid  "TASK-98  copie d'un volume hors de la ressource" -n '^\s+(pub(\([a-z]+\))? )?(master|music|sfx): f32,$' -g '**/src/**' -g '!**/audio_system/src/bus.rs' crates/
          require "TASK-98  Default écrit à la main"               -n '^impl Default for AudioBusVolumes \{$' "$BUSRS"
          forbid  "TASK-98  Default ou Component dérivés sur la ressource" -U -n '#\[derive\([^)]*(Default|Component)[^)]*\)\]\npub struct AudioBusVolumes' "$BUSRS"

          # **Les curseurs s'appliquent sur les bus, et nulle part ailleurs.** La
          # poussée est gardée par `is_changed` et vise trois bus, jamais le
          # routage réverbéré, qui rejoint le bus SFX. Un changement de volume ne
          # relance aucun son. Et personne ne remet à la façade les deux formules
          # de ce que l'auditeur entend : les curseurs sortiraient au carré, sans
          # qu'un test sur le backend nul le voie.
          require "TASK-98  poussée gardée par is_changed"         -n '^\s+if !volumes\.is_changed\(\) \{$' "$BUSRS"
          count   "TASK-98  exactement trois bus poussés" 3        -n '^\s+\(Bus::(Master|Music|Sfx), volumes\.(master|music|sfx), "' "$BUSRS"
          forbid  "TASK-98  routage réverbéré poussé"              -n 'Bus::SfxReverb' "$BUSRS"
          forbid  "TASK-98  son relancé par un changement de volume" -n '\.play\(' "$BUSRS"
          count   "TASK-98  quatre fonctions pures" 4              -n '^pub fn (sfx_volume\(v: &AudioBusVolumes, local_volume: f32\)|music_gain\(v: &AudioBusVolumes, stem_weight: f32, duck: f32\)|local_gain\(local_volume: f32\)|layer_gain\(stem_weight: f32, duck: f32\)) -> f32 \{$' "$BUSRS"
          forbid  "TASK-98  formule entendue remise à la façade"   -U -n '\.(play|set_layer_gain|set_bus_gain)\([^;]*\b(sfx_volume|music_gain)\(' "$AUDIO/src"
          require "TASK-98  valeur non finie lue comme le défaut"  -n '^\s+if value\.is_finite\(\) \{$' "$BUSRS"
          require "TASK-98  le plugin branche les volumes"         -n '^\s+bus::bus_plugin\(app\);$' "$AUDIO/src/lib.rs"
          require "TASK-98  les poussées de bus se comptent"       -n '^\s+pub fn bus_gain_writes\(&self\) -> &\[\(Bus, f32\)\] \{$' "$BACKEND"

          # TASK-99 : les gains cibles, fonction pure de l'état. Le seuil du
          # Climax n'est écrit **qu'une fois** dans les sources de la crate, sous
          # son nom, et la comparaison est entière, en u128 : un flottant perd
          # des unités au-delà de 2^53, une multiplication en u64 déborde. Les
          # tests vivent hors de `src` : ils tiennent la valeur par le
          # comportement, en littéraux, sans la récrire ici.
          MUSIC=$AUDIO/src/music.rs
          require "TASK-99  le seuil, sous son nom, et il vaut ce qu'il vaut" -n '^pub const CLIMAX_THRESHOLD_PERCENT: u128 = 75; //' "$MUSIC"
          count   "TASK-99  le seuil n'est écrit qu'une fois" 1    -n '75' "$AUDIO/src"
          count   "TASK-99  une seule définition du seuil" 1       -n 'const CLIMAX_THRESHOLD_PERCENT' crates/
          require "TASK-99  comparaison entière en u128"           -n '^\s+if \(b\.current_score as u128\) \* 100 >= \(b\.target_score as u128\) \* CLIMAX_THRESHOLD_PERCENT \{$' "$MUSIC"
          forbid  "TASK-99  flottant double dans la musique"       -n 'f64' "$MUSIC"
          require "TASK-99  tension sur Boss ou dernière main"     -n '^\s+if b\.blind\.kind == BlindType::Boss \|\| b\.hands_remaining <= 1 \{$' "$MUSIC"
          require "TASK-99  signature pure de target_gains"        -U -n '^pub fn target_gains\(\n\s+app: AppState,\n\s+phase: Option<RunPhase>,\n\s+blind: Option<&BlindContext>,\n\) -> \[f32; 4\] \{$' "$MUSIC"
          require "TASK-99  le filtre des contextes périmés"       -U -n '^pub fn blind_in_play\(\n\s+app: AppState,\n\s+phase: Option<RunPhase>,\n\s+blind: Option<&BlindContext>,\n\) -> Option<&BlindContext> \{$' "$MUSIC"
          require "TASK-99  chemin réel des types de blind"        -n '^use core_engine::blinds::\{BlindContext, BlindType\};$' "$MUSIC"
          forbid  "TASK-99  chemin mort des types de blind"        -n 'crate::blind\b|core_engine::blind::|blinds::definition' "$AUDIO/src"
          # L'audio ne calcule jamais un score et n'anticipe aucun total : il lit
          # le score commis, et rien de la file de dépilement.
          forbid  "TASK-99  total anticipé par l'audio"            -n 'ScoringStepQueue|ScoringReport|final_score' "$AUDIO/src"

          # TASK-100 : la ressource qui pilote les quatre couches, et leurs voies
          # créées une seule fois, au démarrage, hors de toute portée d'état. Les
          # gardes sont ancrées sur une **ligne de code** (`^[^/]*`) : la doc a le
          # droit de nommer ce qu'elle interdit.
          LIB=$AUDIO/src/lib.rs
          require "TASK-100 ressource musicale, Resource seule"    -U -n '#\[derive\(Resource\)\]\npub struct AdaptiveMusicManager \{$' "$MUSIC"
          count   "TASK-100 une seule ressource musicale" 1        -n '^pub struct AdaptiveMusicManager \{$' crates/
          require "TASK-100 six champs, ceux du document source"   -U -n '^pub struct AdaptiveMusicManager \{\n\s+pub layers: \[LayerHandle; 4\],\n\s+pub current_gains: \[f32; 4\],\n\s+pub target_gains: \[f32; 4\],\n\s+pub fade_per_second: f32,\n\s+pub duck: f32,\n\s+pub duck_timer: Timer,\n\}$' "$MUSIC"
          forbid  "TASK-100 Default écrit pour la ressource"       -n '^impl Default for AdaptiveMusicManager' crates/
          forbid  "TASK-100 ressource musicale en init_resource"   -n '^[^/]*init_resource::<AdaptiveMusicManager>' crates/
          count   "TASK-100 la ressource est insérée une fois" 1   -n '^\s+commands\.insert_resource\(AdaptiveMusicManager \{$' "$AUDIO/src"

          # **Aucune entité musicale sous portée d'état**, et l'audio n'écrit
          # aucune transition : il faut nommer `NextState` pour en écrire une.
          # Les voies naissent au démarrage, jamais à une entrée d'état, où elles
          # seraient recréées à chaque passage.
          forbid  "TASK-100 marqueur de despawn lié à un état"     -n '^[^/]*DespawnOn(Enter|Exit)' "$AUDIO/src"
          forbid  "TASK-100 transition écrite par l'audio"         -n '^[^/]*NextState' "$AUDIO/src"
          require "TASK-100 point d'enregistrement de la musique"  -n '^pub fn music_plugin\(app: &mut App\) \{$' "$MUSIC"
          require "TASK-100 voies créées au démarrage"             -n '^\s+app\.add_systems\(Startup, setup_music_layers\);$' "$MUSIC"
          count   "TASK-100 un seul enregistrement du chargeur" 1  -n '^[^/]*add_systems\([^;]*setup_music_layers' "$AUDIO/src"
          require "TASK-100 build branche la musique"              -n '^\s+music::music_plugin\(app\);$' "$LIB"
          forbid  "TASK-100 système enregistré dans lib.rs"        -n '^[^/]*add_systems' "$LIB"

          # **Charger, pas seulement nommer.** Un seul site appelle le chargement
          # des couches, avec les quatre fichiers dans l'ordre des index ; les
          # chemins sont relatifs à la racine des assets. Le backend nul compte
          # les appels, l'état des couches étant plafonné à quatre cases.
          count   "TASK-100 un seul site charge les couches" 1     -n '^[^/]*\.load_layer\(' "$AUDIO/src"
          require "TASK-100 quatre couches, par la constante"      -n '^\s+std::array::from_fn\(\|index\| backend\.load_layer\(&assets, STEM_PATHS\[index\], index as u8\)\);$' "$MUSIC"
          require "TASK-100 quatre stems, dans l'ordre des index"  -U -n '^pub const STEM_PATHS: \[&str; 4\] = \[\n\s+"audio/stem_base\.ogg",\n\s+"audio/stem_melody\.ogg",\n\s+"audio/stem_tension\.ogg",\n\s+"audio/stem_climax\.ogg",\n\];$' "$MUSIC"
          forbid  "TASK-100 chemin écrit depuis la racine du dépôt" -n '^[^/]*"assets/' "$AUDIO/src"
          require "TASK-100 les chargements de couche se comptent" -n '^\s+pub fn layer_loads\(&self\) -> &\[\(String, u8\)\] \{$' "$BACKEND"

          # Le minuteur du ducking : durée exacte, mode `Once`, **né terminé par
          # un `tick`** (écrire l'horloge ne recalcule rien), puis un `tick` nul
          # pour que rien ne « vienne de se terminer » au lancement. La méthode
          # `finished()` du corpus n'existe plus en 0.19.
          require "TASK-100 durée du ducking, exacte"              -n '^pub const DUCK_DURATION: Duration = Duration::from_millis\(1_200\);$' "$MUSIC"
          require "TASK-100 minuteur à un coup"                    -n '^\s+let mut timer = Timer::new\(DUCK_DURATION, TimerMode::Once\);$' "$MUSIC"
          require "TASK-100 minuteur né terminé, par deux tick"    -U -n '^\s+timer\.tick\(DUCK_DURATION\);\n\s+timer\.tick\(Duration::ZERO\);$' "$MUSIC"
          forbid  "TASK-100 horloge écrite au lieu du tick"        -n '^[^/]*set_elapsed' "$MUSIC"
          forbid  "TASK-100 méthode disparue du minuteur"          -n '^[^/]*\.finished\(\)' "$AUDIO/src"
          require "TASK-100 vitesse de fondu, sous son nom"        -n '^pub const DEFAULT_FADE_PER_SECOND: f32 = 2\.0;$' "$MUSIC"

          # `AssetPlugin` est exigé des trois constructeurs, et `build` le dit :
          # en 0.19 une ressource manquante fait paniquer le système, sous un
          # message qui ne nomme ni le système ni le paramètre.
          require "TASK-100 build exige l'AssetPlugin"             -n '^\s+app\.world\(\)\.contains_resource::<AssetServer>\(\),$' "$LIB"

          # Le backend nul ne crée aucune entité : la survie des voies s'écoute
          # sur le backend réel, dont les tests passent par le chargeur du jeu.
          require "TASK-100 la survie s'écoute sur le son rendu"   -n '^fn test_music_survives_the_state_cycle\(\) \{$' "$AUDIO/tests/real_backend.rs"
          require "TASK-100 chaque couche s'écoute seule"          -n '^fn test_each_layer_handle_drives_its_own_stem\(\) \{$' "$AUDIO/tests/real_backend.rs"
          forbid  "TASK-100 un test du son charge ses couches"     -n '^[^/]*\.load_layer\(' "$AUDIO/tests/real_backend.rs"
          count   "TASK-100 fixtures aux noms de production" 4     --files "$AUDIO/tests/assets/audio" -g 'stem_{base,melody,tension,climax}.ogg'

          # TASK-101 : le seul système qui fait sonner la musique. Il tourne
          # partout, menu compris : la phase de run et le contexte de blind sont
          # optionnels, l'état de l'application ne l'est pas, et `build` exige la
          # machine à états. (La garde de TASK-100 « gain poussé par ce ticket »
          # était datée : elle est levée ici, et remplacée par un comptage.)
          require "TASK-101 phase de run optionnelle"              -n '^\s+phase: Option<Res<State<RunPhase>>>,$' "$MUSIC"
          require "TASK-101 contexte de blind optionnel"           -n '^\s+blind: Option<Res<BlindContext>>,$' "$MUSIC"
          forbid  "TASK-101 paramètre pris nu"                     -n '^[^/]*[ (]Res<(State<RunPhase>|BlindContext)>' "$AUDIO/src"
          require "TASK-101 état de l'application pris nu"         -n '^\s+app_state: Res<State<AppState>>,$' "$MUSIC"
          forbid  "TASK-101 état de l'application optionnel"       -n '^[^/]*Option<Res<State<AppState>>>' "$AUDIO/src"
          require "TASK-101 build exige la machine à états"        -n '^\s+app\.world\(\)\.contains_resource::<State<AppState>>\(\)$' "$LIB"
          require "TASK-101 build exige la sous-phase de run"      -n '^\s+\.contains_resource::<Messages<StateTransitionEvent<RunPhase>>>\(\),$' "$LIB"
          # Ancrée sur l'appel, par son point : le message de `build` nomme ces
          # méthodes pour dire à qui les appeler.
          forbid  "TASK-101 états initialisés par l'audio"         -n '^[^/]*\.(init_state|add_sub_state|insert_state)(::<|\()' "$AUDIO/src"
          require "TASK-101 système enregistré en Update"          -n '^\s+app\.add_systems\(Update, update_music_gains\);$' "$MUSIC"
          forbid  "TASK-101 condition d'état ou de changement"     -n '^[^/]*(run_if\(|in_state\(|is_changed\(\))' "$MUSIC"

          # Les cibles passent par le filtre des contextes périmés (TASK-99).
          # L'interpolation est exponentielle, écrite une fois, sur le pas de
          # temps de l'image. Ce qui part à la façade est `layer_gain` : les
          # curseurs s'appliquent sur les bus, la musique ne les lit pas.
          require "TASK-101 cibles filtrées par blind_in_play"     -n '^\s+manager\.target_gains = target_gains\(app, phase, blind_in_play\(app, phase, blind\.as_deref\(\)\)\);$' "$MUSIC"
          require "TASK-101 interpolation exponentielle"           -n '^\s+let t = 1\.0 - \(-manager\.fade_per_second \* time\.delta_secs\(\)\)\.exp\(\);$' "$MUSIC"
          count   "TASK-101 une seule exponentielle" 1             -n '^[^/]*\.exp\(\)' "$MUSIC"
          require "TASK-101 pas vers la cible"                     -n '^\s+manager\.current_gains\[i\] \+= \(target - manager\.current_gains\[i\]\) \* t;$' "$MUSIC"
          require "TASK-101 gain remis à la façade"                -n '^\s+let gain = layer_gain\(manager\.current_gains\[i\], manager\.duck\);$' "$MUSIC"
          count   "TASK-101 un seul site pousse les gains de couche" 1 -n '^[^/]*\.set_layer_gain\(' "$AUDIO/src"
          forbid  "TASK-101 curseurs lus par la musique"           -n '^[^/]*(AudioBusVolumes|volumes\.|music \* master)' "$MUSIC"
          forbid  "TASK-101 son relancé pour bouger un gain"       -n '^[^/]*\.play\(' "$MUSIC"

          # Le backend nul compte les poussées, il ne les journalise pas : il est
          # aussi celui d'une machine sans sortie audio, quatre poussées par image.
          require "TASK-101 les poussées de gain se comptent"      -n '^\s+pub fn layer_gain_pushes\(&self\) -> usize \{$' "$BACKEND"
          forbid  "TASK-101 journal des gains de couche"           -n '^[^/]*layer_gain[a-z_]*: Vec<' "$BACKEND"

          # Le mix s'écoute sur le son rendu, et les tests du son tiennent leurs
          # gains par la ressource : un gain posé par la façade serait écrasé.
          require "TASK-101 le mix s'écoute sur le son rendu"      -n '^fn test_state_changes_are_heard\(\) \{$' "$AUDIO/tests/real_backend.rs"
          forbid  "TASK-101 un test du son pousse un gain de couche" -n '^[^/]*\.set_layer_gain\(' "$AUDIO/tests/real_backend.rs"

          # TASK-102 : la banque de sons unique. Une seule ressource pour un rôle,
          # douze champs de clips, `Resource` seule, jamais sérialisée : son
          # générateur n'entre dans aucune sauvegarde.
          SFX=$AUDIO/src/sfx.rs
          count   "TASK-102 une seule banque de sons" 1            -n '^pub struct SoundEffectBank \{$' crates/
          require "TASK-102 la banque, Resource seule"             -U -n '#\[derive\(Resource\)\]\npub struct SoundEffectBank \{$' "$SFX"
          count   "TASK-102 douze champs de clips" 12              -n '^\s+pub [a-z_]+: (AudioClip|\[AudioClip; 6\]),$' "$SFX"
          require "TASK-102 le timbre de la figure de base"        -n '^\s+pub hand_base_chord: AudioClip,$' "$SFX"
          require "TASK-102 générateur privé"                      -n '^\s+rng: SmallRng,$' "$SFX"
          forbid  "TASK-102 générateur public"                     -n '^\s+pub(\([a-z]+\))? rng:' "$SFX"
          forbid  "TASK-102 l'audio sérialisé"                     -n '^[^/]*(Serialize|Deserialize|serde)' "$AUDIO/src"

          # **Jamais un flux du générateur de la run**, ni un cinquième flux : il
          # est sérialisé, et le nombre de sons joués dépend du volume et des
          # images. La portée s'arrête à `src` : le test central construit une
          # session, et il vit dans `tests/`.
          forbid  "TASK-102 générateur de la run nommé par l'audio" -n '^[^/]*(RunSession|RunRng)' "$AUDIO/src"
          forbid  "TASK-102 cinquième flux dans le générateur de la run" -n 'STREAM_AUDIO|pub audio: ChaCha8Rng' crates/
          count   "TASK-102 quatre flux, toujours" 4               -n '^\s+pub (dice|shop|boss|relic_effects): ChaCha8Rng,$' crates/core_engine/src/rng.rs
          require "TASK-102 le test central du générateur"         -n '^fn test_audio_never_advances_run_rng\(\) \{$' "$AUDIO/tests/audio_contract.rs"

          # Le tirage, verbatim aux deux corrections actées près : la méthode de
          # `rand` 0.10, et aucun clone d'un clip, qui est `Copy`. Le graine est
          # infaillible (`rand_core` 0.10, `SeedableRng::from_rng`).
          require "TASK-102 tirage de la variation"                -n '^\s+let idx = self\.rng\.random_range\(0\.\.6\);$' "$SFX"
          require "TASK-102 tirage de la hauteur, à cinq pour cent" -n '^\s+let pitch = 1\.0 \+ self\.rng\.random_range\(-0\.05\.\.=0\.05\);$' "$SFX"
          count   "TASK-102 deux tirages, pas un de plus" 2        -n '^[^/]*random_range' "$SFX"
          require "TASK-102 générateur à l'entropie système"       -n '^\s+rng: SmallRng::from_rng\(&mut rand::rng\(\)\),$' "$SFX"
          forbid  "TASK-102 méthodes disparues de rand"            -n '^[^/]*(gen_range|from_entropy|thread_rng\(|OsRng|rand::random\()' "$AUDIO/src"
          forbid  "TASK-102 clone d'un clip"                       -n '^[^/]*\.clone\(\)' "$SFX"

          # Un seul site charge les clips, au démarrage, et rien ne sort de la
          # façade. Un fichier absent n'arrête rien : ni résultat à déballer ici,
          # ni résultat ajouté à la façade.
          count   "TASK-102 un seul site charge les clips" 1       -n '^[^/]*\.load_clip\(' "$AUDIO/src"
          count   "TASK-102 dix-sept chemins de clips" 17          -n '^\s+(chip_tick: load\(|hand_base_chord: load\(|relic_chord: load\(|mult_hit: load\(|seal_tick: load\(|die_lock: load\(|hand_consumed: load\(|ui_hover: load\(|ui_click: load\(|coin: load\(|victory_fanfare: load\()?"audio/[a-z_0-9]+\.ogg"\)?,$' "$SFX"
          require "TASK-102 banque chargée au démarrage"           -n '^\s+app\.add_systems\(Startup, load_sound_effect_bank\);$' "$SFX"
          require "TASK-102 build branche la banque"               -n '^\s+sfx::sfx_plugin\(app\);$' "$LIB"
          forbid  "TASK-102 échec déballé dans la banque"          -n '^[^/]*(unwrap\(\)|expect\(|panic!)' "$SFX"
          require "TASK-102 load_clip rend toujours un clip"       -n '^\s+fn load_clip\(&mut self, assets: &AssetServer, path: &str\) -> AudioClip;$' "$BACKEND"

          # Le repli vit dans le backend réel : un chargement échoué est remplacé
          # par le bip et dit une fois, et un son dont le clip n'est pas résolu
          # attend dans la file. Un stem absent se dit, sans être remplacé.
          require "TASK-102 chargement échoué détecté"             -n '^\s+LoadState::Failed\(_\) => \{$' "$BACKEND"
          require "TASK-102 substitution dite, avec le chemin"     -n '^\s+Some\(path\) => warn!\("son introuvable, remplacé par un bip : \{path\}"\),$' "$BACKEND"
          require "TASK-102 son non résolu gardé en file"          -U -n '^\s+if !clip\.resolved \{\n\s+backend\.pending\.push\(sound\);$' "$BACKEND"
          require "TASK-102 stem absent dit une fois"              -n '^\s+if failed && !backend\.layer_warned\[index\] \{$' "$BACKEND"
          require "TASK-102 le bip s'écoute sur le son rendu"      -n '^fn test_a_missing_clip_is_heard_as_a_beep\(\) \{$' "$AUDIO/tests/real_backend.rs"
          require "TASK-102 le stem absent s'observe"              -n '^fn test_a_missing_stem_is_said_once\(\) \{$' "$AUDIO/tests/real_backend.rs"

          exit $status

      # ---- Passe rand 0.10 et Default (15 septembre 2026) ----
      #
      # Deux défauts du corpus, corrigés dans vingt tickets le 15 septembre
      # 2026 : la double borne sur le générateur, que le corpus imposait
      # verbatim et que clippy refuse sous `-D warnings`, et une méthode qui
      # n'existe plus en `rand` 0.10. Le dépôt portait la première en treize
      # signatures, sous treize attributs de complaisance. Les gardes sont
      # ancrées sur la signature et sur l'attribut, jamais sur le nom nu : la
      # prose garde le droit de dire « la double borne ».
      - name: Invariants de la passe rand 0.10
        run: |
          set -euo pipefail
          status=0
          forbid() {
            label=$1; shift
            out=$(rg "$@" 2>&1) && rc=0 || rc=$?
            case $rc in
              1) printf '  ok    %s\n' "$label" ;;
              0) printf '  ECHEC %s\n%s\n' "$label" "$out"; status=1 ;;
              *) printf '  ECHEC %s : rg a échoué (code %s)\n%s\n' "$label" "$rc" "$out"; status=1 ;;
            esac
          }

          forbid  "passe rand  double borne sur le générateur"  -n 'impl Rng \+ RngExt' crates/
          forbid  "passe rand  attribut de complaisance"         -n 'allow\(clippy::implied_bounds_in_impls\)' crates/
          forbid  "passe rand  méthode disparue de rand 0.10"    -n '\bgen_range\(' crates/

          exit $status

      # ---- Étape 6 bis : la porte d'équilibrage (TASK-154) ----
      #
      # **Ce ne sont pas cinq cents tirages, c'est toujours les mêmes cinq cents
      # runs.** La porte est un test doré, pas un test statistique, et elle
      # n'est donc jamais instable : elle ne peut échouer que si le code a
      # changé, et le changement se lit dans le diff.
      #
      # **Ni tolérance, ni relance, ni moyenne.** Élargir la fourchette, ou
      # n'échouer qu'au second dépassement, transforme un contrôle exact en
      # approximation et laisse passer précisément les dérives lentes que la
      # porte existe pour attraper. Rejouer la commande rejoue **le même calcul
      # déterministe** et rend donc le même résultat : cela ne stabilise rien,
      # cela double le temps de CI et cela installe l'idée que la porte est
      # capricieuse. Et moyenner sur plusieurs graines remplacerait le test doré
      # par un estimateur, dont la marge à cinq cents runs dépasse plusieurs
      # points.
      #
      # **Ce que la porte compare est le rapport entier, pas le seul taux de
      # victoire, et la mesure l'impose.** Au calibrage actuel le taux vaut zéro
      # sur cent mille runs comme sur cinq cents, à toute graine. Une fourchette
      # écrite sur cette grandeur serait soit nulle — donc rouge le jour où
      # quelqu'un répare le jeu —, soit large — donc verte pendant toute la
      # réparation. Le rapport, lui, porte les grandeurs qui discriminent
      # aujourd'hui : le rapport score sur cible par ante, et les taux
      # d'apparition, d'achat et de conservation des reliques.
      #
      # La cible reste **25 % – 40 %** de taux de victoire, et c'est le premier
      # chiffre que le rapport d'équilibrage de TASK-156 doit instruire. Elle
      # est écrite ici, une seule fois dans le dépôt.
      #
      # **La référence ne se met jamais à jour toute seule** — même discipline
      # que la référence de taille du binaire web : une référence qui se réécrit
      # depuis la CI enregistre la dérive au lieu de la signaler. Elle se change
      # par une modification explicite de `ci/short-gate-report.txt`, revue
      # comme le reste, dans la PR qui change le comportement.
      - name: Porte d'équilibrage (passe courte)
        run: |
          set -euo pipefail
          cargo run -p sim_harness --release -- \
            --runs 500 --seed-base "$(cat ci/short-gate-seed-base.txt)" \
            --cup standard --stake 1 \
            --policy grid-aware --shop-policy budget \
            --report > passe-courte.txt
          diff -u ci/short-gate-report.txt passe-courte.txt

  # Job **séparé**, et c'est délibéré. La compilation de Bevy pour le web en
  # `lto = "fat"` avec `codegen-units = 1` se compte en minutes ; l'agréger au
  # job de validation ferait passer chaque PR d'une minute quarante à vingt
  # minutes, y compris pour un changement d'une ligne de documentation.
  taille-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain (pilotée par rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          rustup show active-toolchain

      # Les deux versions sont **épinglées**. `wasm-bindgen` doit correspondre
      # exactement à la version de la crate que Bevy 0.19.1 tire, faute de quoi
      # l'outil refuse le module. Et une montée de binaryen fait bouger la
      # mesure sans qu'une seule ligne du projet ait changé : une référence
      # n'est comparable que si la chaîne est figée.
      #
      # Le binaire pré-compilé, jamais `cargo install` : compiler
      # `wasm-bindgen-cli` à froid dépasse à lui seul le budget de temps du job
      # de validation.
      - name: wasm-bindgen 0.2.128 et binaryen 132, épinglés
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.128/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz --strip-components=1 -C /usr/local/bin --wildcards '*/wasm-bindgen'
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz \
            | tar -xz --strip-components=2 -C /usr/local/bin binaryen-version_132/bin/wasm-opt
          wasm-bindgen --version
          wasm-opt --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Mesure et comparaison à la référence
        run: ci/check-wasm-size.sh
