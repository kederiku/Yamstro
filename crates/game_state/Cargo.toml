# crates/game_state/Cargo.toml
[package]
name = "game_state"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# Aligné sur `core_engine` : sans cela, `cargo deny` compte la crate comme
# non licenciée, `deny.toml` n'ignorant que les paquets privés.
publish = false

[dependencies]
# La version accompagne le chemin : une dépendance de chemin nue est comptée
# comme une dépendance joker, que `deny.toml` refuse.
core_engine = { path = "../core_engine", version = "0.1.0", features = ["bevy"] }
bevy = { workspace = true, default-features = false, features = [
  "bevy_asset", "bevy_color", "bevy_core_pipeline",
  "bevy_render", "bevy_sprite", "bevy_state", "bevy_text",
  "bevy_ui", "bevy_window", "bevy_winit",
  "multi_threaded", "png", "x11", "webgl2",
] }

# `getrandom` refuse `wasm32-unknown-unknown` par défaut : sans cette feature,
# la compilation s'arrête sur un `compile_error!`, et il n'y a pas de mesure de
# taille du tout. Elle arrive ici par `rand`, à travers `core_engine`. C'est la
# voie documentée en amont, pas un contournement : la crate exige que la cible
# web déclare explicitement son fournisseur d'aléa.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
# Réserve la cible de mesure de taille WebAssembly. Voir `src/bin/wasm_size.rs`.
measure = []

[[bin]]
name = "wasm_size"
required-features = ["measure"]
