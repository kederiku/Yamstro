# crates/ui_and_juice/Cargo.toml
[package]
name = "ui_and_juice"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# Aligné sur les deux autres crates : sans cela, `cargo deny` compte la crate
# comme non licenciée, `deny.toml` n'ignorant que les paquets privés.
publish = false

[dependencies]
# La version accompagne le chemin, sur les deux : une dépendance de chemin nue
# est comptée comme une dépendance joker, que `deny.toml` refuse.
core_engine = { path = "../core_engine", version = "0.1.0", features = ["bevy"] }
game_state = { path = "../game_state", version = "0.1.0" }
# Liste identique à celle de `game_state`, **plus `bevy_sprite_render`** : ni
# `bevy_audio`, ni `vorbis`, aucune feature 3D. En 0.19 `audio` n'est plus
# impliquée par `2d`, `3d` ni `ui`, et une feature absente l'est **sans erreur
# de compilation** : cette liste se lit comme un contrat.
#
# `bevy_sprite_render` est la crate de `Material2d`, `Material2dPlugin` et
# `MeshMaterial2d` (`bevy_sprite_render-0.19.1/src/mesh2d/material.rs`), que
# `bevy_sprite` n'implique pas (`bevy_internal-0.19.1/Cargo.toml:166`) : mesuré
# à TASK-82, elle était absente de tout l'arbre. Seule cette crate déclare des
# matériaux (TASK-84), `game_state` n'en a pas l'usage. Notre `webgl2` lui
# passe `webgl` de lui-même.
#
# Pas de `bevy_log` (TASK-92, mesuré) : la feature de la façade fait monter
# `LogPlugin` par `DefaultPlugins`, l'abonné `tracing-subscriber` entier, soit
# +741 971 octets de WASM. La bascule du mode dégradé journalise par la crate
# `log`, ci-dessous ; l'abonné est le choix de l'application, pas de cette
# crate.
bevy = { workspace = true, default-features = false, features = [
  "bevy_asset", "bevy_color", "bevy_core_pipeline",
  "bevy_render", "bevy_sprite", "bevy_sprite_render", "bevy_state",
  "bevy_text", "bevy_ui", "bevy_window", "bevy_winit",
  "multi_threaded", "png", "x11", "webgl2",
] }
# La façade de journalisation (TASK-92) : déjà dans l'arbre par `bevy_app`,
# zéro octet de plus ; `LogPlugin`, quand une application le monte, capte ses
# enregistrements par `LogTracer` (`bevy_log-0.19.1/src/lib.rs:387`).
log = "0.4"

# **La cible de mesure WebAssembly ne vit plus ici.** Elle a suivi le sommet du
# graphe, la crate de la boutique (TASK-81 bis) : posée ici depuis TASK-40, elle
# ignorait toute la boutique, et l'écart jouait à la baisse, donc sans
# déclencher la porte de taille. Une seule cible dans le workspace, et la CI
# interdit qu'une seconde se déclare ailleurs.

# **Première et seule dépendance d'une crate de jeu vers le harnais, et
# uniquement pour le test d'accord.** Une seconde ferait de l'instrument une
# brique du jeu, et le jeu embarquerait le parallélisme, la ligne de commande
# et le tableur.
#
# Elle ne crée aucun cycle : le harnais ne dépend d'aucune crate de jeu, et une
# dépendance de développement n'entre pas dans l'arbre normal — mesuré, celui du
# harnais reste sans aucun paquet du moteur graphique.
#
# **`rand_chacha` est là parce que le contrat de décision nomme le type du
# générateur dans sa signature**, et que le harnais ne le ré-exporte pas :
# mesuré, sans cette ligne le fichier de test ne compile pas.
[dev-dependencies]
sim_harness = { path = "../sim_harness", version = "0.1.0" }
rand_chacha = { workspace = true }
rand = { workspace = true }
# **Le compilateur de shaders, pour les tests seulement** (TASK-89) : les
# shaders de l'étape sont composés avec des bouchons des bibliothèques de Bevy
# puis validés par naga, ce qu'aucun test headless ne fait autrement. Les deux
# versions sont celles que `bevy_shader` tire déjà : aucun paquet de plus dans
# le lock. Épinglées, parce qu'un `naga_oil` d'une autre version que celui de
# Bevy ne validerait pas les mêmes shaders.
naga_oil = "=0.22.0"
naga = { version = "=29.0.4", features = ["wgsl-in"] }
